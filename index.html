  k.zuurbakGroep=GROEPEN[c.zuurbakGroep]?c.zuurbakGroep:'';k.volReferentie=cfNum(c.volReferentie);k.volBatch=cfNum(c.volBatch);k.volZuurbak=cfNum(c.volZuurbak);
  WERKBAKKEN.forEach(w=>{k.volWerkbak[w.bak]=cfNum(c.volWerkbak&&c.volWerkbak[w.bak]);});
  TUSSENBAKKEN.forEach(t=>{k.volTussenbak[t]=cfNum(c.volTussenbak&&c.volTussenbak[t]);});
  for(let s=0;s<MAX_SPOREN;s++)k.volSporenbak[s]=cfNum(Array.isArray(c.volSporenbak)?c.volSporenbak[s]:null);
  (Array.isArray(c.bronnen)?c.bronnen:[]).forEach(b=>{const n=Number(b&&b.nr);if(!k.bron[n])return;
    k.bron[n]={naam:b.naam!=null?String(b.naam):'',groep:GROEPEN[b.groep]?b.groep:'',lektestS:cfNum(b.lektestS)};});
  return k;}
/* zonder configuratie in de PLC: een startpunt uit de IO-mapping (aantallen en namen) en uit het ontwerp
   (referentievolume 1000 L en batch rond de 800 L, §9.1; werkbakken 1000 L, §3.4). Groep, lektest en de andere inhouden blijven leeg. */
function cfUitIo(){const k=cfLeeg();k.vanIo=true;
  k.aantalMeststof=Math.max(CFG_G.mest[0],Math.min(CFG_G.mest[1],HW_MEST.length));k.aantalSporenbak=Math.min(CFG_G.sporen[1],HW_SPOREN.length);
  HW_MEST.forEach(h=>{k.bron[h.nr].naam=h.naamIo;});HW_SPOREN.forEach(h=>{k.bron[h.nr].naam=h.naamIo;});
  k.volReferentie=1000;k.volBatch=800;WERKBAKKEN.forEach(w=>{k.volWerkbak[w.bak]=1000;});return k;}
function cfBegin(){const c=cfg();return c?cfUitPlc(c):cfUitIo();}
function cfActief(k){const a=[];const nM=cfIsGetal(k.aantalMeststof)?Math.min(MAX_MEST,Math.floor(k.aantalMeststof)):0;
  const nS=cfIsGetal(k.aantalSporenbak)?Math.min(MAX_SPOREN,Math.floor(k.aantalSporenbak)):0;
  for(let n=1;n<=nM;n++)a.push(n);for(let s=1;s<=nS;s++)a.push(SPOREN_START+s);return a;}
/* de toetsen: dezelfde als in de nabootsing, straks in de brug, en in de PLC (codes 192-197) */
function cfFouten(k){const f=[];const [m0,m1]=CFG_G.mest,[s0,s1]=CFG_G.sporen,[l0,l1]=CFG_G.lektest;
  const nM=k.aantalMeststof,nS=k.aantalSporenbak;
  if(!(Number.isInteger(nM)&&nM>=m0&&nM<=m1))f.push({n:0,tekst:'Aantal mestbakken: '+m0+' tot '+m1+'.'});
  else if(nM>HW_MEST.length)f.push({n:0,tekst:'Deze machine heeft '+HW_MEST.length+' mestbakken in de IO-mapping.'});
  if(!(Number.isInteger(nS)&&nS>=s0&&nS<=s1))f.push({n:0,tekst:'Aantal sporenbakken: '+s0+' tot '+s1+'.'});
  else if(nS>HW_SPOREN.length)f.push({n:0,tekst:'Deze machine heeft '+HW_SPOREN.length+' sporenbakken in de IO-mapping.'});
  const namen={};
  cfActief(k).forEach(n=>{const b=k.bron[n];const w=cfWie(n);const nm=String(b.naam||'').trim();
    if(!nm)f.push({n,tekst:w+': naam ontbreekt.'});
    else if(nm.length>CFG_G.naamMax)f.push({n,tekst:w+': naam langer dan '+CFG_G.naamMax+' tekens.'});
    else{const key=nm.toLowerCase();if(namen[key])f.push({n,tekst:w+': "'+nm+'" staat al bij '+namen[key]+'.'});else namen[key]=w.toLowerCase();}
    if(!GROEPEN[b.groep])f.push({n,tekst:w+': kies A, B of A+B.'});
    if(!(Number.isInteger(b.lektestS)&&b.lektestS>=l0&&b.lektestS<=l1))f.push({n,tekst:w+': lektest '+l0+' tot '+l1+' s, in hele seconden.'});
    if(isSporen(n)){const v=k.volSporenbak[n-SPOREN_START-1];if(!(cfIsGetal(v)&&v>0))f.push({n,tekst:w+': inhoud in liters.'});}});
  if(!GROEPEN[k.zuurbakGroep])f.push({n:0,tekst:'Zuurbak: kies A, B of A+B.'});
  if(!(cfIsGetal(k.volZuurbak)&&k.volZuurbak>0))f.push({n:0,tekst:'Zuurbak: inhoud in liters.'});
  WERKBAKKEN.forEach(w=>{const v=k.volWerkbak[w.bak];if(!(cfIsGetal(v)&&v>0))f.push({n:0,tekst:'Werkbak '+w.bak+': inhoud in liters.'});});
  TUSSENBAKKEN.forEach(t=>{const v=k.volTussenbak[t];if(!(cfIsGetal(v)&&v>0))f.push({n:0,tekst:'Tussenbak '+t.slice(2)+': inhoud in liters.'});});
  /* het batchvolume (sinds 22-09 hier): minstens batchMin, en het moet in elke tussenbak passen; harde eis, ook in de PLC (code 197) */
  const tb=TUSSENBAKKEN.map(t=>k.volTussenbak[t]);const kl=tb.every(v=>cfIsGetal(v)&&v>0)?Math.min(...tb):null;
  if(!(cfIsGetal(k.volBatch)&&k.volBatch>=CFG_G.batchMin))f.push({n:0,tekst:'Batchvolume: minstens '+CFG_G.batchMin+' L.'});
  else if(kl!==null&&k.volBatch>kl)f.push({n:0,tekst:'Batchvolume: '+fix(k.volBatch,0)+' L past niet in de kleinste tussenbak ('+fix(kl,0)+' L).'});
  if(!(cfIsGetal(k.volReferentie)&&k.volReferentie>0))f.push({n:0,tekst:'Referentievolume van het invulschema in liters.'});
  return f;}
/* wat er anders is dan in de PLC */
function cfWijzigingen(){if(!cf)return [];const c=cfg();
  if(!c)return cf.bewerkt||cf.vanIo?['Nieuwe configuratie: de PLC meldt er nog geen.']:[];
  const p=cfUitPlc(c);const w=[];const t=v=>v===''||v==null?'leeg':String(v);const pijl=(a,b)=>t(a)+' → '+t(b);
  if(!cfGelijk(p.aantalMeststof,cf.aantalMeststof))w.push('Mestbakken: '+pijl(p.aantalMeststof,cf.aantalMeststof));
  if(!cfGelijk(p.aantalSporenbak,cf.aantalSporenbak))w.push('Sporenbakken: '+pijl(p.aantalSporenbak,cf.aantalSporenbak));
  if(p.zuurbakGroep!==cf.zuurbakGroep)w.push('Zuurbak mag krijgen: '+pijl(gNaam(p.zuurbakGroep),gNaam(cf.zuurbakGroep)));
  if(!cfGelijk(p.volZuurbak,cf.volZuurbak))w.push('Inhoud zuurbak: '+pijl(p.volZuurbak,cf.volZuurbak)+' L');
  if(!cfGelijk(p.volReferentie,cf.volReferentie))w.push('Referentievolume: '+pijl(p.volReferentie,cf.volReferentie)+' L');
  TUSSENBAKKEN.forEach(t=>{if(!cfGelijk(p.volTussenbak[t],cf.volTussenbak[t]))w.push('Inhoud tussenbak '+t.slice(2)+': '+pijl(p.volTussenbak[t],cf.volTussenbak[t])+' L');});
  if(!cfGelijk(p.volBatch,cf.volBatch))w.push('Batchvolume: '+pijl(p.volBatch,cf.volBatch)+' L');
  WERKBAKKEN.forEach(x=>{if(!cfGelijk(p.volWerkbak[x.bak],cf.volWerkbak[x.bak]))w.push('Inhoud '+x.bak+': '+pijl(p.volWerkbak[x.bak],cf.volWerkbak[x.bak])+' L');});
  const inP=cfActief(p),inC=cfActief(cf);
  [...new Set([...inP,...inC])].sort((a,b)=>a-b).forEach(n=>{const a=p.bron[n],b=cf.bron[n];
    const wie=cfWie(n)+' ('+(String(b.naam||a.naam||'').trim()||'zonder naam')+')';
    if(inP.includes(n)&&!inC.includes(n)){w.push(wie+': valt weg');return;}
    if(!inP.includes(n)){w.push(wie+': komt erbij');return;}
    if(String(a.naam).trim()!==String(b.naam).trim())w.push(wie+': naam '+pijl(a.naam,b.naam));
    if(a.groep!==b.groep)w.push(wie+': groep '+pijl(gNaam(a.groep),gNaam(b.groep)));
    if(!cfGelijk(a.lektestS,b.lektestS))w.push(wie+': lektest '+pijl(a.lektestS,b.lektestS)+' s');
    if(isSporen(n)){const i=n-SPOREN_START-1;if(!cfGelijk(p.volSporenbak[i],cf.volSporenbak[i]))w.push(wie+': inhoud '+pijl(p.volSporenbak[i],cf.volSporenbak[i])+' L');}});
  return w;}
/* wat het concept betekent voor de recepten die de PLC nu heeft */
function cfGevolgen(){const r=receptenBlok();if(!r||!cf)return [];const uit=[];const act=cfActief(cf);

    const m=/^SP([1-5])$/.exec(bak);return m?cf.bron[SPOREN_START+Number(m[1])].groep:'';};
  Object.keys(r).forEach(bak=>{const lijst=r[bak];if(!Array.isArray(lijst))return;
    const m=/^SP([1-5])$/.exec(bak);if(m&&!act.includes(SPOREN_START+Number(m[1])))return;
    lijst.forEach((x,i)=>{const n=i+1;const v=norm(x);if(!v||!(Number(v.v)>0)||!cf.bron[n])return;
      const nm=String(cf.bron[n].naam||stofNaam(n)).trim();
      if(!act.includes(n))uit.push('Recept '+bak+': '+nm+' valt weg; '+fix(Number(v.v),1)+' L '+perRef()+' wordt 0.');
      else if(!groepPast(cf.bron[n].groep,bakG(bak)))uit.push('Recept '+bak+': '+nm+' ('+gNaam(cf.bron[n].groep)+') past niet in een bak van groep '+gNaam(bakG(bak))+'. Die beurt start niet tot het recept is aangepast.');});});
  return uit;}
/* wijzigen kan alleen als er niets loopt (code 190); de PLC beslist, dit scherm kijkt vooraf */
function cfInRust(){const st=stand();

  if(!st)return {ok:false,tekst:'De PLC meldt geen modus: toepassen kan nu niet.'};
  const m=String(st.modus||'');const nm=modusInfo(m)?modusInfo(m).naam:m;

/* de hele set in één opdracht; 'verwerkt' pas als de PLC de nieuwe versie met deze waarden teruggeeft */
async function cfToepassen(knop,uit){
  const k=cf;if(cfFouten(k).length){uit.innerHTML=`<div class="check-banner error"><div class="cb-h">${ic('warn',16,2)} Er klopt nog iets niet</div><div>Er is niets verstuurd.</div></div>`;return;}

    volReferentie:k.volReferentie,volBatch:k.volBatch,volWerkbak:Object.assign({},k.volWerkbak),volTussenbak:Object.assign({},k.volTussenbak),volZuurbak:k.volZuurbak,volSporenbak:k.volSporenbak.slice(0,MAX_SPOREN),
    bronnen:cfActief(k).map(n=>({nr:n,naam:String(k.bron[n].naam).trim(),groep:k.bron[n].groep,lektestS:k.bron[n].lektestS}))};
  knop.disabled=true;uit.innerHTML=`<div class="hw-hint">${ic('clock',14,2)} Verstuurd naar de brug…</div>`;
  const r=await opdracht('configuratie',lading);
  if(!r.ok){const waarom=r.status===501?nietNaarPlc('de configuratie'):r.status===423?'De machine is niet in rust.':r.status===409?'De configuratie in de PLC is intussen gewijzigd; begin opnieuw vanaf de nieuwe versie.':'';
    uit.innerHTML=`<div class="check-banner error"><div class="cb-h">${ic('warn',16,2)} Niet overgenomen</div><div>${esc(waarom)}${r.status===501?'':' '+esc(r.fout||'')}</div></div>`;knop.disabled=false;return;}
  uit.innerHTML=`<div class="hw-hint">${ic('clock',14,2)} De brug nam het aan. Wachten tot ${wieBron()} de nieuwe versie teruggeeft…</div>`;
  const verwacht=r.antwoord&&r.antwoord.versie!=null?Number(r.antwoord.versie):null;
  /* de bevestiging haalt zelf verse momentopnamen op, en wacht niet op de gewone ronde (skill: naslag-bedienlaag §2) */
  haalBron();const tik=setInterval(haalBron,1000);
  const ok=await wachtOp(()=>{const c=cfg();if(!c)return false;if(verwacht!==null&&Number(c.versie)!==verwacht)return false;return cfKlopt(lading,c);},10000);
  clearInterval(tik);
  if(ok){cf=cfUitPlc(cfg());cfTeken();
    uit.innerHTML=`<div class="check-banner" style="border-color:var(--ok)"><div class="cb-h" style="color:var(--ok)">${ic('check',16,2)} Verwerkt: ${wieBron()} geeft versie ${esc(String(cfg().versie))} terug, met deze waarden</div><div>Het hele dashboard volgt nu deze configuratie.</div></div>`;}
  else{uit.innerHTML=`<div class="check-banner warn"><div class="cb-h">${ic('warn',16,2)} Niet bevestigd</div><div>De brug nam het aan, maar binnen 10 s gaf ${wieBron()} deze configuratie niet terug.</div></div>`;knop.disabled=false;}}
function cfKlopt(l,c){const p=cfUitPlc(c);
  if(!cfGelijk(p.aantalMeststof,l.aantalMeststof)||!cfGelijk(p.aantalSporenbak,l.aantalSporenbak)||p.zuurbakGroep!==l.zuurbakGroep)return false;
  if(!cfGelijk(p.volZuurbak,l.volZuurbak)||!cfGelijk(p.volReferentie,l.volReferentie)||!cfGelijk(p.volBatch,l.volBatch))return false;
  if(WERKBAKKEN.some(w=>!cfGelijk(p.volWerkbak[w.bak],l.volWerkbak[w.bak])))return false;
  if(TUSSENBAKKEN.some(t=>!cfGelijk(p.volTussenbak[t],l.volTussenbak[t])))return false;
  return l.bronnen.every(b=>{const q=p.bron[b.nr];if(!q||String(q.naam).trim()!==b.naam||q.groep!==b.groep||!cfGelijk(q.lektestS,b.lektestS))return false;

   ${groep('Aanzuigkleppen',[PID.water[1],...schemaBronnen().map(nr=>hwBron(nr).aanzuig)].filter(Boolean))}

   <div class="card card-pad"><div class="eyebrow" style="margin-bottom:8px">De harde regels (ontwerp §8.1)</div>

function mountHand(){$$('tr[data-ref]').forEach(tr=>tr.onclick=()=>openComponent(tr.dataset.ref));}

  $$('tr[data-ref]').forEach(tr=>{const r=tr.dataset.ref;const c=COMP[r];if(!c)return;
    const u=r==='FCS1'?doVan(r,'vrijgave'):doVan(r);const a=document.getElementById('hd-'+r);

/* ==================================================================
   KALIBRATIE (service) - besluit Wessel 22-09, kennisbank 4-hmi\04-kalibratie.md.
   Eén plek voor het kalibreren:
   - de flowmeter: het pulsgewicht (L/puls) invullen, of meten met een
     maatbeker (tellerstand vóór en na, en de gemeten liters);
   - de niveaumetingen: een nul- en een toppunt in ruwe waarden van de
     module. 'Nu vastleggen' neemt het gemiddelde over 10 s, met de spreiding.
   Toepassen: één ijking per aanvraag (POST /command/kalibratie), alleen in
   rust. De PLC toetst (codes 200-205) en zet de datum. 'Verwerkt' pas als de
   momentopname de nieuwe versie met deze waarden toont.
   ================================================================== */
const KAL_G=ONTWERP.kalibratie;
let kbFm=null;   /* concept flowmeter: het nieuwe pulsgewicht en de maatbeker-hulp */
let kbIj=null;   /* de open ijking van een niveaumeting */
function kbGetal(raw){const t=String(raw==null?'':raw).trim().replace(',','.');if(t==='')return '';const v=Number(t);return Number.isFinite(v)?v:NaN;}
function kbIsGetal(v){return typeof v==='number'&&Number.isFinite(v);}
function kbIsFoutcode(v){if(!kbIsGetal(v))return false;const w=v&0xFFFF;return w===0x8001||w===0x8002;}
function kbFmNu(){const k=kal();const v=k?Number(k.pulsGewicht):NaN;return Number.isFinite(v)&&v>0?v:null;}
function kbTeller(){const k=kanaalVan('FC01');const n=k?kanaal(k.sleutel):null;return n&&kbIsGetal(n.v)?n.v:null;}
/* de niveaumetingen van de bakken in gebruik (een sporenbak die niet in gebruik is, niet) */
function kbSensoren(){const sp=new Set(sporenInGebruik().map(h=>h.loc));
  return MACHINE.componenten.filter(c=>c.soort==='Niveausensor'&&(!/^SP/.test(BAK_VAN_LOC[c.loc]||'')||sp.has(c.loc)));}

function viewKalibratie(){
  return `<div id="kb-wrap"><div class="page-head"><div class="titles"><h1>Kalibratie</h1><p>De flowmeter en de niveaumetingen · wat je hier overneemt, rekent de PLC mee</p></div></div>
   <div id="kb-kop"></div>
   <div class="card" style="margin-bottom:16px"><div class="card-h"><h3>Flowmeter FC 01</h3><span class="sub">pulsgewicht: hoeveel liter één puls is · fabrieksopgave 252 pulsen per liter</span></div><div class="card-pad" id="kb-fm"></div></div>
   <div class="card"><div class="card-h"><h3>Niveaumetingen</h3><span class="sub">ijken met twee punten, in ruwe waarden van de module: geen mA nodig</span></div><div id="kb-niv"></div>
    <div class="hw-hint" style="padding:10px 14px">${ic('info',14,2)} <span>Ruw is de waarde zoals de module hem meldt. "‹ 3,6 mA" is een open klem of een onderbroken lus; daarmee kan niet geijkt worden. Voor het ijken is de omrekening naar mA niet nodig.</span></div></div></div>`;
}
function mountKalibratie(){
  if(!kbFm)kbFm={lp:'',t1:null,t2:null,gemeten:''};
  const w=$('#kb-wrap');w.addEventListener('input',kbInvoer);w.addEventListener('click',kbKlik);
  kbTekenFm();kbTekenNiv();kbTekenIj();kbKop();
}
function verversKalibratie(){kbKop();kbFmLive();kbNivLive();kbIjLive();}
function kbKop(){const el=$('#kb-kop');if(!el)return;const k=kal();const r=cfInRust();
  if(!vers().ok){el.innerHTML=`<div class="check-banner warn" style="margin-bottom:16px"><div class="cb-h">${ic('network',16,2)} Geen actuele gegevens van de PLC</div><div>Ijken kan nu niet. Zie de balk bovenaan.</div></div>`;return;}
  if(!k){el.innerHTML=`<div class="check-banner warn" style="margin-bottom:16px"><div class="cb-h">${ic('info',16,2)} De PLC meldt geen kalibratie</div><div>Er is nog geen PLC-programma met de kalibratie, of de brug geeft hem niet door. Je ziet de ruwe waarden en je kunt alles voorbereiden; overnemen kan pas als de PLC de kalibratie kent.</div></div>`;return;}
  el.innerHTML=`<div class="cf-status ${r.ok?'ok':'bezig'}">${ic(r.ok?'check':'lock',16,2)} <span>${esc(r.ok?'De machine is in rust: ijken kan.':'Er loopt iets: ijken kan alleen in rust.')}</span><span class="muted-2 mono" style="margin-left:auto">kalibratie in de PLC: versie ${esc(String(k.versie))}</span></div>`;}

/* ---- de flowmeter ------------------------------------------------ */
function kbTekenFm(){const el=$('#kb-fm');if(!el||!kbFm)return;const f=kbFm;const v=kbGetal(f.lp);
  el.innerHTML=`<div class="kb-rij"><span class="k">In de PLC</span><span class="v mono" id="kb-fm-nu">${STREEP}</span></div>
   <div class="kb-rij"><span class="k">Nieuw pulsgewicht</span>
     <div class="cf-getal inh kb-lp"><input data-kb="lp" inputmode="decimal" value="${esc(f.lp)}" placeholder="0,003968" aria-label="Liter per puls"><span>L/puls</span></div>
     <span class="muted-2">of</span>
     <div class="cf-getal inh"><input data-kb="pl" inputmode="decimal" value="${v>0?esc(fix(1/v,1)):''}" placeholder="252,0" aria-label="Pulsen per liter"><span>pulsen per liter</span></div></div>
   <div class="kb-hulp"><div class="kb-rij" style="margin:0 0 6px"><span class="eyebrow">Hulp: meten met een maatbeker</span><span class="muted-2 mono" id="kb-tnu"></span></div>
     <!-- vier gelijke rijen: nummer, wat, waarde, en rechts in één kolom de knop (22-09 avond) -->
     <div class="kb-stap"><span class="kb-nr">1</span><span class="k">Tellerstand vóór</span><span class="mono" id="kb-t1">${f.t1===null?STREEP:fix(f.t1,0)}</span><button type="button" class="btn sm" data-kbstap="t1">Vastleggen</button></div>
     <div class="kb-stap"><span class="kb-nr">2</span><span class="kb-tekst">Doseer met de hand in een maatbeker, of in een bak waarvan je de inhoud kent.</span></div>
     <div class="kb-stap"><span class="kb-nr">3</span><span class="k">Tellerstand na</span><span class="kb-vw"><span class="mono" id="kb-t2">${f.t2===null?STREEP:fix(f.t2,0)}</span><span class="muted" id="kb-tp"></span></span><button type="button" class="btn sm" data-kbstap="t2">Vastleggen</button></div>
     <div class="kb-stap"><span class="kb-nr">4</span><span class="k">Werkelijk gemeten</span><span class="kb-vw"><div class="cf-getal inh"><input data-kb="gemeten" inputmode="decimal" value="${esc(f.gemeten)}" placeholder="liter" aria-label="Gemeten liters"><span>L</span></div><span class="mono" id="kb-rk"></span></span><button type="button" class="btn sm" data-kbstap="gebruik">Gebruik deze waarde</button></div></div>
   <div id="kb-fm-afw" style="margin-top:12px"></div>
   <div class="kb-rij" style="margin-top:12px"><button type="button" class="btn primary" data-kbstap="fm-ok">${ic('check',16,2.2)} Controleren en toepassen</button></div>`;
  kbFmLive();kbFmAfwijking();}
function kbFmLive(){const el=$('#kb-fm-nu');const k=kal();const v=kbFmNu();
  if(el)el.innerHTML=!k?STREEP:v?(`${fix(v,6)} L/puls <span class="muted-2">= ${fix(1/v,1)} pulsen per liter · geijkt ${esc(datumTekst(k.pulsDatum))}</span>`)
    :`<span style="color:var(--warn)">niet geijkt</span> <span class="muted-2">· de PLC rekent met de fabriekswaarde 1/252</span>`;
  const tn=$('#kb-tnu');if(tn){const t=kbTeller();tn.textContent=t===null?'':('tellerstand nu '+fix(t,0));}
  kbFmReken();}
function kbMaatbeker(){const f=kbFm;const g=kbGetal(f.gemeten);if(f.t1===null||f.t2===null||!(g>0))return null;const p=f.t2-f.t1;return p>0?g/p:null;}
function kbFmReken(){if(!kbFm)return;const f=kbFm;const tp=$('#kb-tp');const r=$('#kb-rk');
  if(tp)tp.textContent=f.t1!==null&&f.t2!==null?(f.t2>f.t1?('= '+fix(f.t2-f.t1,0)+' pulsen'):'geen pulsen: er stroomde niets'):'';
  const v=kbMaatbeker();if(r)r.textContent=v===null?'':('→ '+fix(v,6)+' L/puls ('+fix(1/v,1)+' pulsen per liter)');}
function kbFmAfwijking(){const el=$('#kb-fm-afw');if(!el||!kbFm)return;const v=kbGetal(kbFm.lp);
  if(v===''){el.innerHTML='';return;}
  if(!(v>0)){el.innerHTML=`<div class="cf-st fout">Vul een getal groter dan 0 in.</div>`;return;}
  const nu=kbFmNu();const aNu=nu?(v/nu-1)*100:null;const aDs=(v/KAL_G.pulsOntwerp-1)*100;const a=aNu!==null?aNu:aDs;
  const pct=x=>x===null?STREEP:((x>=0?'+':'')+fix(x,1)+' %');
  el.innerHTML=`<div class="kb-rij"><span class="k">Afwijking</span><span class="mono">tegenover nu ${pct(aNu)} · tegenover het datasheet ${pct(aDs)}</span></div>`+
   (v<KAL_G.pulsMin||v>KAL_G.pulsMax?`<div class="cf-st fout">${ic('warn',15,2)} Buiten 200 tot 315 pulsen per liter: de PLC weigert dit (code 202).</div>`
    :Math.abs(a)>KAL_G.waarschuwPct?`<div class="cf-st" style="color:var(--warn)">${ic('warn',15,2)} Meer dan ${KAL_G.waarschuwPct} % anders: dan is er eerder iets mis met de meter dan met de kalibratie (ontwerp §9.4). Toepassen vraagt een extra bevestiging.</div>`
    :`<div class="cf-st ok">${ic('check',15,2)} Binnen ${KAL_G.waarschuwPct} %.</div>`);}
function kbFmControleer(){const v=kbGetal(kbFm.lp);
  if(!(v>0)){toast('Vul eerst een nieuw pulsgewicht in','warn');return;}
  const nu=kbFmNu();const rust=cfInRust();const grens=v<KAL_G.pulsMin||v>KAL_G.pulsMax;const a=(v/(nu||KAL_G.pulsOntwerp)-1)*100;const veel=Math.abs(a)>KAL_G.waarschuwPct;
  openModal(`${ic('gauge',18,2)} Pulsgewicht flowmeter FC 01`,`<div class="cf-mod">
    <div class="kv"><span class="k">Nu in de PLC</span><span class="v mono">${nu?(fix(nu,6)+' L/puls · '+fix(1/nu,1)+' pulsen per liter'):'niet geijkt (fabriekswaarde 1/252)'}</span></div>
    <div class="kv"><span class="k">Nieuw</span><span class="v mono">${fix(v,6)} L/puls · ${fix(1/v,1)} pulsen per liter</span></div>
    <div class="kv"><span class="k">Afwijking</span><span class="v mono">${(a>=0?'+':'')+fix(a,1)} %</span></div>
    ${grens?`<div class="check-banner error" style="margin-top:10px"><div class="cb-h">${ic('warn',16,2)} Buiten 200 tot 315 pulsen per liter</div><div>De PLC weigert dit. Kijk de meter en de meting na.</div></div>`:''}
    ${!grens&&veel?`<div class="check-banner warn" style="margin-top:10px"><div class="cb-h">${ic('warn',16,2)} Meer dan ${KAL_G.waarschuwPct} % anders</div><div>Dan is er eerder iets mis met de meter dan met de kalibratie (ontwerp §9.4).
      <label class="kb-zeker"><input type="checkbox" id="kb-zeker"> De meter is nagekeken; ik neem deze waarde toch over.</label></div></div>`:''}
    ${!rust.ok?`<div class="check-banner warn" style="margin-top:10px"><div class="cb-h">${ic('lock',16,2)} ${esc(rust.tekst.replace('toepassen kan pas','ijken kan pas'))}</div></div>`:''}
    <div style="display:flex;gap:8px;margin-top:14px">${!grens&&rust.ok?`<button type="button" class="btn primary" id="kb-ok">${ic('check',16,2.2)} Toepassen in de PLC</button>`:''}<button type="button" class="btn" id="kb-x">Terug</button></div>
    <div id="kb-uit" style="margin-top:12px"></div></div>`);
  $('#kb-x').onclick=closeModal;const ok=$('#kb-ok');
  if(ok)ok.onclick=()=>{if(veel&&!($('#kb-zeker')&&$('#kb-zeker').checked)){$('#kb-uit').innerHTML=`<div class="check-banner warn"><div class="cb-h">${ic('warn',16,2)} Vink eerst aan dat de meter is nagekeken</div></div>`;return;}
    kbToepassen(ok,$('#kb-uit'),{soort:'flowmeter',pulsGewicht:v},c=>Math.abs(Number(c.pulsGewicht)-v)<1e-9&&Number(c.pulsDatum)>0);};}

/* ---- de niveaumetingen --------------------------------------------- */
/* het ijkvenster opent direct onder de regel van de sensor, en het scherm schuift erheen (22-09, Wessel: "als je op
   ijken drukt dat het direct bij de sensor springt, anders lijkt het alsof er niks gebeurt"). Er is er één tegelijk open. */
function kbTekenNiv(){const el=$('#kb-niv');if(!el)return;const ss=kbSensoren();
  el.innerHTML=`<table class="tbl kb-niv-tbl"><thead><tr><th>Sensor</th><th>Soort</th><th class="r">Ruw nu</th><th class="r">Volgens de PLC</th><th class="r">Nulpunt</th><th class="r">Toppunt</th><th>Geijkt</th><th></th></tr></thead><tbody>${ss.map(c=>
    `<tr id="kb-rij-${esc(c.ref)}"><td><b>${esc(locNaam(c.loc))}</b> <span class="mono muted-2">${esc(c.ref)}</span></td><td class="muted" style="font-size:12.5px">${esc(String(c.uitvoering||'').split(',')[0])}</td>
     <td class="r mono" id="kb-r-${esc(c.ref)}">${STREEP}</td><td class="r mono" id="kb-w-${esc(c.ref)}">${STREEP}</td><td class="r mono" id="kb-n-${esc(c.ref)}">${STREEP}</td><td class="r mono" id="kb-t-${esc(c.ref)}">${STREEP}</td><td id="kb-d-${esc(c.ref)}">${STREEP}</td>
     <td class="r"><button type="button" class="btn sm" data-ijk="${esc(c.ref)}">${ic('gauge',14,2)} Ijken</button></td></tr>
    <tr class="kb-ij-rij" id="kb-ijr-${esc(c.ref)}" hidden><td colspan="8" id="kb-ijc-${esc(c.ref)}"></td></tr>`).join('')}</tbody></table>`;
  kbNivLive();}
function kbNivLive(){const k=kal();kbSensoren().forEach(c=>{const kn=kanaalVan(c.ref);
  const r=document.getElementById('kb-r-'+c.ref);if(r)r.innerHTML=kn?kanaalTekst(kn):STREEP;
  const w=document.getElementById('kb-w-'+c.ref);const x=waarde(c.ref);if(w)w.innerHTML=x?(tekstWaarde(x,0)+' '+qVlag(x)):(k&&!isGeijkt(c.ref)?'<span class="muted-2">niet geijkt</span>':STREEP);
  const ij=ijkingVan(c.ref);const g=isGeijkt(c.ref);const pt=(raw,l)=>`${fix(Number(l),0)} L <span class="muted-2">bij ${fix(Number(raw),0)}</span>`;
  const n=document.getElementById('kb-n-'+c.ref);if(n)n.innerHTML=g?pt(ij.rawNul,ij.literNul):STREEP;
  const t=document.getElementById('kb-t-'+c.ref);if(t)t.innerHTML=g?pt(ij.rawTop,ij.literTop):STREEP;
  const d=document.getElementById('kb-d-'+c.ref);if(d)d.innerHTML=!k?STREEP:g?esc(datumTekst(ij.datum)):pill('warn','niet geijkt');});}
function kbOpenIjk(ref){
  /* dezelfde sensor nog eens: niets wissen, alleen erheen schuiven */
  if(!kbIj||kbIj.ref!==ref){const ij=ijkingVan(ref);const g=isGeijkt(ref);
    kbIj={ref,nul:{raw:g?Number(ij.rawNul):'',liter:g?Number(ij.literNul):0},top:{raw:g?Number(ij.rawTop):'',liter:g?Number(ij.literTop):''},bezig:null,spreiding:{nul:'',top:''}};
    kbTekenIj();}
  const rij=document.getElementById('kb-rij-'+ref);
  /* vloeiend schuiven, behalve bij "minder beweging" of een verborgen venster (daar loopt een animatie niet) */
  if(rij)rij.scrollIntoView({behavior:(document.hidden||(typeof svBeweging==='function'&&!svBeweging()))?'auto':'smooth',block:'start'});}
function kbTekenIj(){
  /* één venster tegelijk: alle andere regels dicht, de gekozen regel gemarkeerd */
  $$('#kb-niv .kb-ij-rij').forEach(r=>{if(!kbIj||r.id!=='kb-ijr-'+kbIj.ref){r.hidden=true;const td=r.firstElementChild;if(td)td.innerHTML='';}});
  $$('#kb-niv tr.kb-sel').forEach(r=>r.classList.remove('kb-sel'));
  if(!kbIj)return;const el=document.getElementById('kb-ijc-'+kbIj.ref);if(!el)return;
  document.getElementById('kb-ijr-'+kbIj.ref).hidden=false;const sr=document.getElementById('kb-rij-'+kbIj.ref);if(sr)sr.classList.add('kb-sel');
  const c=COMP[kbIj.ref];const cap=bakInhoud(BAK_VAN_LOC[c.loc]);
  /* twee gelijke kaarten: de uitleg even hoog, daaronder vaste kolommen (label, vak), en de knop onder de vakken */
  const punt=(p,titel,uitleg)=>{const x=kbIj[p];return `<div class="kb-punt"><div class="kb-punt-h">${titel}</div><div class="kb-punt-u">${uitleg}</div>
    <div class="kb-velden">
      <span class="k">Liters</span><div class="cf-getal inh"><input data-kbij="${p}-liter" inputmode="decimal" value="${x.liter===''?'':esc(String(x.liter))}" placeholder="liter" aria-label="Liters ${titel}"><span>L</span></div>
      <span class="k">Ruw</span><div class="cf-getal inh"><input data-kbij="${p}-raw" inputmode="numeric" value="${x.raw===''?'':esc(String(x.raw))}" placeholder="ruw" aria-label="Ruwe waarde ${titel}"><span class="muted-2">van de module</span></div>
      <span></span><button type="button" class="btn kb-vast" data-kbvast="${p}">${ic('gauge',15,2)} Nu vastleggen (${KAL_G.vastleggenS} s)</button>
    </div>
    <div class="kb-sp" id="kb-sp-${p}">${esc(kbIj.spreiding[p]||'')}</div></div>`;};
  el.innerHTML=`<div class="kb-ijk"><div class="kb-ijk-h"><h3>Ijken: ${esc(locNaam(c.loc))} <span class="mono muted-2">${esc(c.ref)}</span></h3><button type="button" class="btn sm" data-kbstap="ij-x">Sluiten</button></div>
    <div class="kb-punten">${punt('nul','Nulpunt','Zet de bak leeg, of op een bekend laag niveau. Meestal 0 liter.')}${punt('top','Toppunt','Vul de bak tot een bekend niveau, bijvoorbeeld geteld met de flowmeter.'+(cap?(' Inhoud volgens de configuratie: '+fix(cap,0)+' L.'):''))}</div>
    <div id="kb-ij-uit" style="margin:12px 0"></div>
    <div class="kb-rij"><button type="button" class="btn primary" data-kbstap="ij-ok">${ic('check',16,2.2)} Controleren en toepassen</button></div></div>`;
  kbIjLive();}
/* dezelfde toetsen als de PLC (203-205); de rust (200) en de versie (201) toetst het toepassen */
function kbIjFouten(){const x=kbIj;if(!x)return ['Er is geen ijking open.'];const f=[];const c=COMP[x.ref];const cap=bakInhoud(BAK_VAN_LOC[c.loc]);
  if(!kbIsGetal(x.nul.raw)||!kbIsGetal(x.top.raw))f.push('Leg het nulpunt en het toppunt vast, of vul de ruwe waarden in.');
  else{if(kbIsFoutcode(x.nul.raw)||kbIsFoutcode(x.top.raw))f.push('Een ruwe waarde is een foutcode van de module (open klem of boven het bereik).');
    else if(x.top.raw-x.nul.raw<KAL_G.minSpan)f.push('Het toppunt moet minstens '+fix(KAL_G.minSpan,0)+' ruw boven het nulpunt liggen.');}
  if(!kbIsGetal(x.nul.liter)||!kbIsGetal(x.top.liter))f.push('Vul bij beide punten de liters in.');
  else{if(!(x.top.liter>x.nul.liter))f.push('Het toppunt moet meer liters hebben dan het nulpunt.');
    if(x.nul.liter<0)f.push('Liters kunnen niet onder 0.');
    if(cap&&x.top.liter>cap)f.push('Meer liters dan de bak volgens de configuratie heeft ('+fix(cap,0)+' L).');}
  return f;}
function kbIjLive(){const el=$('#kb-ij-uit');if(!el||!kbIj)return;const f=kbIjFouten();const x=kbIj;
  if(f.length){el.innerHTML=`<div class="cf-st fout">${f.map(esc).join('<br>')}</div>`;return;}
  const kn=kanaalVan(x.ref);const n=kn?kanaal(kn.sleutel):null;const raw=n&&kbIsGetal(n.v)&&!kbIsFoutcode(n.v)?n.v:null;
  const nieuw=raw===null?null:x.nul.liter+(raw-x.nul.raw)*(x.top.liter-x.nul.liter)/(x.top.raw-x.nul.raw);const oud=waarde(x.ref);
  el.innerHTML=`<div class="cf-st ok">${ic('check',16,2.2)} Klopt. Met deze ijking is de bak nu <b>${nieuw===null?STREEP:fix(nieuw,0)+' L'}</b>${oud&&oud.q!=='bad'?(' · volgens de PLC nu '+tekstWaarde(oud,0)):''} · 1 liter is ${fix((x.top.raw-x.nul.raw)/(x.top.liter-x.nul.liter),1)} ruw.</div>`;}
/* 'Nu vastleggen': de ruwe waarde van deze ene sensor, 10 s lang elke seconde gelezen, en daarvan het gemiddelde.
   Zo telt één uitschieter (een golf, de menger) niet zwaar mee. De spreiding laat zien of het niveau stil stond. */
async function kbVastleggen(p){if(!kbIj||kbIj.bezig)return;const ref=kbIj.ref;const kn=kanaalVan(ref);
  if(!kn){toast('Deze sensor heeft geen kanaal in de IO-mapping','warn');return;}
  kbIj.bezig=p;const knop=document.querySelector(`[data-kbvast="${p}"]`);if(knop)knop.disabled=true;
  const meet=[];const t0=Date.now();let laatste=null;let fout=null;
  while(Date.now()-t0<KAL_G.vastleggenS*1000){
    await haalBron();
    if(bron.lastOk!==laatste){laatste=bron.lastOk;const n=vers().ok?kanaal(kn.sleutel):null;
      if(n&&kbIsGetal(n.v)){if(kbIsFoutcode(n.v)){fout='De module meldt een foutcode (open klem of boven het bereik): zo kan niet geijkt worden.';break;}meet.push(n.v);}}
    const sp=document.getElementById('kb-sp-'+p);if(sp)sp.textContent='Meten… nog '+Math.max(0,Math.ceil((KAL_G.vastleggenS*1000-(Date.now()-t0))/1000))+' s · '+meet.length+' metingen';
    await new Promise(r=>setTimeout(r,1000));}
  if(knop)knop.disabled=false;
  if(!kbIj||kbIj.ref!==ref)return;
  kbIj.bezig=null;
  if(fout){kbIj.spreiding[p]=fout;kbTekenIj();return;}
  if(meet.length<5){kbIj.spreiding[p]='Te weinig metingen ('+meet.length+'). Is er verbinding met de PLC? Probeer het opnieuw.';kbTekenIj();return;}
  const gem=Math.round(meet.reduce((a,b)=>a+b,0)/meet.length);const mn=Math.min(...meet),mx=Math.max(...meet);
  kbIj[p].raw=gem;
  kbIj.spreiding[p]='Gemiddelde van '+meet.length+' metingen over '+KAL_G.vastleggenS+' s: '+fix(gem,0)+' (van '+fix(mn,0)+' tot '+fix(mx,0)+').'+(mx-mn>KAL_G.maxSpreiding?' Het niveau bewoog: wacht tot de bak stilstaat, of zet de menger uit, en leg opnieuw vast.':'');
  kbTekenIj();}
function kbIjControleer(){if(!kbIj)return;const x=kbIj;const f=kbIjFouten();const rust=cfInRust();const c=COMP[x.ref];const oud=ijkingVan(x.ref);const g=isGeijkt(x.ref);
  const pt=(raw,l)=>kbIsGetal(raw)&&kbIsGetal(l)?(fix(Number(l),0)+' L bij ruw '+fix(Number(raw),0)):STREEP;
  openModal(`${ic('gauge',18,2)} Ijken: ${esc(locNaam(c.loc))}`,`<div class="cf-mod">
    <div class="kv"><span class="k">Nulpunt</span><span class="v mono">${g?(esc(pt(oud.rawNul,oud.literNul))+' → '):''}${esc(pt(x.nul.raw,x.nul.liter))}</span></div>
    <div class="kv"><span class="k">Toppunt</span><span class="v mono">${g?(esc(pt(oud.rawTop,oud.literTop))+' → '):''}${esc(pt(x.top.raw,x.top.liter))}</span></div>
    ${f.length?`<div class="check-banner error" style="margin-top:10px"><div class="cb-h">${ic('warn',16,2)} Eerst verbeteren</div><ul>${f.map(t=>'<li>'+esc(t)+'</li>').join('')}</ul></div>`:''}
    ${!rust.ok?`<div class="check-banner warn" style="margin-top:10px"><div class="cb-h">${ic('lock',16,2)} ${esc(rust.tekst.replace('toepassen kan pas','ijken kan pas'))}</div></div>`:''}
    <div style="display:flex;gap:8px;margin-top:14px">${!f.length&&rust.ok?`<button type="button" class="btn primary" id="kb-ok">${ic('check',16,2.2)} Toepassen in de PLC</button>`:''}<button type="button" class="btn" id="kb-x">Terug</button></div>
    <div id="kb-uit" style="margin-top:12px"></div></div>`);
  $('#kb-x').onclick=closeModal;const ok=$('#kb-ok');
  if(ok)ok.onclick=()=>kbToepassen(ok,$('#kb-uit'),{soort:'niveau',sensor:x.ref,rawNul:x.nul.raw,literNul:x.nul.liter,rawTop:x.top.raw,literTop:x.top.liter},
    k=>{const n=k.niveau&&k.niveau[x.ref];return !!n&&Number(n.rawNul)===x.nul.raw&&Number(n.rawTop)===x.top.raw&&Number(n.literNul)===x.nul.liter&&Number(n.literTop)===x.top.liter&&Number(n.datum)>0;});}

/* ---- toepassen: één ijking per aanvraag; 'verwerkt' pas als de PLC het teruggeeft ---- */
async function kbToepassen(knop,uit,lading,klopt){const k=kal();lading=Object.assign({basisVersie:k?Number(k.versie):null},lading);
  knop.disabled=true;uit.innerHTML=`<div class="hw-hint">${ic('clock',14,2)} Verstuurd naar de brug…</div>`;
  const r=await opdracht('kalibratie',lading);
  if(!r.ok){const waarom=r.status===501?nietNaarPlc('de kalibratie'):r.status===423?'De machine is niet in rust.':r.status===409?'De kalibratie in de PLC is intussen gewijzigd; kijk opnieuw.':'';
    uit.innerHTML=`<div class="check-banner error"><div class="cb-h">${ic('warn',16,2)} Niet overgenomen</div><div>${esc(waarom)}${r.status===501?'':' '+esc(r.fout||'')}</div></div>`;knop.disabled=false;return;}
  uit.innerHTML=`<div class="hw-hint">${ic('clock',14,2)} De brug nam het aan. Wachten tot ${wieBron()} het teruggeeft…</div>`;
  const verwacht=r.antwoord&&r.antwoord.versie!=null?Number(r.antwoord.versie):null;
  /* de bevestiging haalt zelf verse momentopnamen op (skill: naslag-bedienlaag §2) */
  haalBron();const tik=setInterval(haalBron,1000);
  const ok=await wachtOp(()=>{const c=kal();if(!c)return false;if(verwacht!==null&&Number(c.versie)!==verwacht)return false;return klopt(c);},10000);
  clearInterval(tik);
  if(ok){uit.innerHTML=`<div class="check-banner" style="border-color:var(--ok)"><div class="cb-h" style="color:var(--ok)">${ic('check',16,2)} Verwerkt: ${wieBron()} geeft versie ${esc(String(kal().versie))} terug, met deze waarden</div><div>${lading.soort==='flowmeter'?'De PLC rekent er vanaf de volgende beurt mee.':'De PLC rekent de liters van deze bak nu hiermee uit.'}</div></div>`;
    if(lading.soort==='flowmeter'){kbFm={lp:'',t1:null,t2:null,gemeten:''};kbTekenFm();}else{kbIj=null;kbTekenIj();}kbNivLive();kbKop();}
  else{uit.innerHTML=`<div class="check-banner warn"><div class="cb-h">${ic('warn',16,2)} Niet bevestigd</div><div>De brug nam het aan, maar binnen 10 s gaf ${wieBron()} het niet terug.</div></div>`;knop.disabled=false;}}

function kbInvoer(e){const t=e.target;
  if(t.dataset.kb==='lp'&&kbFm){kbFm.lp=t.value;const v=kbGetal(t.value);const pl=document.querySelector('#kb-wrap [data-kb="pl"]');if(pl)pl.value=v>0?fix(1/v,1):'';kbFmAfwijking();return;}
  if(t.dataset.kb==='pl'&&kbFm){const v=kbGetal(t.value);kbFm.lp=v>0?(1/v).toFixed(6):'';const lp=document.querySelector('#kb-wrap [data-kb="lp"]');if(lp)lp.value=kbFm.lp;kbFmAfwijking();return;}
  if(t.dataset.kb==='gemeten'&&kbFm){kbFm.gemeten=t.value;kbFmReken();return;}
  const ij=t.dataset.kbij;if(ij&&kbIj){const [p,veld]=ij.split('-');const v=kbGetal(t.value);
    kbIj[p][veld]=veld==='raw'&&kbIsGetal(v)?Math.round(v):v;if(veld==='raw')kbIj.spreiding[p]='';kbIjLive();}}   /* ruw is een heel getal, zoals in de PLC */
function kbKlik(e){const t=e.target;
  const ijk=t.closest('[data-ijk]');if(ijk){kbOpenIjk(ijk.dataset.ijk);return;}
  const vast=t.closest('[data-kbvast]');if(vast){kbVastleggen(vast.dataset.kbvast);return;}
  const st=t.closest('[data-kbstap]');if(!st)return;const s=st.dataset.kbstap;
  if(s==='t1'||s==='t2'){const n=kbTeller();if(n===null){toast('De tellerstand is nu niet te lezen','warn');return;}kbFm[s]=n;if(s==='t1')kbFm.t2=null;kbTekenFm();return;}
  if(s==='gebruik'){const v=kbMaatbeker();if(v===null){toast('Eerst beide tellerstanden, met pulsen ertussen, en de gemeten liters','warn');return;}kbFm.lp=v.toFixed(6);kbTekenFm();return;}
  if(s==='fm-ok'){kbFmControleer();return;}
  if(s==='ij-x'){kbIj=null;kbTekenIj();return;}
  if(s==='ij-ok'){kbIjControleer();return;}}

/* ==================================================================

let lbStand={bezig:false,fout:null,rijen:null,ts:null};
let lbTab='beurten';
let wzStand={bezig:false,fout:null,nodig:null,geen:false,rijen:null,ts:null};
function viewLogboek(){return `<div class="page-head"><div class="titles"><h1>Logboek</h1><p>${lbTab==='beurten'?'Gegeven beurten, zoals de brug ze bijhoudt':'Wie wat wijzigde of probeerde, zoals de brug het bijhoudt'}</p></div>

  <button class="btn sm" id="lb-nu">${ic('history',15,2)} Opnieuw ophalen</button></div></div><div class="card" id="lb-card"></div>`;}
async function haalLogboek(){lbStand.bezig=true;tekenLogboek();
  try{const r=await fetch(basisUrl()+'/beurten',{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status+' op /beurten');const j=await r.json();lbStand.rijen=Array.isArray(j)?j.slice(0,500):[];lbStand.fout=null;lbStand.ts=Date.now();}
  catch(e){lbStand.fout=(e&&e.message)||'niet bereikbaar';lbStand.rijen=null;}

function mountLogboek(){$$('#lb-tabs button').forEach(b=>b.onclick=()=>{lbTab=b.dataset.t;render();});
  $('#lb-nu').onclick=()=>lbTab==='beurten'?haalLogboek():haalWijzigingen();

async function haalWijzigingen(){
  wzStand.geen=!inlogBekend();if(wzStand.geen){tekenWijzigingen();return;}
  wzStand.bezig=true;tekenWijzigingen();
  try{const r=await fetch(basisUrl()+'/auditlog',{cache:'no-store'});let j=null;try{j=await r.json();}catch(e){}
    if(r.status===401){wzStand.nodig=(j&&j.nodig)||'service';wzStand.rijen=null;wzStand.fout=null;}
    else if(!r.ok)throw new Error((j&&j.fout)||('HTTP '+r.status+' op /auditlog'));
    else{wzStand.rijen=Array.isArray(j)?j.slice(0,500):[];wzStand.nodig=null;wzStand.fout=null;wzStand.ts=Date.now();}}
  catch(e){wzStand.fout=(e&&e.message)||'niet bereikbaar';wzStand.rijen=null;}
  wzStand.bezig=false;tekenWijzigingen();}
function tekenWijzigingen(){

    <div class="hw-hint" style="margin:12px 16px 16px">${ic('info',14,2)} <span>Wachtwoorden staan hier nooit in. De brug bewaart dit op de controller (auditlog.jsonl, tot 1 MB; daarna blijft één ouder bestand bewaard).</span></div>`;}
function tekenLogboek(){

/* ==================================================================
   RECEPTEN MET DE TUSSENBAK ALS DIGITALE TWEELING - besluit Wessel 22-09
   (middag), kennisbank 4-hmi\06-receptopbouw-en-tussenbak.md.

   - Recepten (teler): alleen de liters, met dezelfde tweeling, de afwijking
     van de standaard en 'terug naar standaard'.
   Het rekenmodel is rbReken (B_bron.js); de nabootsing en straks de PLC
   rekenen hetzelfde. Een + die niet past, gebeurt niet. 'Verwerkt' pas als
   de PLC het teruggeeft. Vormgeving: de goedgekeurde schets van 22-09
   (symmetrisch, strakke samengestelde knoppen).
   ================================================================== */
const TW_KL={A:'var(--a)',B:'var(--b)',AB:'var(--ab)'};
function twKort(s,max){s=String(s);max=max||14;return s.length>max?s.slice(0,max-1)+'…':s;}
/* labels langs een kant van de tank: op hun eigen hoogte, maar nooit over elkaar */
function twSpreid(lab,lo,hi,gap){lab.sort((p,q)=>p.yb-q.yb);let prev=lo-gap;lab.forEach(l=>{l.y=Math.max(l.yb,prev+gap);prev=l.y;});
  const uit=prev-hi;if(uit>0)lab.forEach(l=>{l.y-=uit;});let vorig=hi+gap;for(let i=lab.length-1;i>=0;i--){lab[i].y=Math.min(lab[i].y,vorig-gap);vorig=lab[i].y;}}
function twSchaalStap(cap){const ruw=cap/10;const mag=Math.pow(10,Math.floor(Math.log10(ruw)));const f=ruw/mag;return (f<2?1:f<5?2:5)*mag;}
/* de tank in zijaanzicht. o = {bak, stappen:[n], water:[L|null], r (rbReken), m (rbMaten), spook: L te veel bij een geweigerde klik} */
function tweelingSVG(o){
  const W=340,H=508,x0=112,x1=228,cx=(x0+x1)/2,top=72,bot=442,XL=100,XR=240;const m=o.m,r=o.r;
  const CAP=m.cap>0?m.cap:m.batch*1.25;const px=(bot-top)/CAP;const y=L=>bot-L*px;const id='tw'+o.bak;
  const tb=m.tb==='TBA'?'tussenbak A':'tussenbak B';
  let s=`<svg class="tw-svg" viewBox="0 0 ${W} ${H}" role="img" aria-label="Zijaanzicht van ${tb}: water links, stoffen rechts"><defs>
   <pattern id="${id}-hk" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" class="tw-arc"/></pattern>
   <pattern id="${id}-hr" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" class="tw-arc-rood"/></pattern>
   <clipPath id="${id}-ct"><rect x="${x0}" y="${top}" width="${x1-x0}" height="${bot-top}" rx="14"/></clipPath></defs>`;
  s+=`<text class="tw-tx2" x="${cx}" y="14" text-anchor="middle">vulleiding · FC 01</text>
   <line x1="${cx}" x2="${cx}" y1="22" y2="${top+2}" class="tw-pijp"/>
   <path d="M${cx-8} 38 L${cx+8} 48 L${cx+8} 38 L${cx-8} 48 Z" class="tw-klep"/>`;
  s+=`<g clip-path="url(#${id}-ct)"><rect x="${x0}" y="${top}" width="${x1-x0}" height="${Math.max(0,y(m.batch)-top)}" fill="url(#${id}-hk)" opacity="0.55"/>`;
  const labL=[],labR=[];const N=o.stappen.length+1;let cum=0;
  if(r){const lagen=[{t:'w',i:0}];o.stappen.forEach((n,k)=>{lagen.push({t:'s',k:k});lagen.push({t:'w',i:k+1});});
    lagen.forEach(l=>{if(l.t==='w'){const L=r.w[l.i];const h=L*px,yt=y(cum+L);
        s+=`<rect x="${x0}" y="${yt.toFixed(1)}" width="${x1-x0}" height="${Math.max(0,h).toFixed(1)}" class="${l.i%2?'tw-water2':'tw-water'}"/>`;
        const last=l.i===N-1,vast=!last&&o.water[l.i]!=null;
        labL.push({yb:yt+h/2,t1:l.i===0?'voorwater':last?'aanvullen':'water na '+l.i,t2:fix(L,0)+' L · '+(last?'rest':vast?'vast':'auto'),vast:vast});cum+=L;}
      else{const n=o.stappen[l.k];const g=bronGroep(n)||'AB';const L=r.stofL[l.k];const h=Math.max(3,L*px);const yt=y(cum+L);
        s+=`<rect x="${x0}" y="${yt.toFixed(1)}" width="${x1-x0}" height="${h.toFixed(1)}" style="fill:${TW_KL[g]||TW_KL.AB}"/>`;
        labR.push({yb:yt+h/2,t1:(l.k+1)+' '+twKort(stofNaam(n)),t2:fix(L,L<10?1:0)+' L',g:g});cum+=L;}});}
  const stap=twSchaalStap(CAP);
  for(let L=stap;L<CAP-1e-9;L+=stap){if(Math.abs(L-m.batch)<stap/4)continue;const yy=y(L).toFixed(1);const lang=Math.round(L/stap)%2===0;
    s+=`<line x1="${x0}" x2="${x0+(lang?10:6)}" y1="${yy}" y2="${yy}" class="tw-maat"/><line x1="${x1-(lang?10:6)}" x2="${x1}" y1="${yy}" y2="${yy}" class="tw-maat"/>`;}
  s+='</g>';
  const yb=y(m.batch);
  s+=`<text class="tw-tx2" x="${cx}" y="${top+18}" text-anchor="middle">vol ${fix(CAP,0)} L</text>`;
  if(yb-top>52)s+=`<text class="tw-tx2" x="${cx}" y="${((top+18+yb)/2+4).toFixed(1)}" text-anchor="middle">marge ${fix(CAP-m.batch,0)} L</text>`;
  s+=`<text class="tw-tx1" x="${cx}" y="${(yb-8).toFixed(1)}" text-anchor="middle">batch ${fix(m.batch,0)} L</text>`;
  const ov=Math.max(r?r.teVeel:0,o.spook||0);
  if(ov>0){const yt=Math.max(56,y(m.batch+ov));
    s+=`<rect x="${x0+2}" y="${yt.toFixed(1)}" width="${x1-x0-4}" height="${(yb-yt).toFixed(1)}" fill="url(#${id}-hr)" class="tw-over"/>
     <rect x="${cx-46}" y="${(yt-26).toFixed(1)}" width="92" height="20" rx="10" class="tw-over-pil"/><text x="${cx}" y="${(yt-12).toFixed(1)}" text-anchor="middle" class="tw-over-tx">${fix(ov,1)} L te veel</text>`;}
  s+=`<line x1="${x0-6}" x2="${x1+6}" y1="${yb.toFixed(1)}" y2="${yb.toFixed(1)}" class="tw-batchlijn"/>
   <rect x="${x0}" y="${top}" width="${x1-x0}" height="${bot-top}" rx="14" class="tw-rand"/>
   <line x1="${x0-8}" x2="${x1+8}" y1="${top}" y2="${top}" class="tw-deksel"/>
   <rect x="${x0+12}" y="${bot-2}" width="10" height="14" rx="2" class="tw-poot"/><rect x="${x1-22}" y="${bot-2}" width="10" height="14" rx="2" class="tw-poot"/>
   <line x1="${cx}" x2="${cx}" y1="${bot}" y2="${bot+22}" class="tw-pijp"/>
   <circle cx="${cx}" cy="${bot+33}" r="11" class="tw-pomp"/><path d="M${cx-4} ${bot+28} L${cx+6} ${bot+33} L${cx-4} ${bot+38} Z" class="tw-pomp-pijl"/>
   <text class="tw-tx2" x="${cx}" y="${bot+60}" text-anchor="middle">mengpomp ${m.tb==='TBA'?'VP 02':'VP 03'} · naar werkbak ${esc(o.bak)}</text>`;
  /* labels: bij veel porties of stoffen op één regel */
  const eenRegel=Math.max(labL.length,labR.length)>12;const gap=eenRegel?15:27;
  twSpreid(labL,top+8,bot-8,gap);twSpreid(labR,top+8,bot-8,gap);
  labL.forEach(l=>{s+=`<circle cx="${x0}" cy="${l.yb.toFixed(1)}" r="2.2" class="tw-stip-w"/><polyline points="${x0},${l.yb.toFixed(1)} ${x0-6},${l.yb.toFixed(1)} ${XL+4},${(l.y-4).toFixed(1)} ${XL},${(l.y-4).toFixed(1)}" class="tw-leider-w"/>`;
    s+=eenRegel?`<text class="tw-tx1 k" x="${XL-4}" y="${(l.y).toFixed(1)}" text-anchor="end">${esc(l.t2)}</text>`
      :`<text class="tw-tx1 k" x="${XL-4}" y="${(l.y-1).toFixed(1)}" text-anchor="end">${esc(l.t1)}</text><text class="tw-tx2${l.vast?' vast':''}" x="${XL-4}" y="${(l.y+12).toFixed(1)}" text-anchor="end">${esc(l.t2)}</text>`;});
  labR.forEach(l=>{s+=`<circle cx="${x1}" cy="${l.yb.toFixed(1)}" r="2.2" style="fill:${TW_KL[l.g]}"/><polyline points="${x1},${l.yb.toFixed(1)} ${x1+6},${l.yb.toFixed(1)} ${XR-4},${(l.y-4).toFixed(1)} ${XR},${(l.y-4).toFixed(1)}" style="stroke:${TW_KL[l.g]}" class="tw-leider"/>`;
    s+=eenRegel?`<text class="tw-tx1 k" x="${XR+4}" y="${(l.y).toFixed(1)}">${esc(twKort(l.t1,16))} · ${esc(l.t2)}</text>`
      :`<text class="tw-tx1 k" x="${XR+4}" y="${(l.y-1).toFixed(1)}">${esc(l.t1)}</text><text class="tw-tx2" x="${XR+4}" y="${(l.y+12).toFixed(1)}">${esc(l.t2)}</text>`;});
  return s+'</svg>';}
/* het blok onder de tank: melding, cijfers en de harde eisen */
function twMelding(tekst,soort){return `<div class="tw-msg ${soort}">${tekst}</div>`;}
function twCijfers(r,m,stappen){return `<div><span>Stoffen</span><b>${fix(r.somStof,0)} L</b><span>in de batch</span></div><div><span>Water</span><b>${fix(r.somW,0)} L</b><span>${stappen.length+1} porties</span></div><div><span>Batch</span><b>${fix(r.totaal,0)} L</b><span>van ${fix(m.batch,0)} · bak ${m.cap?fix(m.cap,0):STREEP} L</span></div><div><span>Nog vrij</span><b>${fix(r.vrij/r.f,0)} L</b><span>stof ${perRef()}</span></div>`;}
function twGrenzen(m){return `Harde eisen, ook in de PLC: de batch (${fix(m.batch,0)} L) past in ${m.tb==='TBA'?'tussenbak A':'tussenbak B'} (${m.cap?fix(m.cap,0)+' L':STREEP}), allebei Configuratie · voorwater minstens ${fix(m.minV,0)} L · water na een stof minstens ${typeof m.minS==='number'?fix(m.minS,0)+' L':'het spoelvolume van die stof'} (Instellingen) · de laatste portie vult aan tot precies ${fix(m.batch,0)} L.`;}
function twGeenMaten(m,stappen){const mis=[];if(!(m.batch>0))mis.push('het batchvolume');if(m.minV==null)mis.push('het voorwater');if(m.minS==null)mis.push('het spoelvolume');if(!(m.ref>0))mis.push('het referentievolume');
  /* sinds 22-09 per stof: noem de stoffen zonder spoelvolume */
  if(m.minS!=null&&stappen){const zonder=stappen.filter(n=>rbMinS(m,n)==null);if(zonder.length)mis.push('het spoelvolume van '+zonder.map(stofNaam).join(', '));}
  return `<div class="check-banner warn"><div class="cb-h">${ic('info',16,2)} De PLC meldt ${esc(mis.join(', '))} niet</div><div>Zonder die maten kan het scherm niet rekenen, en tekent het de tussenbak niet (niet gemeten is niet nul).</div></div>`;}
/* een samengesteld veldje: − invoer + (40 px, voor het touchpaneel) */
function twStapper(sleutel,waarde,dec,label){return `<span class="tw-st"><button type="button" data-tws="${esc(sleutel)}|-1" aria-label="Minder">−</button><input data-twi="${esc(sleutel)}" inputmode="decimal" value="${esc(fix(waarde,dec))}" aria-label="${esc(label)}"><button type="button" data-tws="${esc(sleutel)}|1" aria-label="Meer">+</button></span>`;}
function twKeus(id,sel,attr,vlag){return `<div class="tw-keus" role="group" aria-label="Werkbak">${WERKBAKKEN.map(w=>`<button type="button" ${attr}="${w.bak}" class="${w.bak===sel?'aan':''}">${esc(w.bak)} ${groepChip(w.kant)}${vlag&&vlag(w.bak)?'<i class="tw-stipje" title="niet verstuurde wijzigingen"></i>':''}</button>`).join('')}</div>`;}
function twGetal(v){const f=Number(String(v).trim().replace(',','.'));return String(v).trim()!==''&&isFinite(f)?f:null;}

/* ==================================================================
   RECEPTOPBOUW (service)
   ================================================================== */
let rbKeus='A1';const rbCon={};let rbSpook=0,rbMeld='',rbOokTeler=true,rbGezien='';
function rbNieuw(bak){const p=rbVan(bak);const v=p?p.versie:null;
  return p?{stappen:p.stappen.slice(),water:p.water.slice(),standaard:Object.fromEntries(p.stappen.map(n=>[n,rbStd(p,n)])),basisVersie:v,bewerkt:false}
    :{stappen:[],water:[null],standaard:{},basisVersie:v,bewerkt:false};}
function rbC(){if(!rbCon[rbKeus])rbCon[rbKeus]=rbNieuw(rbKeus);return rbCon[rbKeus];}
function rbReken1(c){return rbReken(c.stappen,c.water,c.stappen.map(n=>c.standaard[n]||0),rbMaten(rbKeus));}
function rbGelijk(c,bak){const p=rbVan(bak);if(!p)return c.stappen.length===0;if(p.stappen.join()!==c.stappen.join())return false;
  if(p.water.some((w,i)=>(w==null)!==(c.water[i]==null)||(w!=null&&Math.abs(w-c.water[i])>1e-6)))return false;
  return c.stappen.every(n=>Math.abs(rbStd(p,n)-(c.standaard[n]||0))<1e-6);}
function viewReceptopbouw(){
  return `<div id="rb-wrap"><div class="page-head"><div class="titles"><h1>Receptopbouw</h1><p>Per werkbak: welke stoffen, in welke volgorde, het water per portie en de standaard in L ${perRef()} · service · waarden uit de PLC</p></div></div>
  <div id="rb-keus"></div><div id="rb-kop"></div>
  <div class="tw-grid"><div class="card tw-pan" id="rb-tank"></div><div class="card"><div id="rb-adv"></div><div class="tw-lijst" id="rb-lijst"></div></div></div>
  <div id="rb-msg"></div><div class="tw-kpi" id="rb-kpi"></div><div class="tw-grens" id="rb-grens"></div>
  <div class="cf-balk" id="rb-balk"></div><div id="rb-uit" style="margin-top:12px"></div></div>`;}
/* het scherm is net leeg opgebouwd (ander scherm, inloggen, nieuwe configuratie): altijd opnieuw tekenen, ook als
   de gegevens niet veranderden. Zonder dit bleef het scherm leeg tot Ctrl+R (Wessel, 22-09 avond). */
function mountReceptopbouw(){rbGezien='';const w=$('#rb-wrap');if(!w)return;
  w.addEventListener('click',rbKlik);w.addEventListener('change',rbInvoer);w.addEventListener('pointerdown',rbSleepStart);
  w.addEventListener('keydown',e=>{if(!e.target.matches)return;if(e.key==='Enter'&&e.target.matches('[data-twi]'))e.target.blur();
    /* de greep met het toetsenbord: pijl omhoog en omlaag verplaatst de stof één plek */
    if((e.key==='ArrowUp'||e.key==='ArrowDown')&&e.target.matches('#rb-lijst [data-rbgreep]')){e.preventDefault();
      if(!magNiveau('service')){vraagInlog('service');return;}const k=Number(e.target.dataset.rbgreep);const j=k+(e.key==='ArrowUp'?-1:1);
      if(rbVerplaats(k,j)){const g=$('#rb-lijst [data-rbgreep="'+j+'"]');if(g)g.focus();}}});}
function rbSleutel(){const s=actueel();return JSON.stringify([receptopbouw(),s&&s.instellingen&&[s.instellingen.P_VolVoorwater,s.instellingen.P_VolSpoel],cfg()&&[cfg().versie,cfg().volBatch,cfg().volTussenbak,cfg().volReferentie],!!vers().ok]);}
function verversReceptopbouw(){if(!$('#rb-lijst')||rbSleep)return;   /* niet tekenen onder een vinger die sleept */
  if(document.activeElement&&document.activeElement.matches&&document.activeElement.matches('#rb-lijst [data-twi]'))return;
  const k=rbSleutel();if(k===rbGezien)return;rbGezien=k;
  Object.keys(rbCon).forEach(b=>{if(!rbCon[b].bewerkt)delete rbCon[b];});rbTeken();}
function rbTeken(){const c=rbC();const m=rbMaten(rbKeus);const r=rbReken1(c);const ro=receptopbouw();
  $('#rb-keus').innerHTML=twKeus('rb-keus',rbKeus,'data-rbbak',b=>rbCon[b]&&rbCon[b].bewerkt);
  let kop='';
  if(!vers().ok)kop=`<div class="check-banner warn" style="margin-bottom:14px"><div class="cb-h">${ic('network',16,2)} Geen actuele gegevens van de PLC</div><div>Je kunt opbouwen, maar niet naar de PLC sturen.</div></div>`;
  else if(!ro)kop=`<div class="check-banner warn" style="margin-bottom:14px"><div class="cb-h">${ic('info',16,2)} De PLC meldt geen receptopbouw${cfg()?'':' en geen configuratie'}</div><div>${cfg()
    ?'Er is nog geen PLC-programma met de receptopbouw, of de brug geeft hem niet door. Je kunt een recept opbouwen; versturen kan pas als de PLC het kent.'
    :'Er draait nog geen PLC-programma met deze gegevens, of de brug geeft ze niet door. De stoffen komen uit de configuratie in de PLC: opbouwen kan pas als de PLC die heeft.'}</div></div>`;
  else{const pv=(rbVan(rbKeus)||{}).versie;if(pv===undefined){}else if(c.bewerkt&&c.basisVersie!==pv)kop=`<div class="check-banner warn" style="margin-bottom:14px"><div class="cb-h">${ic('warn',16,2)} Het recept van werkbak ${esc(rbKeus)} is in de PLC intussen gewijzigd (nu versie ${esc(String(pv))})</div><div>Jouw wijzigingen gaan uit van versie ${esc(String(c.basisVersie))}; versturen wordt geweigerd. <button type="button" class="btn sm" id="rb-opnieuw">Opnieuw beginnen vanaf de PLC</button></div></div>`;}
  $('#rb-kop').innerHTML=kop;
  if(!rbMatenCompleet(m,c.stappen)){$('#rb-tank').innerHTML=twGeenMaten(m,c.stappen);}
  else $('#rb-tank').innerHTML=tweelingSVG({bak:rbKeus,stappen:c.stappen,water:c.water,r:r,m:m,spook:rbSpook});
  $('#rb-lijst').innerHTML=rbLijst(c,r,m);advOveral();advVernieuw();
  $('#rb-msg').innerHTML=rbMeld?twMelding(esc(rbMeld),'fout'):!r?'':r.past?twMelding(`Het recept past. ${r.nAuto>1?'De machine verdeelt het water gelijk over '+r.nAuto+' porties: de auto-porties en de laatste.':'Alle waterporties staan vast; de laatste vult aan tot de batch.'}`,'ok')
    :twMelding(r.teVeel>0?`Past niet: ${fix(r.teVeel,1)} L te veel. Verlaag eerst iets in liters.`:r.teLaag.length?'Een vaste waterportie ligt onder zijn minimum.':'De batch past niet in de tussenbak (Configuratie).','fout');
  $('#rb-kpi').innerHTML=r?twCijfers(r,m,c.stappen):'';$('#rb-grens').innerHTML=rbMatenCompleet(m,c.stappen)?esc(twGrenzen(m)):'';
  rbBalk();}
function rbLijst(c,r,m){const N=c.stappen.length+1;
  const wRij=i=>{const last=i===N-1;const vast=!last&&c.water[i]!=null;const lab=i===0?'Voorwater':last?`Aanvullen tot ${m.batch>0?fix(m.batch,0)+' L':'de batch'}`:'Water na '+i;
    const mi=rbMinW(m,c.stappen,i);const sub=(i===0?'':last?'de rest · ':'')+(mi!=null?'minstens '+fix(mi,0)+' L':'minimum niet gemeld')+(i>0&&!last?' · spoelt de leiding':'');
    const c3=vast?twStapper('w|'+i,c.water[i],0,lab+' in liters'):`<span class="tw-val">${r?fix(r.w[i],0)+' L':STREEP}</span>`;
    const c4=last?'<span class="tw-tag">rest</span>':`<span class="tw-sw" role="group" aria-label="${esc(lab)}"><button type="button" data-rbw="${i}|auto" class="${vast?'':'aan'}">auto</button><button type="button" data-rbw="${i}|vast" class="${vast?'aan':''}">vast</button></span>`;
    return `<div class="tw-rij w"><span class="tw-nr w">${ic('drop',16,2)}</span><span class="nm">${esc(lab)}<br><span class="sub">${esc(sub)}</span></span>${c3}${c4}</div>`;};
  let h=`<div class="tw-rij kop"><span class="nm"><b>Receptopbouw werkbak ${esc(rbKeus)}</b> ${groepChip(bakGroep(rbKeus))}<br><span class="sub">stoffen in L ${perRef()} (de standaard) · water per portie auto of vast</span></span></div>`;
  h+=wRij(0);
  /* 22-09 (Wessel: de volgorde was "niet handig en logisch"): de greep links sleep je naar de plek waar de stof
     gedoseerd moet worden. De waterporties blijven staan; alleen de volgorde van de stoffen verandert. */
  c.stappen.forEach((n,k)=>{h+=`<div class="tw-rij st${n===rbNetErbij?' net-erbij':''}" data-n="${n}"><button type="button" class="tw-greep" data-rbgreep="${k}" title="Slepen om de volgorde te veranderen" aria-label="${esc(stofNaam(n))}, stap ${k+1}: slepen, of pijl omhoog en omlaag">${ic('greep',16,2)}<span class="tw-nr">${k+1}</span></button><span class="nm">${esc(stofNaam(n))} ${groepChip(bronGroep(n))}<br><span class="sub">${r?fix(r.stofL[k],1)+' L in de batch':'standaard in L '+perRef()}</span></span>${twStapper('s|'+n,c.standaard[n]||0,1,stofNaam(n)+' in liter '+perRef())}<span class="tw-acts"><button type="button" class="weg" data-rbrm="${k}" aria-label="${esc(stofNaam(n))} uit het recept halen" title="Uit het recept halen">${ic('x',16,2)}</button></span></div>`;
    h+=wRij(k+1);});
  rbNetErbij=0;
  const act=actieveBronnen()||[];const gb=bakGroep(rbKeus);
  const opt=act.filter(n=>!c.stappen.includes(n)&&groepPast(bronGroep(n),gb));
  if(c.stappen.length>=ONTWERP.recepten.maxStappen)h+=`<div class="tw-leeg">Hoogstens ${ONTWERP.recepten.maxStappen} stoffen per recept.</div>`;
  else if(!act.length)h+=`<div class="tw-leeg">De PLC meldt geen configuratie: welke stoffen er zijn, staat daarin.</div>`;
  else if(!opt.length)h+=`<div class="tw-leeg">Alle stoffen die bij groep ${esc(GROEPEN[gb]?GROEPEN[gb].naam:'?')} passen, staan erin.</div>`;
  /* toevoegen met één tik: de stoffen die bij deze bak passen en er nog niet in staan */
  else h+=`<div class="tw-add-k"><div class="tw-add-h">Stof toevoegen <span class="sub">tik: hij komt achteraan · sleep hem daarna aan de greep naar zijn plek</span></div><div class="tw-chips">${opt.map(n=>`<button type="button" class="tw-chip" data-rbadd="${n}">${ic('plus',14,2.4)} ${esc(stofNaam(n))} ${groepChip(bronGroep(n))}</button>`).join('')}</div></div>`;
  return h;}
/* ---- slepen: de rij volgt de vinger, de andere stoffen schuiven opzij; loslaten = verplaatsen ---- */

function rbSleepPlaats(){const s=rbSleep;if(!s)return;const lt=s.L.getBoundingClientRect().top;const mid=el=>lt+el.offsetTop+el.offsetHeight/2;

/* twee stofrijen van plaats wisselen; het water ertussen blijft staan. De rijen die opzij gaan, glijden (niet als

function rbWissel(a,b){const L=a.parentNode;const mee=[a,b];for(let x=a.nextElementSibling;x&&x!==b;x=x.nextElementSibling)mee.push(x);

/* ==================================================================

let rcKeus='A1';const rcCon={};let rcSpook=0,rcMeld='',rcGezien='';
function rcNieuw(bak){const p=rbVan(bak);if(!p)return {waarden:{},bewerkt:false};const w=rbTeler(bak,p);return {waarden:Object.fromEntries(p.stappen.map((n,k)=>[n,w[k]])),bewerkt:false};}

function rcSleutel(){const s=actueel();return JSON.stringify([receptopbouw(),s&&s.recepten,s&&s.balans,s&&s.instellingen&&[s.instellingen.P_VolVoorwater,s.instellingen.P_VolSpoel],cfg()&&[cfg().versie,cfg().volBatch,cfg().volTussenbak],!!vers().ok]);}

function rcTeken(){const p=rbVan(rcKeus);const c=rcC();const m=rbMaten(rcKeus);
  $('#rc-keus').innerHTML=twKeus('rc-keus',rcKeus,'data-rcbak',b=>rcCon[b]&&rcCon[b].bewerkt&&!rcGelijkPlc(rcCon[b],b));
  let kop='';if(!vers().ok)kop=`<div class="check-banner warn" style="margin-bottom:14px"><div class="cb-h">${ic('network',16,2)} Geen actuele gegevens van de PLC</div><div>Zie de balk bovenaan.</div></div>`;
  $('#rc-kop').innerHTML=kop;advOveral();advVernieuw();
  if(!p){$('#rc-tank').innerHTML=`<div class="tw-leeg" style="padding:40px 20px;text-align:center">${receptopbouw()?'De service heeft voor werkbak '+esc(rcKeus)+' nog geen recept opgebouwd.':'De PLC meldt geen receptopbouw.'}</div>`;
    $('#rc-lijst').innerHTML=`<div class="tw-leeg">${receptopbouw()?'Vraag de service om het recept op te bouwen (Service → Receptopbouw).':'Er is nog geen PLC-programma met de receptopbouw, of de brug geeft hem niet door.'}</div>`;
    ['#rc-msg','#rc-kpi','#rc-grens'].forEach(x=>$(x).innerHTML='');$('#rc-balk').innerHTML='';return;}
  const r=rcReken(p,c);
  if(!rbMatenCompleet(m,p.stappen))$('#rc-tank').innerHTML=twGeenMaten(m,p.stappen);
  else $('#rc-tank').innerHTML=tweelingSVG({bak:rcKeus,stappen:p.stappen,water:p.water,r:r,m:m,spook:rcSpook});
  const afw=p.stappen.filter(n=>Math.abs((c.waarden[n]||0)-rbStd(p,n))>1e-6).length;
  let h=`<div class="tw-rij kop"><span class="nm"><b>Recept werkbak ${esc(rcKeus)}</b> ${groepChip(bakGroep(rcKeus))}<br><span class="sub">${p.stappen.length} stoffen van de service · L ${perRef()} · ${afw?afw+' afwijkend van de standaard':'gelijk aan de standaard'}</span></span>${afw?`<button type="button" class="btn sm" id="rc-std">${ic('back',15,2)} Terug naar standaard</button>`:''}</div>`;
  const N=p.stappen.length+1;
  const wRij=i=>{const last=i===N-1;const vast=!last&&p.water[i]!=null;const lab=i===0?'Voorwater':last?'Aanvullen tot de batch':'Water na '+i;
    return `<div class="tw-rij w"><span class="tw-nr w">${ic('drop',16,2)}</span><span class="nm">${esc(lab)}<br><span class="sub">ingesteld door de service</span></span><span class="tw-val">${r?fix(r.w[i],0)+' L':STREEP}</span><span class="tw-tag">${last?'rest':vast?'vast':'auto'}</span></div>`;};
  h+=wRij(0);
  p.stappen.forEach((n,k)=>{const v=c.waarden[n]||0;const sd=rbStd(p,n);const af=Math.abs(v-sd)>1e-6;
    h+=`<div class="tw-rij"><span class="tw-nr">${k+1}</span><span class="nm">${esc(stofNaam(n))} ${groepChip(bronGroep(n))}<br><span class="sub">${r?fix(r.stofL[k],1)+' L in de batch':''}</span></span>${twStapper('t|'+n,v,1,stofNaam(n)+' in liter '+perRef())}<span class="tw-tag${af?' afw':''}">${af?'standaard '+esc(fix(sd,1)):'standaard'}</span></div>`;
    h+=wRij(k+1);});
  $('#rc-lijst').innerHTML=h;
  $('#rc-msg').innerHTML=rcMeld?twMelding(esc(rcMeld),'fout'):!r?'':r.past?twMelding('Het recept past.','ok')
    :twMelding(`Past niet: ${fix(r.teVeel,1)} L te veel. Verlaag eerst iets in liters.`,'fout');
  $('#rc-kpi').innerHTML=r?twCijfers(r,m,p.stappen):'';$('#rc-grens').innerHTML=rbMatenCompleet(m,p.stappen)?esc(twGrenzen(m)):'';
  const nu=c.bewerkt&&!rcGelijkPlc(c,rcKeus);
  $('#rc-balk').innerHTML=`<div class="cf-balk-tx"><b>${nu?'Werkbak '+esc(rcKeus)+' is gewijzigd':'Geen wijzigingen in '+esc(rcKeus)}</b>${nu?' · <span class="muted-2">nog niet in de PLC</span>':''}</div>
    <button type="button" class="btn" id="rc-annuleer" ${nu?'':'disabled'}>Annuleren</button><button type="button" class="btn primary" id="rc-stuur" ${nu?'':'disabled'}>${ic('check',16,2.2)} Naar de PLC sturen</button>`;}
function rcProbeer(zet){const p=rbVan(rcKeus);if(!p)return false;const c=rcC();const oud=JSON.stringify(c.waarden);zet(c);const r=rcReken(p,c);
  if(r&&r.teVeel>0){c.waarden=JSON.parse(oud);rcSpook=r.teVeel;rcMeld=`Past niet: dan komt de batch ${fix(r.teVeel,1)} L boven de ${fix(rbMaten(rcKeus).batch,0)} L. Verlaag eerst iets in liters.`;rcTeken();return false;}
  c.bewerkt=true;rcSpook=0;rcMeld='';$('#rc-uit').innerHTML='';rcTeken();return true;}
function rcKlik(e){const t=e.target;if(!$('#rc-lijst'))return;
  const b1=t.closest('[data-rcbak]');if(b1){rcKeus=b1.dataset.rcbak;rcSpook=0;rcMeld='';$('#rc-uit').innerHTML='';rcTeken();return;}
  if(t.closest('#rc-lijst [data-tws],#rc-std,#rc-stuur')&&!magNiveau('bediening')){vraagInlog('bediening');return;}
  const st=t.closest('[data-tws]');if(st&&st.closest('#rc-lijst')){const [,sl,d]=st.dataset.tws.split('|');const n=Number(sl);const dl=Number(d);
    rcProbeer(c=>{c.waarden[n]=Math.max(0,Math.round(((c.waarden[n]||0)+dl)*10)/10);});return;}
  if(t.closest('#rc-std')){const p=rbVan(rcKeus);if(!p)return;rcProbeer(c=>{p.stappen.forEach(n=>{c.waarden[n]=rbStd(p,n);});});toast('De standaard staat klaar; nog niet in de PLC','check');return;}
  if(t.closest('#rc-annuleer')){rcCon[rcKeus]=rcNieuw(rcKeus);rcSpook=0;rcMeld='';$('#rc-uit').innerHTML='';rcTeken();toast('Terug naar wat de PLC heeft','check');return;}
  if(t.closest('#rc-stuur')){rcStuur();return;}}
function rcInvoer(e){const inp=e.target.closest('#rc-lijst [data-twi]');if(!inp)return;if(!magNiveau('bediening')){rcTeken();vraagInlog('bediening');return;}const n=Number(inp.dataset.twi.split('|')[1]);const v=twGetal(inp.value);const m=rbMaten(rcKeus);
  if(v===null||v<0){toast('Vul een getal in (0 of meer)','warn');rcTeken();return;}
  if(m.ref>0&&v>m.ref){toast('Hoogstens '+fix(m.ref,0)+' L '+perRef(),'warn');rcTeken();return;}
  rcProbeer(c=>{c.waarden[n]=Math.round(v*10)/10;});}
async function rcStuur(){const p=rbVan(rcKeus);const c=rcC();const bak=rcKeus;const uit=$('#rc-uit');const knop=$('#rc-stuur');if(!p)return;
  const r=rcReken(p,c);if(!r||!r.past){uit.innerHTML=`<div class="check-banner error"><div class="cb-h">${ic('warn',16,2)} Het recept past niet</div><div>Er is niets verstuurd.</div></div>`;return;}
  const plc=rbTeler(bak,p);const waarden={};p.stappen.forEach((n,k)=>{if(Math.abs((c.waarden[n]||0)-plc[k])>1e-6)waarden[String(n)]=Number(c.waarden[n]||0);});
  if(!Object.keys(waarden).length)return;
  if(knop)knop.disabled=true;uit.innerHTML=`<div class="hw-hint">${ic('clock',14,2)} Verstuurd naar de brug…</div>`;
  const res=await opdracht('recept',{bak:bak,waarden:waarden});
  if(!res.ok){const code=res.antwoord&&res.antwoord.code;const waarom=res.status===501?nietNaarPlc('recepten'):(code&&ONTWERP.recepten.codes[code])||'';
    uit.innerHTML=`<div class="check-banner error"><div class="cb-h">${ic('warn',16,2)} Niet overgenomen${code?' (code '+esc(String(code))+')':''}</div><div>${esc(waarom)}${res.status===501?'':' '+esc(res.fout||'')}</div></div>`;if(knop)knop.disabled=false;return;}
  uit.innerHTML=`<div class="hw-hint">${ic('clock',14,2)} De brug nam het aan. Wachten tot ${wieBron()} de nieuwe liters teruggeeft…</div>`;
  haalBron();const tik=setInterval(haalBron,1000);
  const ok=await wachtOp(()=>Object.keys(waarden).every(n=>{const x=recept(bak,Number(n));return x&&Math.abs(Number(x.v)-waarden[n])<1e-6;}),10000);
  clearInterval(tik);
  if(ok){rcCon[bak]=rcNieuw(bak);rcGezien='';rcTeken();$('#rc-uit').innerHTML=`<div class="check-banner" style="border-color:var(--ok)"><div class="cb-h" style="color:var(--ok)">${ic('check',16,2)} Verwerkt: ${wieBron()} geeft de nieuwe liters terug</div><div>Ze gelden vanaf de volgende batch van werkbak ${esc(bak)}.</div></div>`;}
  else{uit.innerHTML=`<div class="check-banner warn"><div class="cb-h">${ic('warn',16,2)} Niet bevestigd</div><div>De brug nam het aan, maar binnen 10 s gaf ${wieBron()} de nieuwe liters niet terug.</div></div>`;if(knop)knop.disabled=false;}}

/* ==================================================================
   TOEGANG, ADVIESBLAD EN INSTELLINGENBESTAND - besluit Wessel 22-09 (middag):
   "ik wil dat iedereen die het dashboard opent en de juiste inlog heeft er
   bij kan", en het instellingenbestand ("een tot 4 is goed").
   - Inloggen per niveau: de BRUG controleert het wachtwoord en elke opdracht
     (scrypt-hash, sessie in een koekje, 30 min zonder gebruik = uitgelogd).
     Het scherm vraagt alleen; het beslist niets.
   - Kent de brug nog geen inlog (0.3 leest alleen), dan werkt het scherm zoals
     eerst: wisselen met één klik.
   - Het adviesblad (pdf) per recept staat op de machine, bij de brug.
   - Het instellingenbestand: opslaan op de eigen pc, en laden met eerst een
     overzicht van wat verandert; alles via de gewone opdrachten en toetsen.
   ================================================================== */
function inlogBekend(){return !!(bron.snap&&bron.snap.sessie&&typeof bron.snap.sessie==='object');}
function sessieInfo(){return inlogBekend()?bron.snap.sessie:null;}
function sessieNiveau(){const s=sessieInfo();return s&&NIVEAU_RANG[s.niveau]!=null?s.niveau:null;}
/* Bediening open (25-09, Wessel: "een normaal niveau zonder inlog voor de klant die bij de machine staat"): de brug
   meldt dan niveau 'bediening' met open=true. Dat is geen inlog: geen knop Uit, geen melding 'uitgelogd'. */
function sessieOpen(){const s=sessieInfo();return !!(s&&s.open);}
function echtIngelogd(){return !!sessieNiveau()&&!sessieOpen();}
/* de rang waarmee je iets mag wijzigen: met inlog die van de sessie (-1 = niet ingelogd), zonder inlog op de brug het gekozen niveau */
function sessieRang(){if(!inlogBekend())return NIVEAU_RANG[ui.niveau];const n=sessieNiveau();return n?NIVEAU_RANG[n]:-1;}
function magNiveau(n){return sessieRang()>=(NIVEAU_RANG[n]??9);}
function niveauNaam(n){const x=NIVEAUS.find(v=>v[0]===n);return x?x[1]:n;}
/* vraag een inlog voor 'niveau'; 'daarna' draait na een geslaagde inlog */
let inlogBezig=false;
function vraagInlog(niveau,daarna){if(!inlogBekend()||inlogBezig)return;const s=sessieInfo();const eerste=niveau==='configuratie'&&s&&s.eersteKeer;
  /* beschadigd wachtwoordbestand (brug 0.4): niemand logt in; niet doen alsof er nog geen wachtwoord is */
  const kapot=!!(s&&s.beschadigd);
  const geen=!kapot&&s&&s.ingesteld&&s.ingesteld[niveau]===false&&!eerste;
  inlogBezig=true;
  openModal(`${ic('key',18,2)} Inloggen · ${esc(niveauNaam(niveau))}`,
   kapot?`<p>Het wachtwoordbestand op de controller is <b>beschadigd</b>. Niemand kan nu inloggen; kijken kan wel.</p><p class="muted" style="font-size:14px">Laat de service de toegang herstellen met <b>TOEGANG-HERSTELLEN.bat</b> in de projectmap. Daarna vraagt dit scherm om een nieuw wachtwoord voor Configuratie. De adviesbladen en het logboek blijven staan.</p><div style="margin-top:12px"><button class="btn" id="in-x">Sluiten</button></div>`
   :geen?`<p>Voor <b>${esc(niveauNaam(niveau))}</b> is nog geen wachtwoord ingesteld. Dat doet iemand met Configuratie, op het scherm Configuratie → Toegang.</p><div style="margin-top:12px"><button class="btn" id="in-x">Sluiten</button></div>`
   :eerste?`<p class="muted" style="font-size:14px">Er is nog geen wachtwoord voor <b>Configuratie</b>. Kies het nu (minstens 6 tekens). Wie het eerst instelt, beheert daarna alle wachtwoorden.</p>
     <label class="sf-field" style="max-width:320px"><span>Nieuw wachtwoord</span><input id="in-ww" type="password" autocomplete="new-password"></label>
     <label class="sf-field" style="max-width:320px;margin-top:8px"><span>Nog een keer</span><input id="in-ww2" type="password" autocomplete="new-password"></label>
     <div style="display:flex;gap:8px;margin-top:12px"><button class="btn primary" id="in-ok">${ic('check',16,2.2)} Instellen en inloggen</button><button class="btn" id="in-x">Annuleren</button></div><div id="in-st" style="margin-top:12px"></div>`
   :`<label class="sf-field" style="max-width:320px"><span>Wachtwoord ${esc(niveauNaam(niveau))}</span><input id="in-ww" type="password" autocomplete="current-password" ${niveau==='bediening'?'inputmode="numeric"':''}></label>
     <div style="display:flex;gap:8px;margin-top:12px"><button class="btn primary" id="in-ok">${ic('key',16,2)} Inloggen</button><button class="btn" id="in-x">Annuleren</button></div>
     <p class="muted-2" style="font-size:12px;margin-top:10px">Na 30 minuten zonder gebruik log je vanzelf uit.</p><div id="in-st" style="margin-top:12px"></div>`,
   ()=>{inlogBezig=false;});
  /* ook dicht via Esc of naast het venster tikken (closeModal verbergt alleen), of vervangen door een ander venster */
  const wacht=setInterval(()=>{if(!$('#in-x')||!$('#modal-scrim').classList.contains('show')){inlogBezig=false;clearInterval(wacht);}},500);
  const sluit=()=>{inlogBezig=false;closeModal();};
  $('#in-x').onclick=sluit;const ww=$('#in-ww');if(ww){ww.focus();ww.addEventListener('keydown',e=>{if(e.key==='Enter')$('#in-ok').click();});}
  const ok=$('#in-ok');if(!ok)return;
  ok.onclick=async()=>{const st=$('#in-st');const w=String($('#in-ww').value);
    if(eerste){if(w.length<6){st.innerHTML=`<div class="check-banner error"><div class="cb-h">${ic('warn',16,2)} Minstens 6 tekens</div></div>`;return;}
      if(w!==String($('#in-ww2').value)){st.innerHTML=`<div class="check-banner error"><div class="cb-h">${ic('warn',16,2)} De twee wachtwoorden zijn niet gelijk</div></div>`;return;}}
    ok.disabled=true;const r=await brugPost(eerste?'/wachtwoord':'/login',eerste?{niveau:niveau,nieuw:w}:{niveau:niveau,wachtwoord:w});ok.disabled=false;
    if(!r.ok){st.innerHTML=`<div class="check-banner error"><div class="cb-h">${ic('warn',16,2)} ${esc(r.fout)}</div></div>`;const x=$('#in-ww');if(x){x.value='';x.focus();}return;}
    sluit();await haalBron();ui.niveau=niveau;bewaarUi();tekenNiveaus();tekenNav();render();toast('Ingelogd als '+niveauNaam(niveau),'key');if(daarna)daarna();};}
async function uitloggen(){await brugPost('/logout',{});await haalBron();ui.niveau='bediening';bewaarUi();tekenNiveaus();tekenNav();render();toast('Uitgelogd','user');}
/* een POST naar de brug buiten /command/ om (inloggen, wachtwoord) */
async function brugPost(pad,lading){try{const r=await fetch(basisUrl()+pad,{method:'POST',headers:{'Content-Type':'application/json','X-Bakkenvuller':'1'},body:JSON.stringify(lading||{})});
  let j=null;try{j=await r.json();}catch(e){}return r.ok&&j&&j.ok?{ok:true,antwoord:j}:{ok:false,status:r.status,fout:(j&&j.fout)||('HTTP '+r.status),antwoord:j};}
  catch(e){return {ok:false,status:0,fout:'de brug is niet bereikbaar'};}}
/* na elke ronde: is de sessie verlopen, dan terug naar wat nog mag */
let vorigeSessie;
function sessieBijwerken(){if(!inlogBekend())return;const n=sessieNiveau();const echt=echtIngelogd()?n:null;
  if(vorigeSessie!==undefined&&vorigeSessie&&!echt){toast('Uitgelogd na 30 minuten zonder gebruik','clock');}
  vorigeSessie=echt;const rang=n?NIVEAU_RANG[n]:0;
  if(NIVEAU_RANG[ui.niveau]>rang){ui.niveau=n||'bediening';bewaarUi();tekenNiveaus();tekenNav();render();}}
/* gebruik houdt de sessie levend: hoogstens één keer per minuut een seintje */
let laatsteSein=0;
function seinGebruik(){if(!inlogBekend()||!echtIngelogd())return;const t=Date.now();if(t-laatsteSein<60000)return;laatsteSein=t;brugPost('/sessie/verleng',{});}
document.addEventListener('pointerdown',seinGebruik,true);document.addEventListener('keydown',seinGebruik,true);

/* ---- Configuratie → Toegang: de wachtwoorden per niveau ---- */
function toegangTeken(){const el=$('#tg-kaart');if(!el)return;
  if(!inlogBekend()){el.innerHTML=`<div class="card-h"><h3>Toegang</h3><span class="sub">wachtwoorden per niveau</span></div><div class="card-pad muted" style="font-size:14px">Deze brug kent geen inlog: iedereen mag alles bekijken, en wijzigen gaat niet naar de PLC. Met een brug met inlog stel je hier de wachtwoorden per niveau in.</div>`;return;}
  const s=sessieInfo();const conf=sessieNiveau()==='configuratie';
  el.innerHTML=`<div class="card-h"><h3>Toegang</h3><span class="sub">een wachtwoord per niveau · alleen de brug kent ze, als hash · 30 min zonder gebruik = uitgelogd</span></div>
   <table class="tbl"><thead><tr><th>Niveau</th><th>Wat mag het</th><th>Wachtwoord</th><th class="r"></th></tr></thead><tbody>${NIVEAUS.map(([k,l])=>`<tr><td><b>${esc(l)}</b></td>
     <td class="muted" style="font-size:13px">${k==='bediening'?'recepten (liters), een adviesblad koppelen of vervangen · kijken kan iedereen, ook zonder inlog':k==='service'?'daarbij: receptopbouw, instellingen, kalibratie, handbediening, instellingenbestand, een adviesblad weghalen, het logboek van wijzigingen':'daarbij: configuratie en de wachtwoorden'}</td>
     <td>${s.ingesteld&&s.ingesteld[k]?pill('ok','ingesteld'):(k==='bediening'&&s.bedieningOpen)?pill('info','open, zonder wachtwoord'):pill('warn','nog niet')}</td>
     <td class="r">${conf?`<button type="button" class="btn sm" data-tg="${k}">${ic('key',14,2)} ${s.ingesteld&&s.ingesteld[k]?'Wijzigen':'Instellen'}</button>`:''}</td></tr>`).join('')}</tbody></table>
   ${conf?'':`<div class="hw-hint" style="padding:10px 14px">${ic('lock',14,2)} <span>Wachtwoorden instellen kan alleen met Configuratie.</span></div>`}`;}
function toegangWijzig(niveau){const min=niveau==='bediening'?4:6;
  openModal(`${ic('key',18,2)} Wachtwoord ${esc(niveauNaam(niveau))}`,
   `<p class="muted" style="font-size:14px">Minstens ${min} tekens. Wie nu met dit niveau is ingelogd, moet daarna opnieuw inloggen.</p>
    <label class="sf-field" style="max-width:320px"><span>Nieuw wachtwoord</span><input id="tg-ww" type="password" autocomplete="new-password"></label>
    <label class="sf-field" style="max-width:320px;margin-top:8px"><span>Nog een keer</span><input id="tg-ww2" type="password" autocomplete="new-password"></label>
    <div style="display:flex;gap:8px;margin-top:12px"><button class="btn primary" id="tg-ok">${ic('check',16,2.2)} Opslaan in de brug</button><button class="btn" id="tg-x">Annuleren</button></div><div id="tg-st" style="margin-top:12px"></div>`);
  $('#tg-x').onclick=closeModal;
  $('#tg-ok').onclick=async()=>{const w=String($('#tg-ww').value),st=$('#tg-st');
    if(w.length<min){st.innerHTML=`<div class="check-banner error"><div class="cb-h">${ic('warn',16,2)} Minstens ${min} tekens</div></div>`;return;}
    if(w!==String($('#tg-ww2').value)){st.innerHTML=`<div class="check-banner error"><div class="cb-h">${ic('warn',16,2)} De twee wachtwoorden zijn niet gelijk</div></div>`;return;}
    const r=await brugPost('/wachtwoord',{niveau:niveau,nieuw:w});
    if(!r.ok){st.innerHTML=`<div class="check-banner error"><div class="cb-h">${ic('warn',16,2)} ${esc(r.fout)}</div></div>`;return;}
    closeModal();await haalBron();toegangTeken();toast('Wachtwoord '+niveauNaam(niveau)+' opgeslagen','key');};}

/* ---- het adviesblad (pdf) per recept, bewaard bij de brug op de machine ----
   Bekijken mag iedereen die het dashboard opent, ook zonder inlog; koppelen en vervangen vragen Bediening,
   weghalen Service (besluit Wessel 22-09 avond: "je kan hem hier alleen niet veranderen of overschrijven"). */
let advLijst=null,advStand='',advTijd=0;
async function advLaad(forceer){if(!inlogBekend()){advLijst=null;advStand='geen';return;}
  if(!forceer&&Date.now()-advTijd<15000&&advLijst)return;
  try{const r=await fetch(basisUrl()+'/advies',{cache:'no-store'});if(r.status===401){advLijst=null;advStand='inlog';return;}
    if(!r.ok){advLijst=null;advStand=r.status===404?'geen':'fout';return;}advLijst=await r.json();advStand='ok';advTijd=Date.now();}
  catch(e){advLijst=null;advStand='fout';}}
function advKb(n){return n>=1048576?fix(n/1048576,1)+' MB':Math.max(1,Math.round(n/1024))+' kB';}
function advDatum(ts){const d=nlDatum(Date.parse(ts));return isFinite(d.getTime())?d.toLocaleDateString('nl-NL',{day:'2-digit',month:'2-digit',year:'numeric',timeZone:'UTC'}):STREEP;}
/* de regel bovenaan een recept; 'weg' = de service mag weghalen */
function advRij(bak){
  if(!inlogBekend())return `<div class="tw-adv"><span class="tw-adv-ic">${ic('doc',18,2)}</span><span class="nm">Adviesblad<br><span class="sub">Deze brug bewaart geen adviesbladen; met een brug met inlog koppel je hier de pdf van het adviesbureau.</span></span></div>`;
  if(advStand==='inlog')return `<div class="tw-adv"><span class="tw-adv-ic">${ic('doc',18,2)}</span><span class="nm">Adviesblad<br><span class="sub">Deze brug toont adviesbladen alleen na het inloggen.</span></span><button type="button" class="btn sm" data-adv="inlog">${ic('key',14,2)} Inloggen</button></div>`;

   ${eerder}${a?`<button type="button" class="btn sm" data-adv="kijk" data-id="${esc(a.id)}" data-naam="${esc(a.naam)}">${ic('eye',14,2)} Bekijken</button>`:''}
