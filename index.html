<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bakkenvuller – bediening</title>
<!-- Lettertypen worden LOKAAL geladen (geen CDN → werkt offline op de controller). Zie @font-face hieronder + de map ./fonts/ -->
<style>
/* ===== LETTERTYPEN - lokaal/offline (geen CDN). local() pakt een geïnstalleerde
   font; anders de woff2 uit ./fonts/; anders de systeem-stack (SF Pro op Apple). ===== */
@font-face{font-family:"Inter";font-style:normal;font-weight:400;font-display:swap;src:local("Inter"),url("./fonts/Inter-Regular.woff2") format("woff2")}
@font-face{font-family:"Inter";font-style:normal;font-weight:500;font-display:swap;src:local("Inter Medium"),url("./fonts/Inter-Medium.woff2") format("woff2")}
@font-face{font-family:"Inter";font-style:normal;font-weight:600;font-display:swap;src:local("Inter SemiBold"),url("./fonts/Inter-SemiBold.woff2") format("woff2")}
@font-face{font-family:"Inter";font-style:normal;font-weight:700;font-display:swap;src:local("Inter Bold"),url("./fonts/Inter-Bold.woff2") format("woff2")}
@font-face{font-family:"IBM Plex Mono";font-style:normal;font-weight:400;font-display:swap;src:local("IBM Plex Mono"),url("./fonts/IBMPlexMono-Regular.woff2") format("woff2")}
@font-face{font-family:"IBM Plex Mono";font-style:normal;font-weight:500;font-display:swap;src:local("IBM Plex Mono Medium"),url("./fonts/IBMPlexMono-Medium.woff2") format("woff2")}
@font-face{font-family:"IBM Plex Mono";font-style:normal;font-weight:600;font-display:swap;src:local("IBM Plex Mono SemiBold"),url("./fonts/IBMPlexMono-SemiBold.woff2") format("woff2")}

/* ============================================================
   DESIGN TOKENS (overgenomen uit de oude HMI)
   Licht thema. Koel-getinte neutralen. Kleur = betekenis.
   Merkrood alleen in het logo; functioneel accent = blauw.
   ============================================================ */
:root{
  /* neutralen (koel) */
  --c-canvas:#EBF0EC;
  --c-surface:#FFFFFF;
  --c-sunken:#F1F6F1;
  --c-line:#E0E7E0;
  --c-line-2:#C7D1C7;
  --ink:#19241D;
  --ink-2:#506159;
  --ink-3:#67766C;
  --ink-inv:#FFFFFF;

  /* functioneel accent (blauw) */
  --acc:#1C6E45;
  --acc-600:#155737;
  --acc-700:#0F4429;
  --acc-100:#CDE7D6;
  --acc-50:#E9F4ED;

  /* merk (Cogas) - solide = gelijk aan het accent (één groen); rood leeft alleen in het logo-artwork */
  --brand:var(--acc);
  --brand-dark:#154833;
  --brand-mid:#2A6F50;
  --brand-light:#4D8E6E;
  --brand-grad:linear-gradient(135deg,#154833 0%,#27674A 52%,#4D8E6E 100%);

  /* status - altijd met icoon + label (kleurenblind-veilig) */
  --ok:#1C7A4D;      --ok-bg:#E9F4ED;   --ok-line:#BBE0C8;
  --warn:#945800;    --warn-bg:#FBF0DC;  --warn-line:#F0D49A;
  --alarm:#BE3226;   --alarm-bg:#FBE7E4; --alarm-line:#F2C0B9;
  --info:#2563A8;    --info-bg:#E7EEF8;  --info-line:#C2D4ED;
  --idle:#94A3B4;    --idle-bg:#EEF2F6;

  /* proceskleuren A / B (rustig, onderscheidbaar, ≠ status) */
  --a:#2E6E8E;  --a-soft:#9CC1D1;  --a-bg:#E7F0F4;
  --b:#6A5FB0;  --b-soft:#BDB4E2;  --b-bg:#EDEBF7;

  /* radii */
  --r-sm:6px; --r-md:10px; --r-lg:14px; --r-xl:20px; --r-pill:999px;

  /* schaduw (gelaagd, subtiel) */
  --sh-1:0 1px 2px rgba(18,38,26,.06);
  --sh-2:0 1px 2px rgba(18,38,26,.06), 0 2px 6px rgba(18,38,26,.05);
  --sh-3:0 2px 5px rgba(18,38,26,.06), 0 10px 24px rgba(18,38,26,.09);
  --sh-4:0 8px 18px rgba(18,38,26,.12), 0 28px 60px rgba(18,38,26,.22);
  /* motion */
  --dur-fast:120ms; --dur:200ms; --dur-slow:300ms;
  --ease:cubic-bezier(.4,0,.2,1);
  --ease-out:cubic-bezier(.16,1,.3,1);
  --ease-in:cubic-bezier(.4,0,1,1);
  --spring:cubic-bezier(.34,1.4,.64,1);

  /* maatvoering */
  --topbar-h:60px;
  --rail-w:248px;
  --rail-w-collapsed:76px;

  --font:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI","Roboto","Helvetica Neue","Cantarell","Noto Sans",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,"Cascadia Code",Consolas,monospace;
}

/* ============================================================
   DONKER THEMA - controlekamer / nachtdienst (24/7).
   Eigen ontwerp (geen kleuromkering): koel charcoal, lichtere
   semantische kleuren, donkere tekst op gevulde knoppen/badges.
   Activeer via de topbar-toggle of de OS-voorkeur (zie init()).
   Alle contrasten ≥ WCAG AA geverifieerd.
   ============================================================ */
:root[data-theme="dark"]{
  --c-canvas:#14181A;
  --c-surface:#1B2123;
  --c-sunken:#161B1D;
  --c-line:rgba(255,255,255,.09);
  --c-line-2:rgba(255,255,255,.17);

  --ink:#E6EBE8;
  --ink-2:#9FB0A8;
  --ink-3:#7E8E85;
  --ink-inv:#0E1416;

  --acc:#3E9E6E;
  --acc-600:#4FB07E;
  --acc-700:#8FD3AC;
  --acc-100:#1F3A2C;
  --acc-50:#172420;

  --ok:#4FB67E;    --ok-bg:#15291F;   --ok-line:rgba(79,182,126,.32);
  --warn:#E3A646;  --warn-bg:#2A2212;  --warn-line:rgba(227,166,70,.32);
  --alarm:#F06A5C; --alarm-bg:#2E1714; --alarm-line:rgba(240,106,92,.34);
  --info:#5B9BE0;  --info-bg:#15222E;  --info-line:rgba(91,155,224,.32);
  --idle:#6E817A;  --idle-bg:#1E2426;

  --a:#5AA0C0;  --a-soft:#3A6F86;  --a-bg:#16242B;
  --b:#9A8FE0;  --b-soft:#5A4F90;  --b-bg:#1E1B2E;

  --brand:var(--acc);
  --brand-grad:linear-gradient(135deg,#1E523B 0%,#2F7A53 52%,#46A074 100%);

  --sh-1:0 1px 2px rgba(0,0,0,.4);
  --sh-2:0 1px 2px rgba(0,0,0,.45), 0 2px 6px rgba(0,0,0,.32);
  --sh-3:0 2px 6px rgba(0,0,0,.5), 0 12px 28px rgba(0,0,0,.5);
  --sh-4:0 10px 24px rgba(0,0,0,.55), 0 30px 60px rgba(0,0,0,.6);
}
:root[data-theme="dark"] .topbar{background:rgba(20,24,26,.82)}
/* donkere tekst op gevulde (nu lichtere) knoppen & badges - anders onleesbaar */
:root[data-theme="dark"] .btn.primary,
:root[data-theme="dark"] .step.active .knob,
:root[data-theme="dark"] .nav-badge,
:root[data-theme="dark"] .tb-bell .cnt,
:root[data-theme="dark"] .badge-fo,
:root[data-theme="dark"] .tb-badge.alarm,
:root[data-theme="dark"] .tb-badge.warn{color:#0E1416}
/* knoppen met ink-achtergrond (worden licht) → donkere tekst */

:root[data-theme="dark"] .toast,
:root[data-theme="dark"] .toast .ic-wrap{color:#14181A}
/* SVG-procesmimic: hardgecodeerde lijn-/vlakkleuren in donker bijtrekken */






/* hardgecodeerde lichte achtergronden die anders fel oplichten in donker */
:root[data-theme="dark"] body{background:#14181A}



:root[data-theme="dark"] .io-type.DO{background:var(--ok-bg);color:var(--ok)}
:root[data-theme="dark"] .io-type.DI{background:var(--warn-bg);color:var(--warn)}
:root[data-theme="dark"] .io-type.AI{background:var(--a-bg);color:var(--a)}


*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  font-family:var(--font);
  font-size:14px;
  line-height:1.45;
  color:var(--ink);
  background:var(--c-canvas);
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}

h1,h2,h3,h4{margin:0;font-weight:600;letter-spacing:-.01em}
button{font-family:inherit}
::selection{background:var(--acc-100)}

/* toetsenbord-focus - zichtbare ring voor toetsenbordgebruikers (muis/touch ongemoeid) */
button:focus-visible,summary:focus-visible,a:focus-visible,[role="button"]:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.btn.primary:focus-visible{outline-color:var(--ink);outline-offset:3px}

/* scrollbars */
*{scrollbar-width:thin;scrollbar-color:var(--c-line-2) transparent}
*::-webkit-scrollbar{width:10px;height:10px}
*::-webkit-scrollbar-thumb{background:var(--c-line-2);border-radius:99px;border:3px solid var(--c-canvas)}
*::-webkit-scrollbar-thumb:hover{background:var(--ink-3)}

/* ============================================================ TOPBAR */
.topbar{
  position:fixed; inset:0 0 auto 0; height:var(--topbar-h); z-index:60;
  display:flex; align-items:center; gap:14px;
  padding:0 16px;
  background:rgba(255,255,255,.86);
  backdrop-filter:saturate(1.4) blur(10px);
  border-bottom:1px solid var(--c-line);
}
.topbar.estop{box-shadow:inset 0 -3px 0 var(--alarm)}
.tb-burger{
  display:flex; width:42px;height:42px;border:none;background:transparent;
  border-radius:var(--r-sm); color:var(--ink-2); cursor:pointer; align-items:center;justify-content:center;
}
.tb-burger:hover{background:var(--c-sunken)}
.brand{display:flex;align-items:center;gap:11px;min-width:0;flex:0 1 auto;overflow:hidden}
.brand-logo{display:flex;align-items:center;gap:2px;font-weight:700;font-size:19px;letter-spacing:-.03em;color:var(--ink)}

.brand-sep{width:1px;height:24px;background:var(--c-line-2);margin:0 2px}
.brand-machine{display:flex;flex-direction:column;line-height:1.15;min-width:0}
.brand-machine .m{font-weight:600;font-size:13.5px}
.brand-machine .u{font-size:11px;color:var(--ink-3)}
.brand-machine .u .mono{font-size:11px}
.tb-spacer{flex:1}
.tb-cluster{display:flex;align-items:center;gap:8px;flex-shrink:0}
.tb-conn{display:flex;align-items:center;gap:7px;padding:6px 11px;border:1px solid var(--c-line);border-radius:var(--r-pill);background:var(--c-surface);font-size:12.5px;color:var(--ink-2);white-space:nowrap}
.tb-conn .pulse{width:8px;height:8px;border-radius:50%;background:var(--ok);position:relative}
.tb-conn .pulse::after{content:"";position:absolute;inset:-4px;border-radius:50%;border:1px solid var(--ok);opacity:.6;animation:ping 2.4s ease-out infinite}
@keyframes ping{0%{transform:scale(.6);opacity:.6}80%,100%{transform:scale(1.7);opacity:0}}
.tb-conn.off .pulse{background:var(--alarm)} .tb-conn.off .pulse::after{border-color:var(--alarm)}
.tb-clock{font-size:12.5px;color:var(--ink-2);text-align:right;line-height:1.15;white-space:nowrap}
.tb-clock .t{font-weight:600;color:var(--ink);font-size:14px}
.tb-clock .d{font-size:11px;color:var(--ink-3)}
.tb-bell{position:relative;width:42px;height:42px;border:1px solid var(--c-line);background:var(--c-surface);border-radius:var(--r-sm);color:var(--ink-2);cursor:pointer;display:flex;align-items:center;justify-content:center}
.tb-bell:hover{background:var(--c-sunken);color:var(--ink)}
.tb-bell .cnt{position:absolute;top:-6px;right:-6px;min-width:19px;height:19px;padding:0 5px;border-radius:99px;background:var(--alarm);color:#fff;font-size:11px;font-weight:600;display:flex;align-items:center;justify-content:center;border:2px solid var(--c-surface)}
.tb-bell.q .cnt{background:var(--warn)}
.tb-bell.none .cnt{display:none}

/* role segmented */
.roles{display:inline-flex;background:var(--c-sunken);border:1px solid var(--c-line);border-radius:var(--r-pill);padding:3px}
.roles button{border:none;background:transparent;padding:7px 13px;border-radius:var(--r-pill);font-size:12.5px;font-weight:500;color:var(--ink-2);cursor:pointer;display:flex;align-items:center;gap:6px;white-space:nowrap}
.roles button .ic{display:flex}
.roles button[aria-pressed="true"]{background:var(--c-surface);color:var(--ink);box-shadow:var(--sh-1);font-weight:600}
.roles button:not([aria-pressed="true"]):hover{color:var(--ink)}

/* ============================================================ LAYOUT */
.shell{display:flex;min-height:100vh;padding-top:var(--topbar-h)}
.rail{
  position:fixed;left:0;top:var(--topbar-h);bottom:0;width:var(--rail-w);z-index:40;
  background:var(--c-surface);border-right:1px solid var(--c-line);
  display:flex;flex-direction:column;padding:14px 12px;gap:3px;overflow-y:auto;
  transition:transform .25s ease, width .22s var(--ease);
}
.rail-group-label{font-size:10.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);padding:14px 12px 6px}
.nav-item{
  display:flex;align-items:center;gap:12px;width:100%;
  padding:11px 12px;border-radius:var(--r-md);border:none;background:transparent;
  color:var(--ink-2);font-size:14px;font-weight:500;cursor:pointer;text-align:left;position:relative;
  min-height:46px;
}
.nav-item .ic{display:flex;flex:0 0 22px;color:var(--ink-3)}
.nav-item .lbl{flex:1;white-space:nowrap;overflow:hidden}
.nav-item .tag{font-size:10.5px;font-weight:600;color:var(--ink-3)}
.nav-item:hover{background:var(--c-sunken);color:var(--ink)}
.nav-item:hover .ic{color:var(--ink-2)}
.nav-item[aria-current="page"]{background:var(--acc-50);color:var(--acc-700);font-weight:600}
.nav-item[aria-current="page"] .ic{color:var(--acc)}
.nav-item[aria-current="page"]::before{content:"";position:absolute;left:0;top:9px;bottom:9px;width:3px;border-radius:0 3px 3px 0;background:var(--acc)}



.nav-badge{margin-left:auto;min-width:20px;height:20px;padding:0 6px;border-radius:99px;font-size:11px;font-weight:600;display:flex;align-items:center;justify-content:center;background:var(--alarm);color:#fff}
.nav-badge.warn{background:var(--warn)}
.rail-foot{margin-top:auto;padding:12px 10px 4px;border-top:1px solid var(--c-line);font-size:11px;color:var(--ink-3);display:flex;flex-direction:column;gap:3px}
.rail-foot .row{display:flex;justify-content:space-between;gap:8px}

.main{flex:1;margin-left:var(--rail-w);min-width:0;padding:24px 28px 64px;transition:margin .25s ease}
.scrim{display:none;position:fixed;inset:var(--topbar-h) 0 0 0;background:rgba(16,33,46,.4);z-index:35}
/* ingeklapte zijbalk (handmatig, via de topbar-knop) - alleen waar de rail vast staat (>720px).
   Geeft op de HMI een smalle icoon-rail en dus een veel groter contentscherm. */
@media (min-width:721px){
  body.rail-collapsed{--rail-w:76px}
  body.rail-collapsed .rail .nav-item .lbl,
  body.rail-collapsed .rail .rail-group-label,
  body.rail-collapsed .rail .rail-foot,
  body.rail-collapsed .rail .nav-item .tag{display:none}
  body.rail-collapsed .rail .nav-item{justify-content:center;padding:11px}
  body.rail-collapsed .rail .nav-item .ic{flex:0 0 24px}
  body.rail-collapsed .rail .nav-badge{position:absolute;top:5px;right:8px;margin:0;min-width:16px;height:16px;font-size:10px;padding:0 4px}
  body.rail-collapsed .rail .nav-item[aria-current="page"]::before{top:6px;bottom:6px}
  body.rail-collapsed .tb-burger{color:var(--acc)}
}

/* ============================================================ PAGE HEAD */
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:20px;flex-wrap:wrap}
.page-head .titles h1{font-size:22px}
.page-head .titles p{margin:3px 0 0;color:var(--ink-2);font-size:13.5px}
.page-actions{display:flex;gap:10px;flex-wrap:wrap}

/* ============================================================ COMPONENTS */
.card{background:var(--c-surface);border:1px solid var(--c-line);border-radius:var(--r-lg);box-shadow:var(--sh-2)}
.card-pad{padding:18px}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:15px 18px;border-bottom:1px solid var(--c-line)}
.card-h h3{font-size:14.5px}
.card-h .sub{font-size:12px;color:var(--ink-3)}
.muted{color:var(--ink-2)} .muted-2{color:var(--ink-3)}
/* ── data-versheid / kwaliteit (grondwet §5) - grijs = verouderd/ongeldig,
   redundant met icoon+label+tijd; randen i.p.v. vlakken → klopt licht én donker ── */



.q-flag{display:inline-flex;align-items:center;gap:4px;font:600 10px/1 var(--font);
  letter-spacing:.02em;padding:3px 8px;border-radius:var(--r-pill);
  border:1px solid var(--c-line-2);color:var(--idle);margin-left:8px;vertical-align:middle;white-space:nowrap}
.q-flag.bad{border-color:var(--alarm-line);color:var(--alarm)}
.q-flag.unc{border-color:var(--warn-line);color:var(--warn)}
.q-flag svg{flex:none}
.hsum-state.stale{background:transparent;border:1px solid var(--c-line-2);color:var(--idle)}
.hsum-ic.stale{color:var(--idle)}

 
.eyebrow{font-size:10.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3)}

.grid{display:grid;gap:16px}
.cols-2{grid-template-columns:repeat(2,1fr)}
.cols-3{grid-template-columns:repeat(3,1fr)}




/* buttons */
.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border-radius:var(--r-md);border:1px solid var(--c-line-2);background:var(--c-surface);color:var(--ink);font-size:13.5px;font-weight:600;cursor:pointer;min-height:46px;white-space:nowrap;transition:background .12s,border-color .12s,box-shadow .12s,transform .04s}
.btn .ic{display:flex}
.btn:hover{background:var(--c-sunken);border-color:var(--ink-3)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--acc);border-color:var(--acc);color:#fff;box-shadow:var(--sh-1)}
.btn.primary:hover{background:var(--acc-600);border-color:var(--acc-600)}


.btn.ghost{border-color:transparent;background:transparent;color:var(--ink-2)}
.btn.ghost:hover{background:var(--c-sunken);color:var(--ink)}
.btn.sm{padding:7px 11px;min-height:34px;font-size:12.5px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:disabled:active{transform:none}

/* status pill (icon + label) */
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px 4px 8px;border-radius:var(--r-pill);font-size:12px;font-weight:600;border:1px solid transparent;line-height:1}
.pill .ic{display:flex}
.pill.ok{background:var(--ok-bg);color:var(--ok);border-color:var(--ok-line)}
.pill.warn{background:var(--warn-bg);color:var(--warn);border-color:var(--warn-line)}
.pill.alarm{background:var(--alarm-bg);color:var(--alarm);border-color:var(--alarm-line)}
.pill.info{background:var(--info-bg);color:var(--info);border-color:var(--info-line)}
.pill.idle{background:var(--idle-bg);color:var(--ink-2);border-color:var(--c-line-2)}
.pill.run{background:var(--acc-50);color:var(--acc-700);border-color:var(--acc-100)}

      

/* tables */
table.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-3);text-align:left;padding:10px 14px;border-bottom:1px solid var(--c-line);background:var(--c-sunken);position:sticky;top:0}
.tbl td{padding:11px 14px;border-bottom:1px solid var(--c-line);vertical-align:middle}
.tbl tr:last-child td,.tbl tbody tr:last-child td{border-bottom:none}
.tbl tbody tr:hover{background:var(--c-sunken)}
.tbl td.r,.tbl th.r{text-align:right}
.tbl .tag{font-family:var(--mono);font-size:12px;color:var(--ink-2)}
.tbl .val{font-family:var(--mono);font-variant-numeric:tabular-nums;font-weight:600}

/* kpi tiles */






/* level bar (linear) */
.lvl{height:9px;border-radius:99px;background:var(--c-line);overflow:hidden;position:relative}
.lvl > i{position:absolute;left:0;top:0;bottom:0;border-radius:99px;transition:width .8s cubic-bezier(.22,.61,.36,1)}
.lvl.a > i{background:linear-gradient(90deg,var(--a-soft),var(--a))}
.lvl.b > i{background:linear-gradient(90deg,var(--b-soft),var(--b))}
.lvl .min{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--alarm);opacity:.55}

/* tank tile (customer) */
.tank{display:flex;gap:14px;align-items:stretch}
.tank .glass{position:relative;width:54px;flex:0 0 54px;border:2px solid var(--c-line-2);border-radius:10px;background:var(--c-sunken);overflow:hidden}
.tank .glass > i{position:absolute;left:0;right:0;bottom:0;transition:height .9s cubic-bezier(.22,.61,.36,1)}
.tank.a .glass > i{background:linear-gradient(180deg,var(--a-soft),var(--a))}
.tank.b .glass > i{background:linear-gradient(180deg,var(--b-soft),var(--b))}
.tank .glass .mark{position:absolute;left:0;right:0;height:0;border-top:2px dashed var(--alarm);opacity:.5}

/* ============================================================ CRAFT LAYER - depth, motion, character */
body{background:linear-gradient(177deg,#F0F4F0 0%,#E7EDE8 100%);background-attachment:fixed}

/* focus - brand-green glow (keyboard only) */
:focus{outline:none}
.btn:focus-visible,.nav-item:focus-visible,.tabs button:focus-visible,.roles button:focus-visible,input:focus-visible,.al-row:focus-visible{
  box-shadow:0 0 0 3px var(--acc-50),0 0 0 1.5px var(--acc)!important}

/* micro-feedback */
.btn{transition:background var(--dur-fast) var(--ease),border-color var(--dur-fast) var(--ease),box-shadow var(--dur-fast) var(--ease),transform 90ms var(--ease-out)}
.btn:active{transform:translateY(1px) scale(.99)}
.btn.primary{background:var(--acc);border-color:var(--acc)}

.nav-item,.tabs button,.roles button{transition:background var(--dur-fast) var(--ease),color var(--dur-fast) var(--ease),box-shadow var(--dur-fast) var(--ease)}
.pill{transition:background var(--dur) var(--ease),color var(--dur) var(--ease),border-color var(--dur) var(--ease)}

/* entrance - staggered reveal on screen change */
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
#main.reveal>*{animation:fadeUp .5s var(--ease-out) both}
#main.reveal>*:nth-child(1){animation-delay:.00s}
#main.reveal>*:nth-child(2){animation-delay:.05s}
#main.reveal>*:nth-child(3){animation-delay:.10s}
#main.reveal>*:nth-child(4){animation-delay:.15s}
#main.reveal>*:nth-child(5){animation-delay:.20s}
#main.reveal>*:nth-child(n+6){animation-delay:.24s}

/* modal - soft pop */
@keyframes popIn{from{opacity:0;transform:translateY(10px) scale(.985)}to{opacity:1;transform:none}}
@keyframes scrimIn{from{opacity:0}to{opacity:1}}
.modal-scrim.show{animation:scrimIn .2s var(--ease) both}
.modal-scrim.show .modal{animation:popIn .3s var(--ease-out) both}

.hw-tab.DO{background:linear-gradient(180deg,#D08828,#C2791F)}

.hw-ebody{flex:1;display:flex;flex-direction:column;min-width:0}

/* module-kop: PC-merk + type + artikelnr */
.hw-head{padding:5px 7px 4px;border-bottom:1px solid rgba(0,0,0,.10);background:linear-gradient(180deg,rgba(255,255,255,.55),rgba(255,255,255,.18))}

.hw-ch .pin{position:relative;width:12px;height:11px;border-radius:2px;background:linear-gradient(180deg,#454e48,#262d28);box-shadow:inset 0 0 0 1px rgba(0,0,0,.55),inset 0 1px 1px rgba(255,255,255,.10);flex:0 0 auto;overflow:hidden}

/* oranje potentiaal-/voedingsklem (UP) midden in de module */
.hw-pot{display:flex;align-items:center;gap:4px;height:13px;margin:2px 1px;padding:0 4px;border-radius:3px;background:linear-gradient(180deg,rgba(226,149,47,.30),rgba(207,127,28,.18));border:1px solid rgba(196,118,20,.55);flex:0 0 auto}

.hw-ef{display:flex;align-items:center;gap:6px;padding:3px 7px;margin-top:auto;border-top:1px solid rgba(0,0,0,.12);background:linear-gradient(180deg,rgba(255,255,255,.30),rgba(0,0,0,.04));font-family:var(--mono)}

/* decentrale veldbus-stations */


































/* realistische buskoppelaar (zoals AXL F BK PN TPS) */




















/* veldbus-stations met eigen I/O-rail (zelfde opbouw als PLC) */













/* SD-kaart in controller */
.hw-sd{width:100%;border:0;background:#c0c7c4;border-radius:5px;padding:6px;display:flex;flex-direction:column;gap:5px;cursor:default;font:inherit}
.hw-sd.hw-pick{cursor:pointer}
.hw-sd.hw-pick:hover{outline:1.5px solid var(--acc);outline-offset:1px}
.hw-sd .slot.has{display:flex;align-items:center;justify-content:center;background:linear-gradient(90deg,#1f4a33,#2a6f50 70%,#1f4a33)}


/* doorzoekbare kiezer */






















/* ---- diagnostic faceplate ---- */





















.hw-ch.hand{box-shadow:inset 2px 0 0 var(--warn)}
.hw-ch.hand.flt{box-shadow:inset 2px 0 0 var(--warn),0 0 0 1px var(--alarm-line)}
.sys-card{margin-top:20px;overflow:hidden}
.sys-head{display:flex;align-items:center;gap:8px;padding:13px 16px;border-bottom:1px solid var(--c-line)}
.sys-head h3{font-size:14px}
.sys-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(152px,1fr));gap:1px;background:var(--c-line)}
.sys-tile{background:var(--c-surface);padding:11px 14px;display:flex;flex-direction:column;gap:4px;min-width:0}
.sys-tile .k{font-size:10.5px;color:var(--ink-3);font-weight:600;text-transform:uppercase;letter-spacing:.03em}
.sys-tile .v{font-size:14px;color:var(--ink);font-weight:600}
.sys-tile .v.mono{font-family:var(--mono)}
.sys-tile .sub{font-size:11px;color:var(--ink-3)}
.sys-tile .bar{position:relative;height:6px;border-radius:3px;background:var(--c-sunken);overflow:hidden;margin-top:3px}
.sys-tile .bar span{position:absolute;left:0;top:0;bottom:0;background:var(--acc);border-radius:3px;transition:width var(--dur)}
.sys-tile .bar span.warn{background:var(--warn)}.sys-tile .bar span.ok{background:var(--ok)}
.sys-tile .bar i{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--alarm);opacity:.55}

/* ---- diagnose & service-paneel ---- */



















#diag-cat{padding:0 16px 14px}
.dcat-grp{margin-bottom:13px}
.dcat-row{display:flex;align-items:baseline;gap:11px;padding:4px 0;border-bottom:1px solid var(--c-line)}




/* ---- systeemgezondheid / conditiemonitoring ---- */
























































/* ---- databron (simulatie / live) ---- */













/* ---- triage-balk + sub-tabs ---- */
.triage{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin:4px 0 14px;padding:14px 18px;border-radius:12px;border:1px solid var(--c-line);background:var(--c-surface);position:relative;overflow:hidden}
.triage::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px}
.triage.tone-ok::before{background:var(--ok)}
.triage.tone-warn::before{background:var(--warn)}
.triage.tone-alarm::before{background:var(--alarm)}
.triage.tone-ok{background:linear-gradient(90deg,var(--ok-bg,rgba(56,142,60,.08)),transparent 42%)}
.triage.tone-warn{background:linear-gradient(90deg,var(--warn-bg,rgba(214,158,46,.10)),transparent 46%)}
.triage.tone-alarm{background:linear-gradient(90deg,var(--alarm-bg),transparent 46%)}
.tg-main{display:flex;align-items:center;gap:13px;min-width:0}
.tg-ic{display:flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:50%;flex:0 0 auto}
.triage.tone-ok .tg-ic{background:var(--ok-bg,rgba(56,142,60,.14));color:var(--ok)}
.triage.tone-warn .tg-ic{background:var(--warn-bg,rgba(214,158,46,.16));color:var(--warn)}
.triage.tone-alarm .tg-ic{background:var(--alarm-bg);color:var(--alarm)}
.tg-txt{display:flex;flex-direction:column;min-width:0}
.tg-status{font-size:17px;font-weight:700;color:var(--ink);line-height:1.15}
.tg-sub{font-size:12.5px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:46ch}
.tg-right{margin-left:auto;display:flex;align-items:center;gap:12px}
.tg-src{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--ink-3);white-space:nowrap}
.tg-src.ok{color:var(--ok)}
.tg-src.alarm{color:var(--alarm)}
.hw-tabs{margin-bottom:16px}
.tb-badge{display:inline-flex;align-items:center;justify-content:center;min-width:18px;height:18px;padding:0 5px;border-radius:9px;font-size:11px;font-weight:700;color:#fff;background:var(--warn);margin-left:3px;vertical-align:middle}
.tb-badge.alarm{background:var(--alarm)}
.tb-badge.info{background:var(--ink-3)}
.tb-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ink-3);margin-left:5px;vertical-align:middle}
.tb-dot.ok{background:var(--ok)}
@media (max-width:760px){.tg-right{margin-left:0;width:100%;justify-content:space-between}.tg-sub{white-space:normal;max-width:none}}

/* ---- actie-eerst storingskaarten ---- */
.flt-wrap{margin-top:0;overflow:hidden}
.flt-h{display:flex;align-items:center;gap:8px;padding:13px 16px;border-bottom:1px solid var(--c-line)}
.flt-h h3{font-size:14px;margin:0}

.flt-list{padding:8px 12px 12px}
.flt-card{border:1px solid var(--c-line);border-left-width:4px;border-radius:10px;padding:11px 13px;margin-top:8px;background:var(--c-surface)}
.flt-card.tone-alarm{border-left-color:var(--alarm)}
.flt-card.tone-warn{border-left-color:var(--warn)}
.flt-card.tone-ok{border-left-color:var(--ok)}
.flt-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.flt-sev{font-size:11px;font-weight:700;padding:3px 9px;border-radius:99px;letter-spacing:.02em;white-space:nowrap}
.flt-sev.alarm{background:var(--alarm-bg);color:var(--alarm)}
.flt-sev.warn{background:var(--warn-bg,rgba(214,158,46,.14));color:var(--warn)}
.flt-sev.ok{background:var(--ok-bg,rgba(56,142,60,.12));color:var(--ok)}
.flt-what{font-size:14px;color:var(--ink);flex:1;min-width:150px;font-weight:600}
.flt-where{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--ink-2);font-family:var(--mono)}

.flt-now{display:flex;align-items:flex-start;gap:8px;margin-top:9px;font-size:13px;color:var(--ink-2);background:var(--c-sunken);border-radius:8px;padding:9px 11px;line-height:1.5}
.flt-now svg{flex:0 0 auto;margin-top:1px;color:var(--ink-3)}
.flt-now b{color:var(--ink)}






.flt-empty{display:flex;align-items:center;gap:10px;padding:18px 14px;color:var(--ink-2);font-size:13.5px}
.flt-empty svg{color:var(--ok);flex:0 0 auto}

/* ---- leesbaarheid op locatie (telefoon/tablet bij de kast) ---- */
@media (max-width:760px){
  .btn.sm{min-height:42px}
  .tabs button,.hw-tabs button{min-height:42px}
  .flt-card{padding:13px 14px}
  .flt-what{font-size:15px}
  .tg-status{font-size:19px}
  
  
}

.hw-tbl tr.grp td{background:var(--c-sunken);font-size:11px;font-weight:700;letter-spacing:.02em;color:var(--ink-2);text-transform:none;padding:8px 14px}

.tbl tr.flt td{background:var(--alarm-bg)}
.tbl tr.flt:hover td{background:var(--alarm-bg)}
.tbl tr.flt td.tag{color:var(--alarm);font-weight:600}

  html{scroll-behavior:auto!important}

  #main.reveal>*{animation:none!important}
  .tb-conn .pulse::after{animation:none!important}
  #boot .btrack>i{animation:none!important;width:100%}
}

<style id="bakkenvuller-aanvulling">
/* ===== Bakkenvuller - aanvullingen op de opmaak (21-09-2026) ===== */
.liq{transition:y .8s var(--ease),height .8s var(--ease)}
/* 22-09: de opmaak van het oude processchema (liq-, ls, sval, spump, roerder, status-lucht, ov-rij, ov-ml-) is weg;
   het nieuwe schema heeft sv-klassen, verderop. Het oude staat in archief\2026-09-22_reservekopieen. */
.bt-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:700px){.bt-grid{grid-template-columns:minmax(0,1fr)}}
.bt{border:1px solid var(--c-line);border-radius:var(--r-md);padding:12px 14px;background:var(--c-surface);min-height:96px}
.bt.rust{background:var(--c-sunken)}
.bt-h{display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:600;font-size:14px}
.bt-f{margin-top:8px;font-size:15px;font-weight:600}
.bt-r{margin-top:3px;font-size:13px;color:var(--ink-2)}
.bt-bar{height:8px;border-radius:4px;background:var(--c-sunken);overflow:hidden;margin-top:10px;border:1px solid var(--c-line)}
.bt-bar i{display:block;height:100%;background:var(--acc);transition:width .8s var(--ease)}
.bt-tel{font-size:12.5px;color:var(--ink-2);margin-top:4px}
.wb-vraag{display:inline-block;margin-left:4px;padding:1px 8px;border-radius:var(--r-pill);background:var(--warn-bg);border:1px solid var(--warn-line);color:var(--warn);font-size:11.5px;font-weight:600;vertical-align:middle}
.wb-vraag[hidden]{display:none}
.rc-cel{font-family:var(--mono);font-size:13.5px;min-width:68px;padding:5px 10px;border-radius:var(--r-sm);border:1px solid var(--c-line);background:var(--c-surface);color:var(--ink);cursor:pointer;text-align:right;
  /* even hoog, ook "past niet" met zijn kleinere letter (22-09 avond) */
  box-sizing:border-box;min-height:30px;display:inline-flex;align-items:center;justify-content:flex-end;gap:4px}
.rc-cel:hover{border-color:var(--acc);background:var(--acc-50)}
.rc-cel.leeg{color:var(--ink-3)}
.rc-tbl td,.rc-tbl th{padding-top:5px;padding-bottom:5px}
.wb-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
@media (max-width:900px){.wb-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.wb-grid .tank{cursor:pointer}
.io-vrij td{opacity:.5}
/* Meldingen (22-09): geen lege kolom meer tussen het icoon en de tekst; "eerste melding" in de kleur van de ernst */
.al-row{grid-template-columns:30px minmax(0,1fr) auto}
.badge-fo.warn{background:var(--warn)} .badge-fo.info{background:var(--info)}
/* Live I/O (22-09, S16): de enige kanaallijst; compacte regels op één lijn, de stand als lampje met aan/uit */
.io-tbl td{padding-top:9px;padding-bottom:9px;white-space:nowrap;vertical-align:middle}
.io-tbl td:nth-child(5){white-space:normal;min-width:260px}
.io-tbl .io-mod{font-size:12px;max-width:380px;overflow:hidden;text-overflow:ellipsis}
.io-tbl tbody tr{cursor:pointer}
.io-tbl tbody tr:hover td{background:var(--c-sunken)}
.io-st{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:600;color:var(--ink-3)}
.io-st i{width:9px;height:9px;border-radius:50%;background:var(--c-line-2);flex:none}
.io-st.aan{color:var(--ok)}
.io-st.aan i{background:var(--ok);box-shadow:0 0 0 3px var(--ok-bg)}
.hw-ch.onb .led{opacity:.35}
/* een lampje dat niet gemeten wordt: lichtgrijs, niet donker (donker = uit) */
.led.onb{background:#D5DBD8;box-shadow:inset 0 0 0 1px #9AA39E}
:root[data-theme="dark"] .led.onb{background:#4A524E;box-shadow:inset 0 0 0 1px #6B746F}
#ct-rek .hw-head[data-plek],#ct-rek .hw-tab[data-plek]{cursor:pointer}
#ct-samen tr[data-plek]{cursor:default}
.check-banner.error{background:var(--alarm-bg);border-color:var(--alarm-line);color:var(--alarm)}
.check-banner.warn{background:var(--warn-bg);border-color:var(--warn-line);color:var(--warn)}
.check-banner .cb-h{font-weight:700;display:flex;gap:7px;align-items:center}
/* ===== groepen A, B en A+B (besluit 22-09). A en B hebben de kleuren van hun kant; A+B een eigen
   derde kleur, zodat een gekozen A+B nooit op "niets gekozen" lijkt (Wessel, 22-09). ===== */
:root{--ab:#1F7A74;--ab-bg:#E1F2EF}
:root[data-theme="dark"]{--ab:#5CC3BB;--ab-bg:#15302D}
.gchip{display:inline-block;font-size:11px;font-weight:700;padding:1px 7px;border-radius:6px;line-height:1.5;vertical-align:1px;white-space:nowrap}
.gchip.ga{background:var(--a-bg);color:var(--a)} .gchip.gb{background:var(--b-bg);color:var(--b)}
.gchip.gab{background:var(--ab-bg);color:var(--ab)} .gchip.g0{background:var(--warn-bg);color:var(--warn)}
.rc-cel.past-niet{background:var(--c-sunken);color:var(--ink-3);border-style:dashed;font-family:inherit;font-size:12px;cursor:help}
.rc-cel.past-niet:hover{border-color:var(--c-line-2);background:var(--c-sunken)}
.rc-cel.past-niet.fout{color:var(--alarm);border-color:var(--alarm-line);background:var(--alarm-bg);font-family:var(--mono)}
/* ===== configuratiescherm: groot genoeg voor een vinger op het paneel (1920 x 1080, touch) ===== */
.cf-tellers{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-bottom:16px}
@media (max-width:900px){.cf-tellers{grid-template-columns:minmax(0,1fr)}}
.cf-t-k{font-weight:600;font-size:15px}
.cf-t-rij{display:flex;align-items:center;gap:14px;margin:10px 0 6px}
.cf-t-knop{min-width:60px;min-height:60px;font-size:26px;justify-content:center;padding:0}
.cf-t-n{font-size:34px;font-weight:700;min-width:60px;text-align:center}
input.cf-t-n{width:92px;height:60px;padding:0 6px;border:1px solid var(--c-line-2);border-radius:var(--r-md);background:var(--c-surface);color:var(--ink);font-family:var(--mono)}
input.cf-t-n:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-50)}
input.cf-t-n.cf-anders-tx{color:var(--warn)}
.cf-t-hw{font-size:13px;line-height:1.4}
.cf-anders-tx{color:var(--warn)}
.cf-rij{display:grid;grid-template-columns:44px 64px minmax(200px,1fr) 250px 196px minmax(130px,190px);gap:12px;align-items:center;padding:8px 16px;border-top:1px solid var(--c-line)}
.cf-rij.sp{grid-template-columns:44px 64px minmax(200px,1fr) 250px 196px 130px minmax(130px,190px)}
.cf-kopregel{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.03em;color:var(--ink-3);padding-top:6px;padding-bottom:6px;border-top:none}
.cf-nr{font-weight:700;color:var(--ink-2);font-size:15px}
.cf-klep{font-size:12.5px;color:var(--ink-2);line-height:1.35}
.cf-naam{display:flex;flex-direction:column;gap:3px;min-width:0}
.cf-naam input,.cf-getal input{height:48px;border:1px solid var(--c-line-2);border-radius:var(--r-md);padding:0 12px;font-size:15px;background:var(--c-surface);color:var(--ink);min-width:0}
.cf-naam small{font-size:11.5px}
.cf-groep{display:flex;gap:6px}
.cf-groep button{flex:1;min-height:48px;border-radius:var(--r-md);border:1.5px solid var(--c-line-2);background:var(--c-surface);font-size:15px;font-weight:700;cursor:pointer;transition:background .12s,border-color .12s,color .12s}
.cf-groep button.ga{color:var(--a)} .cf-groep button.gb{color:var(--b)} .cf-groep button.gab{color:var(--ab)}
.cf-groep button.aan.ga{background:var(--a);border-color:var(--a);color:#fff}
.cf-groep button.aan.gb{background:var(--b);border-color:var(--b);color:#fff}
.cf-groep button.aan.gab{background:var(--ab);border-color:var(--ab);color:#fff}
.cf-veld .cf-groep{max-width:320px}
.cf-getal{display:flex;align-items:center;gap:6px}
.cf-getal input{width:66px;text-align:center;font-family:var(--mono);padding:0 6px}
.cf-getal.inh input{width:100px}
.cf-getal button{min-width:48px;min-height:48px;border-radius:var(--r-md);border:1px solid var(--c-line-2);background:var(--c-surface);font-size:21px;cursor:pointer;color:var(--ink)}
.cf-st{font-size:12.5px;line-height:1.35} .cf-st.ok{color:var(--ok)} .cf-st.fout{color:var(--alarm)}
.cf-st.ok svg,.cf-st.fout svg{vertical-align:-3px}
.cf-anders{border-color:var(--warn)!important;box-shadow:inset 4px 0 0 var(--warn)}

/* telefoon: de balk breekt af (tekst boven, knoppen eronder), anders wordt de hele pagina breder dan het scherm */
@media (max-width:600px){.cf-balk{flex-wrap:wrap;padding:10px 12px}.cf-balk-tx{flex:1 1 100%}.cf-balk .btn{flex:1 1 auto;justify-content:center}.cf-balk .tw-vink{flex:1 1 100%}

.cf-batch-rij td{border-top:2px solid var(--c-line-2)}
/* de ingebruikname in vier stappen (23-09) */
.cf-stappen{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;padding:14px 16px}
.cf-stap{display:flex;gap:10px;align-items:flex-start;text-align:left;padding:12px;border:1px solid var(--c-line-2);border-radius:var(--r-md);background:var(--c-surface);cursor:pointer;color:var(--ink);font:inherit}
.cf-stap:hover{border-color:var(--acc);background:var(--acc-50)}
.cf-stap-nr{flex:none;width:28px;height:28px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;background:var(--c-sunken);border:1px solid var(--c-line);color:var(--ink-2)}
.cf-stap.ok .cf-stap-nr{background:var(--ok);border-color:var(--ok);color:#fff}
.cf-stap.open .cf-stap-nr{border-color:var(--warn);color:var(--warn)}
.cf-stap-tx{display:flex;flex-direction:column;gap:2px;min-width:0}.cf-stap-tx b{font-size:14px}.cf-stap-tx .sub{font-size:12px;color:var(--ink-3)}
.cf-stap-st{font-size:12.5px;color:var(--ink-2);margin-top:4px}.cf-stap.open .cf-stap-st{color:var(--warn);font-weight:600}
@media (max-width:900px){.cf-stappen{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:600px){.cf-stappen{grid-template-columns:minmax(0,1fr)}}
.cf-veld .k{display:block;font-size:12px;color:var(--ink-3);font-weight:600;margin-bottom:6px}
.cf-veld small{display:block;margin-top:4px;font-size:11.5px}
.cf-mod ul{margin:6px 0 4px;padding-left:18px;font-size:13.5px;line-height:1.55}
/* ===== kalibratiescherm (besluit 22-09): dezelfde maten als Configuratie, goed voor een vinger ===== */
.kb-rij{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:8px 0}
.kb-rij>.k{font-size:12px;color:var(--ink-3);font-weight:600;min-width:120px}
.kb-rij .v{font-size:14px}
.kb-lp input{width:120px}
.kb-hulp{margin-top:12px;padding:12px 14px;border:1px dashed var(--c-line-2);border-radius:var(--r-md);background:var(--c-sunken)}
/* de vier stappen van de maatbeker: vaste kolommen, de knoppen recht onder elkaar (22-09 avond) */
.kb-stap{display:grid;grid-template-columns:28px 170px minmax(0,1fr) 180px;align-items:center;gap:12px;padding:8px 0;border-top:1px solid var(--c-line)}
.kb-rij+.kb-stap{border-top:0}
.kb-stap>.k{font-size:13px;color:var(--ink-2);font-weight:600}
.kb-stap>.btn{justify-self:stretch;justify-content:center}
.kb-stap .kb-tekst{grid-column:2 / -1;font-size:13px;color:var(--ink-2)}
.kb-nr{width:24px;height:24px;border-radius:50%;border:1px solid var(--c-line-2);background:var(--c-surface);display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--ink-2)}
.kb-vw{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
@media (max-width:900px){.kb-stap{grid-template-columns:28px minmax(0,1fr)}.kb-stap>:nth-child(n+3){grid-column:2}}
.kb-ijk{margin:0 16px 12px;padding:14px 16px;border:1.5px solid var(--acc);border-radius:var(--r-md);background:var(--c-surface)}
/* ijken van een niveaumeting (22-09, Wessel): het venster direct onder de regel van de sensor, de regel gemarkeerd,
   en de twee kaarten (nulpunt, toppunt) met dezelfde opbouw, zodat alles op één lijn staat */
.kb-niv-tbl tr{scroll-margin-top:calc(var(--topbar-h) + var(--connb,0px) + 12px)}
.kb-niv-tbl tr.kb-sel>td{background:var(--acc-50)}
.kb-niv-tbl tr.kb-ij-rij>td,.kb-niv-tbl tr.kb-ij-rij:hover>td{padding:0 0 14px;border-top:0;background:var(--acc-50)}
.kb-ij-rij .kb-ijk{margin:0 12px}
.kb-punt-u{font-size:12.5px;color:var(--ink-2);line-height:1.45;min-height:2.9em;margin:2px 0 12px}
.kb-velden{display:grid;grid-template-columns:56px max-content;gap:10px 14px;align-items:center}
.kb-velden>.k{font-size:12px;color:var(--ink-3);font-weight:600}
.kb-velden .cf-getal span{white-space:nowrap}
.kb-vast{justify-self:start;margin-top:2px}
.kb-sp{font-size:12.5px;color:var(--ink-2);min-height:18px;margin-top:10px}
.kb-ijk-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}
.kb-ijk-h h3{margin:0;font-size:16px}
.kb-punten{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
@media (max-width:1000px){.kb-punten{grid-template-columns:minmax(0,1fr)}}
.kb-punt{border:1px solid var(--c-line);border-radius:var(--r-md);padding:12px 14px}
.kb-punt-h{font-weight:700;font-size:14px;margin-bottom:2px}
.kb-zeker{display:flex;gap:10px;align-items:center;margin-top:10px;font-weight:600}
.kb-zeker input{width:24px;height:24px}
@media (max-width:1180px){
  .cf-rij,.cf-rij.sp{grid-template-columns:44px minmax(0,1fr) minmax(0,1fr);row-gap:8px}
  .cf-rij .cf-naam{grid-column:2/4}.cf-rij .cf-groep{grid-column:1/3}.cf-rij .cf-st{grid-column:1/4}
  .cf-kopregel{display:none}}

/* Instellingen: vullen en de mengers van de sporenbakken (besluit Wessel 22-09) */
.in-tegels{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;padding:14px 16px}
.in-tegel{border:1px solid var(--c-line);border-radius:var(--r-md);padding:12px 14px;background:var(--c-surface)}
.in-kop{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.in-kop .mono{margin-left:auto;font-size:12.5px}
.in-balk{position:relative;height:10px;border-radius:5px;background:var(--c-sunken);border:1px solid var(--c-line);margin:6px 0 10px;overflow:hidden}
.in-balk .n{position:absolute;left:0;top:0;bottom:0;background:var(--info);opacity:.45}
.in-balk .g{position:absolute;top:-1px;bottom:-1px;width:3px;margin-left:-1px;background:var(--warn)}
.in-rij{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.in-rij .k,.in-cel .k{font-size:12px;color:var(--ink-3);font-weight:600}
.in-noot{font-size:12.5px;color:var(--ink-2);margin-top:6px;display:flex;align-items:center;gap:6px}
.in-noot.warn{color:var(--warn)}
.in-noot.ok{color:var(--ok)}
.in-noot.vraagt{color:var(--info)}
.in-sp{display:flex;gap:16px;align-items:flex-start;padding:14px 16px;border-top:1px solid var(--c-line)}
.in-sp-mid{flex:1;min-width:0}
.in-sp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(186px,1fr));gap:10px 14px;margin:4px 0}
.in-cel{display:grid;grid-template-columns:auto auto 1fr;align-items:center;column-gap:8px;row-gap:3px}
.in-cel .k{grid-column:1/-1}
.in-cel .val{font-size:14px}
.in-tank{flex:none}
.in-tank .wand{fill:var(--c-sunken);stroke:var(--c-line-2);stroke-width:1.5}
.in-tank .liq{fill:var(--info);opacity:.35}
.in-tank .lijn-vul{stroke:var(--warn);stroke-width:2;stroke-dasharray:5 3}
.in-tank .lijn-mg{stroke:var(--ab);stroke-width:2;stroke-dasharray:2 2}
.in-legenda{display:flex;gap:18px;flex-wrap:wrap;padding:12px 16px 10px;font-size:12px;color:var(--ink-3)}
.in-legenda i{display:inline-block;width:22px;height:0;vertical-align:middle;margin-right:4px;border-top:2px dashed var(--warn)}
.in-legenda i.lm{border-top:2px dotted var(--ab)}
/* −/+ in het venster van een instelling: bedienbaar op het touchpaneel */
/* 22-09: het venster per instelling is weg (Wessel: "zorg dat je daar gewoon direct de waarde kan instellen").
   Nu − waarde + in de tegel of tabel, zoals bij Recepten; oranje = gewijzigd, nog niet in de PLC. */
.ins-w{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.ins-st{width:132px}
.ins-kop-uitleg{display:block;font-size:11px;font-weight:400;text-transform:none;letter-spacing:0;color:var(--ink-3);margin-top:2px}
.ins-st.anders{border-color:var(--warn);box-shadow:inset 0 -3px 0 var(--warn)}
.ins-st.anders input{color:var(--warn);font-weight:700}
.ins-e{font-size:12.5px;color:var(--ink-3);min-width:22px;text-align:left}
.ins-slot{padding:0 8px}
.in-rij.in-rij-st{flex-direction:column;align-items:flex-start;gap:6px;margin-top:4px}
.ins-tbl td{vertical-align:middle}
#in-balk[hidden]{display:none}
/* Recepten en de tussenbak als tweeling (besluit Wessel 22-09 middag): symmetrisch, strakke samengestelde knoppen,
   vaste kolommen; 40 px hoog voor het touchpaneel */
.tw-keus{display:flex;margin:0 auto 14px;border:1px solid var(--c-line-2);border-radius:var(--r-md);overflow:hidden;width:max-content;max-width:100%;flex-wrap:wrap}
.tw-keus button{border:0;border-right:1px solid var(--c-line);background:var(--c-surface);height:44px;padding:0 16px;font-size:14px;font-weight:600;color:var(--ink-2);cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.tw-keus button:last-child{border-right:0}
.tw-keus button.aan{background:var(--acc-50);color:var(--acc)}
.tw-stipje{width:7px;height:7px;border-radius:50%;background:var(--warn);display:inline-block}
.tw-grid{display:grid;grid-template-columns:minmax(300px,380px) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:980px){.tw-grid{grid-template-columns:1fr}}
.tw-pan{padding:10px 8px;background:var(--c-sunken)}
.tw-svg{width:100%;height:auto;display:block}
.tw-lijst{padding:12px 16px}
.tw-rij{display:grid;grid-template-columns:30px minmax(0,1fr) 150px 120px;align-items:center;column-gap:10px;padding:8px 0;border-top:1px solid var(--c-line)}
.tw-rij.kop{grid-template-columns:minmax(0,1fr) auto;border-top:0;padding:4px 0 12px}
.tw-rij .nm{min-width:0;line-height:1.35;font-size:14px}
.tw-rij.w .nm{color:var(--ink-2)}
.tw-rij .sub{font-size:12px;color:var(--ink-3)}
.tw-nr{width:26px;height:26px;border-radius:50%;background:var(--c-sunken);border:1px solid var(--c-line);font-size:12px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;color:var(--ink-2)}
.tw-nr.w{background:transparent;border:0;color:var(--info)}
.tw-st{display:inline-flex;align-items:stretch;border:1px solid var(--c-line-2);border-radius:var(--r-md);overflow:hidden;height:40px;width:150px;background:var(--c-surface)}
.tw-st button{border:0;background:transparent;width:40px;font-size:20px;color:var(--ink-2);cursor:pointer;flex:none}
.tw-st button:hover{background:var(--c-sunken);color:var(--ink)}
.tw-st input{flex:1;min-width:0;border:0;border-left:1px solid var(--c-line);border-right:1px solid var(--c-line);text-align:center;font-family:var(--mono);font-size:14px;color:var(--ink);background:transparent;outline:none}
.tw-st input:focus{background:var(--acc-50)}
.tw-val{display:inline-flex;align-items:center;justify-content:center;width:150px;height:40px;border-radius:var(--r-md);background:var(--c-sunken);font-family:var(--mono);font-size:14px;color:var(--ink-2)}
.tw-tag{justify-self:end;font-size:12px;color:var(--ink-3)}
.tw-tag.afw{color:var(--warn);font-weight:600}
.tw-acts{justify-self:end;display:inline-flex;border:1px solid var(--c-line);border-radius:var(--r-md);overflow:hidden;height:40px}
.tw-acts button{border:0;background:transparent;width:38px;color:var(--ink-3);cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
.tw-acts button+button{border-left:1px solid var(--c-line)}
.tw-acts button:hover{background:var(--c-sunken);color:var(--ink)}
.tw-acts button.weg:hover{color:var(--alarm)}
.tw-sw{justify-self:end;display:inline-flex;border:1px solid var(--c-line-2);border-radius:var(--r-md);overflow:hidden;height:40px}
.tw-sw button{border:0;background:transparent;width:56px;font-size:13px;font-weight:600;color:var(--ink-3);cursor:pointer}
.tw-sw button+button{border-left:1px solid var(--c-line)}
.tw-sw button.aan{background:var(--acc-50);color:var(--acc)}
/* receptopbouw (22-09): een greep om te slepen, en de stoffen als knoppen om toe te voegen */
#rb-lijst{position:relative}
#rb-lijst .tw-rij{grid-template-columns:56px minmax(0,1fr) 150px 120px}
#rb-lijst .tw-rij.kop{grid-template-columns:minmax(0,1fr) auto}
#rb-lijst .tw-rij.w>.tw-nr{margin-left:16px}   /* het druppeltje recht onder de nummers van de stoffen */
.tw-greep{display:inline-flex;align-items:center;gap:2px;height:44px;padding:0 2px;margin-left:-4px;border:0;border-radius:var(--r-md);background:transparent;color:var(--ink-3);cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none}
.tw-greep:hover{background:var(--c-sunken);color:var(--ink)}
.tw-greep:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
.tw-rij.st.sleept{position:relative;z-index:5;background:var(--c-surface);border-radius:var(--r-md);box-shadow:0 12px 30px rgba(0,0,0,.2),0 0 0 1px var(--acc);cursor:grabbing}
.tw-rij.st.sleept .tw-greep{color:var(--acc);cursor:grabbing}
.tw-rij.st.sleept .tw-nr{background:var(--acc);border-color:var(--acc);color:#fff}
body.rb-sleept,body.rb-sleept *{cursor:grabbing!important;user-select:none;-webkit-user-select:none}
@keyframes twNet{from{background:var(--acc-50)}to{background:transparent}}
.tw-rij.net-erbij{animation:twNet 1.6s ease-out}
.tw-add-k{margin-top:14px;padding-top:12px;border-top:1px dashed var(--c-line-2)}
.tw-add-h{font-size:13px;font-weight:600;color:var(--ink-2);margin-bottom:10px}
.tw-add-h .sub{font-weight:400;margin-left:4px}
.tw-chips{display:flex;flex-wrap:wrap;gap:8px}
.tw-chip{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 14px 0 10px;border:1px solid var(--c-line-2);border-radius:999px;background:var(--c-surface);color:var(--ink);font-size:13.5px;font-weight:600;cursor:pointer}
.tw-chip svg{color:var(--acc)}
.tw-chip:hover{border-color:var(--acc);background:var(--acc-50)}
@media (prefers-reduced-motion:reduce){.tw-rij.net-erbij{animation:none}}
/* telefoon: naam en knop op de eerste regel, het getal eronder (anders past de rij niet op 390 px) */
@media (max-width:600px){
  #rb-lijst .tw-rij:not(.kop),#rc-lijst .tw-rij:not(.kop){grid-template-columns:48px minmax(0,1fr) auto;row-gap:8px}
  #rc-lijst .tw-rij:not(.kop){grid-template-columns:30px minmax(0,1fr) auto}
  #rb-lijst .tw-rij:not(.kop)>:nth-child(3),#rc-lijst .tw-rij:not(.kop)>:nth-child(3){grid-column:2/4;grid-row:2;justify-self:start}
  #rb-lijst .tw-rij:not(.kop)>:nth-child(4),#rc-lijst .tw-rij:not(.kop)>:nth-child(4){grid-column:3;grid-row:1}
}
.tw-leeg{font-size:13px;color:var(--ink-3);padding:12px 0;text-align:center}
.tw-msg{font-size:14px;padding:10px 14px;border-radius:var(--r-md);margin:14px 0 0;text-align:center}

.tw-grens{font-size:12px;color:var(--ink-3);margin-top:10px;text-align:center;line-height:1.5}
.tw-vink{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--ink-2)}

.tw-adv{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 16px;border-bottom:1px solid var(--c-line);background:var(--c-sunken);border-radius:var(--r-md) var(--r-md) 0 0}

.tw-pdf iframe{width:100%;height:100%;border:0}
#modal-scrim .modal:has(.tw-pdf){max-width:min(1100px,96vw);max-height:94vh}
/* het instellingenbestand laden: de delen en wat er gebeurde */
.bs-deel{display:flex;align-items:center;gap:8px;padding:9px 10px;border:1px solid var(--c-line);border-radius:var(--r-md);margin-top:8px;font-size:14px;cursor:pointer}
.bs-deel.uit{opacity:.6;cursor:default}
.bs-deel input{width:18px;height:18px}
.bs-log{max-height:260px;overflow:auto;border:1px solid var(--c-line);border-radius:var(--r-md);padding:8px 10px;font-size:13px}
.bs-log>div{display:flex;align-items:center;gap:6px;padding:3px 0}
.bs-log .ok{color:var(--ok)}.bs-log .fout{color:var(--alarm)}

/* ===== Overzicht: het installatieschema als hoofdbeeld (22-09, S19, besluit Wessel) =====
   Kleuren van de vloeistof: A en B zoals overal in het dashboard; water helderblauw; zuurbak amber; sporen
   blauwgroen; een mengsel naar meer bestemmingen grijs. */
:root{--sv-w:#2F8FD8;--sv-mix:#8A9690;
  --sv-a:var(--a);--sv-a-t:#8CC3D8;--sv-a-d:#2A6784;--sv-a-w1:#B7D8E5;--sv-a-w2:#DCEDF4;
  --sv-b:var(--b);--sv-b-t:#B5ACE6;--sv-b-d:#5A4FA3;--sv-b-w1:#CEC8F1;--sv-b-w2:#E6E2F8;
  --sv-z:#C07F22;--sv-z-t:#ECBD72;--sv-z-d:#B06D14;--sv-z-w1:#F3D6A5;--sv-z-w2:#F9E8CC;
  --sv-s:#2F8F86;--sv-s-t:#79CBC2;--sv-s-d:#237C73;--sv-s-w1:#ADE0DA;--sv-s-w2:#D3F0EC;
  --sv-pijp:#C3CBC6;--sv-pijp-k:#E3E8E5;--sv-glas:rgba(255,255,255,.55);--sv-pil:rgba(255,255,255,.92)}
:root[data-theme="dark"]{--sv-w:#4FA6EC;--sv-pijp:#46504B;--sv-pijp-k:#5A655F;--sv-glas:rgba(255,255,255,.14);--sv-pil:rgba(20,24,22,.85)}
.ov-strook{display:flex;align-items:center;gap:16px;margin-bottom:14px;padding:10px 16px;border-radius:var(--r-lg);border:1px solid var(--warn-line);background:var(--warn-bg);cursor:pointer}
.ov-strook.alarm{border-color:var(--alarm-line);background:var(--alarm-bg)}
.ov-strook.info{border-color:var(--info-line);background:var(--info-bg)}
.ov-strook[hidden]{display:none}
.ov-strook-lijst{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.ov-strook-rij{display:flex;align-items:center;gap:10px;font-size:14px;min-width:0}
.ov-strook-rij b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ov-strook-rij .tm{font-family:var(--mono);font-size:12px;color:var(--ink-3);white-space:nowrap}
.ov-strook-meer{display:inline-flex;align-items:center;gap:4px;font-size:13px;font-weight:600;color:var(--ink-2);white-space:nowrap}
.ov-schema{overflow:hidden}
.ov-kop{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:12px 22px;border-bottom:1px solid var(--c-line)}
.ov-modus{display:flex;align-items:center;gap:14px;min-width:0}
.ov-modus-ic{width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--c-sunken);color:var(--ink-2);flex:none}
.ov-modus-ic.run{background:var(--acc-50);color:var(--acc)}
.ov-modus-ic.alarm{background:var(--alarm-bg);color:var(--alarm)}
.ov-now{font-size:22px;font-weight:650;letter-spacing:-.01em;line-height:1.2}
.ov-sub{font-size:13.5px;color:var(--ink-2);margin-top:2px}
.ov-chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.ov-chip{display:inline-flex;align-items:center;gap:7px;height:32px;padding:0 12px;border-radius:var(--r-pill);border:1px solid var(--c-line);font-size:12.5px;color:var(--ink-2);background:var(--c-surface);white-space:nowrap}
.ov-chip b{font-weight:600;color:var(--ink)}
.ov-chip i{width:8px;height:8px;border-radius:50%;background:var(--ink-3);flex:none}
.ov-chip.ok i{background:var(--ok)} .ov-chip.run i{background:var(--acc)} .ov-chip.warn i{background:var(--warn)}
.ov-chip.alarm i{background:var(--alarm)} .ov-chip.onb i{background:none;border:1.5px dashed var(--ink-3)}
.ov-chip.alarm{border-color:var(--alarm-line);background:var(--alarm-bg)} .ov-chip.alarm b{color:var(--alarm)}
.ov-chip.warn{border-color:var(--warn-line)}
.ov-svg{padding:6px 10px 0}
.ov-svg svg.sv{display:block;width:100%;height:auto}
.ov-voet{display:flex;gap:18px;flex-wrap:wrap;align-items:center;padding:10px 22px 12px;border-top:1px solid var(--c-line);font-size:12px;color:var(--ink-2)}
.ov-voet i{display:inline-block;vertical-align:-1px;margin-right:6px}
.ov-voet-r{margin-left:auto;color:var(--ink-3)}
.lg-k{width:14px;height:10px;border-radius:3px;border:1.5px solid var(--c-line-2);background:var(--c-surface)} .lg-k.open{background:var(--ok);border-color:var(--ok)}
.lg-l{width:22px;height:6px;border-radius:3px}
.ov-klein{display:none}
@media (max-width:1100px){.ov-schema{display:none}.ov-klein{display:block}}
@media (max-width:600px){.ov-strook-rij .tm{display:none}.ov-strook{gap:10px;padding:10px 12px}.wb-grid{grid-template-columns:minmax(0,1fr)}}
.sv-nm{font-size:12px;font-weight:600;fill:var(--ink)}
.sv-sub{font-size:11px;fill:var(--ink-3)}
.sv-sub.vraagt{fill:var(--warn);font-weight:600}
.sv-tag{font-size:10.5px;fill:var(--ink-3);font-family:var(--mono)}
.sv-val{font-size:12px;fill:var(--ink);font-family:var(--mono)}
.sv-val.aan{fill:var(--ok)} .sv-val.cmd{fill:var(--warn)} .sv-val.alarm{fill:var(--alarm);font-weight:600}
.sv-zone{fill:var(--c-sunken);stroke:var(--c-line);stroke-width:1}
.sv-zone-t{font-size:11.5px;font-weight:600;fill:var(--ink-3);letter-spacing:.06em}
.sv-zone-f{letter-spacing:0;fill:var(--ink-2)}
/* de kop van een zone opent de fasen van die keten (22-09) */
.sv-fase{cursor:pointer} .sv-fase-vlak{fill:transparent} .sv-fase:hover .sv-fase-vlak{fill:var(--c-surface)}
.sv-kaart{fill:var(--c-surface);stroke:var(--c-line-2);stroke-width:1.2}
.sv-bron,.sv-klep,.sv-pomp,.sv-tank,.sv-fc,.sv-ls,.sv-roer{cursor:pointer}
.sv-pijp{fill:none;stroke:var(--sv-pijp);stroke-width:9;stroke-linecap:round;stroke-linejoin:round}
.sv-pijp-k{fill:none;stroke:var(--sv-pijp-k);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.sv-vloei{fill:none;stroke-width:7;stroke-linecap:round;stroke-linejoin:round}
.sv-glans{fill:none;stroke:rgba(255,255,255,.7);stroke-width:2.2;stroke-linecap:round;stroke-dasharray:2 16}
.sv-klep path{fill:var(--c-surface);stroke:var(--ink-3);stroke-width:1.5;stroke-linejoin:round}
.sv-klep.open path{fill:var(--ok);stroke:var(--ok)}
.sv-klep.onb path{stroke-dasharray:2 2;opacity:.55}
.sv-pomp .sv-hart{fill:var(--c-surface);stroke:var(--ink-3);stroke-width:1.8}
.sv-pomp .sv-blad{fill:var(--ink-3)}
.sv-pomp.aan .sv-hart{fill:var(--ok);stroke:var(--ok)} .sv-pomp.aan .sv-blad{fill:#fff}
.sv-pomp.cmd .sv-hart{stroke:var(--warn);stroke-dasharray:4 3}
.sv-pomp.flt .sv-hart{stroke:var(--alarm);stroke-width:2.6}
.sv-pomp.onb{opacity:.5}
.sv-tank-bg{fill:var(--c-surface)}
.sv-tank-rand{fill:none;stroke:var(--c-line-2);stroke-width:1.6}
.sv-glas{fill:var(--sv-glas)}
.sv-pil rect{fill:var(--sv-pil);stroke:var(--c-line);stroke-width:1}
.sv-pil text{font-size:11.5px;font-family:var(--mono);fill:var(--ink)}
.sv-pil text.sv-bad{fill:var(--alarm);font-weight:600;font-family:var(--font)}
.sv-grens{stroke:var(--warn);stroke-width:1.5;stroke-dasharray:4 3;opacity:.9}
.sv-ls circle{fill:var(--c-surface);stroke:var(--ink-3);stroke-width:1.4} .sv-ls.aan circle{fill:var(--ok);stroke:var(--ok)}
.sv-ls.onb circle{stroke-dasharray:2 2;opacity:.6}
.sv-motor{fill:var(--c-surface);stroke:var(--ink-3);stroke-width:1.4}
.sv-roer.aan .sv-motor{fill:var(--ok);stroke:var(--ok)}
.sv-motor-t{font-size:9.5px;font-weight:700;fill:var(--ink-3)} .sv-roer.aan .sv-motor-t{fill:#fff}
.sv-roer.onb{opacity:.5}
.sv-as{stroke:var(--ink-3);stroke-width:2} .sv-schoep{fill:var(--ink-2)}
.sv-jet-g{stroke:rgba(255,255,255,.75);stroke-width:1.6;stroke-dasharray:2 10;stroke-linecap:round}
.sv-bel{fill:rgba(255,255,255,.85)}
.sv-fc circle{fill:var(--c-surface);stroke:var(--ink-3);stroke-width:1.6} .sv-fc text{font-size:12px;font-weight:700;fill:var(--ink-2)}
.sv-terug{fill:var(--c-surface);stroke:var(--ink-3);stroke-width:1.5} .sv-terug-l{stroke:var(--ink-3);stroke-width:1.8}
.sv-bar{fill:var(--c-line)} .sv-bar-i{fill:var(--acc)}
.sv-gchip text{font-size:10.5px;font-weight:700}
.sv-gchip.a rect{fill:var(--a-bg)} .sv-gchip.a text{fill:var(--a)}
.sv-gchip.b rect{fill:var(--b-bg)} .sv-gchip.b text{fill:var(--b)}
.sv-gchip.ab rect{fill:var(--ab-bg)} .sv-gchip.ab text{fill:var(--ab)}
</style>
</head>

function pill(sev,label){
  const map={ok:['ok','check'],warn:['warn','warn'],alarm:['alarm','alarm'],info:['info','info'],idle:['idle','clock'],run:['run','play']};
  const [c,i]=map[sev]||map.idle;
  return `<span class="pill ${c}"><span class="ic">${ic(i,13,2.4)}</span>${label}</span>`;
}
let toastT;
function toast(msg,icon='check',kind=''){
  const t=$('#toast');if(!t)return;t.className='toast'+(kind?' '+kind:'');
  t.innerHTML='<span class="ic-wrap">'+ic(icon,18,2.2)+'</span><span>'+esc(msg)+'</span>';
  void t.offsetWidth;t.classList.add('show');
  clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),/ok/.test(kind)?3800:3000);
}
let modalBijSluiten=null;
function openModal(title,body,bijSluiten){$('#modal-title').innerHTML=title;$('#modal-body').innerHTML=body;$('#modal-scrim').classList.add('show');modalBijSluiten=bijSluiten||null;}
function closeModal(){$('#modal-scrim').classList.remove('show');const f=modalBijSluiten;modalBijSluiten=null;if(f)f();}
function timeAgo(ts){const s=Math.floor((Date.now()-ts)/1000);if(s<-60)return 'klok wijkt af';if(s<60)return Math.max(0,s)+' s geleden';const m=Math.floor(s/60);if(m<60)return m+' min geleden';const h=Math.floor(m/60);if(h<24)return h+' u geleden';return Math.floor(h/24)+' d geleden';}
/* Nederlandse tijd, los van de tijdzone van het apparaat: het paneel kan op UTC
   staan. EU-regel, zoals de ALIA-brug: zomertijd (UTC+2) van de laatste zondag
   van maart tot de laatste zondag van oktober, telkens om 01:00 UTC; daarbuiten
   wintertijd (UTC+1). nlDatum geeft een Date die je opmaakt met timeZone 'UTC'. */
function laatsteZondag(j,m){const d=new Date(Date.UTC(j,m+1,0,1));d.setUTCDate(d.getUTCDate()-d.getUTCDay());return d.getTime();}
function nlZomertijd(ts){ts=Number(ts);const j=new Date(ts).getUTCFullYear();return ts>=laatsteZondag(j,2)&&ts<laatsteZondag(j,9);}
function nlDatum(ts){ts=Number(ts);return new Date(ts+(nlZomertijd(ts)?2:1)*3600000);}
function clockStr(ts){return nlDatum(ts).toLocaleTimeString('nl-NL',{hour:'2-digit',minute:'2-digit',timeZone:'UTC'});}
function tijdStr(ts){return nlDatum(ts).toLocaleTimeString('nl-NL',{hour:'2-digit',minute:'2-digit',second:'2-digit',timeZone:'UTC'});}
function dateStr(ts){return nlDatum(ts).toLocaleDateString('nl-NL',{day:'numeric',month:'short',year:'numeric',timeZone:'UTC'});}
function ageStr(ms){if(!isFinite(ms))return 'onbekend';const s=Math.round(ms/1000);if(s<60)return s+' s';const m=Math.floor(s/60);return m+' m '+(s%60)+' s';}

const LOC=Object.fromEntries(MACHINE.locaties.map(l=>[l.ref,l]));
const COMP=Object.fromEntries(MACHINE.componenten.map(c=>[c.ref,c]));
const KANAAL=Object.fromEntries(MACHINE.kanalen.map(k=>[k.sleutel,k]));        // 'SE6-1-1'
const KANAAL_ADRES=Object.fromEntries(MACHINE.kanalen.map(k=>[k.adres,k]));    // 'SE6 1/DO1'
/* korte naam van een bak, zoals in de refs van de IO-mapping: LOC-A1 -> A1. De sporenbakken (SP1, SP2, ...)
   komen er hieronder bij, uit de IO-mapping (zie BRONNEN). */
const BAK_VAN_LOC={'LOC-TBA':'TBA','LOC-TBB':'TBB','LOC-ZB':'ZB',
  'LOC-A1':'A1','LOC-A2':'A2','LOC-A3':'A3','LOC-B1':'B1','LOC-B2':'B2','LOC-B3':'B3'};
function naamVan(ref){const c=COMP[ref];return c?(c.scherm||c.oms):ref;}
function tagVan(ref){const c=COMP[ref];return c&&c.tag?c.tag:ref;}
function locNaam(loc){const l=LOC[loc];return l?l.naam:loc;}
function kanalenVan(ref){const c=COMP[ref];return c?c.io.map(a=>KANAAL_ADRES[a]).filter(Boolean):[];}
function kanaalVan(ref,type){return kanalenVan(ref).find(k=>!type||k.type===type)||null;}
function compsOp(loc,soort){return MACHINE.componenten.filter(c=>c.loc===loc&&(!soort||c.soort===soort));}

    {kant:'B',tussenbak:'LOC-TBB',pomp:'VP03',mengklep:'KL32',werkbakken:[['LOC-B1','KL29'],['LOC-B2','KL30'],['LOC-B3','KL31']]}
  ],
  /* per pomp: bedrijfs-, storings- en (bij FCS 1) hoog-toerenmelding */
  pompMeldingen:{FCS1:{bedrijf:'BM-FCS1',storing:'SM-FCS1',hoog:'HM-FCS1'},VP02:{bedrijf:'BM-VP02',storing:'SM-VP02'},VP03:{bedrijf:'BM-VP03',storing:'SM-VP03'}}
};

/* ==================================================================
   BRONNEN - vaste plaatsnummers (besluit Wessel 22-09): water = bron 0,
   mestbak n = bron n (1..20), sporenbak s = bron 20+s (21..25). Een aantal
   wijzigen verbergt of toont alleen; er wordt nooit omgenummerd, zodat
   recepten en instellingen bij hun eigen bak blijven.
   Wat de machine HEEFT, komt uit de IO-mapping: mestbak n is de n-de
   locatie met groep 'Voorraadtank', sporenbak s de s-de met groep
   'Sporentank', in de volgorde van de IO-mapping (kolom Volgorde). Een
   nieuwe bak komt dus achteraan, anders schuiven de nummers.
   Wat er IN GEBRUIK is, hoe het heet en bij welke groep het hoort, komt
   uit de PLC: zie 'de configuratie van de machine' in B_bron.js.
   ================================================================== */
const MAX_MEST=20,MAX_SPOREN=5,SPOREN_START=20;
function locsVanGroep(g){return MACHINE.locaties.filter(l=>l.groep===g).sort((a,b)=>a.volgorde-b.volgorde);}
function klepVan(loc,begin){const c=MACHINE.componenten.find(x=>x.loc===loc&&x.soort==='Klep'&&String(x.oms||'').toLowerCase().startsWith(begin));return c?c.ref:null;}
const HW_MEST=locsVanGroep('Voorraadtank').slice(0,MAX_MEST).map((l,i)=>({nr:i+1,loc:l.ref,naamIo:l.naam,aanzuig:klepVan(l.ref,'aanzuig')}));
const HW_SPOREN=locsVanGroep('Sporentank').slice(0,MAX_SPOREN).map((l,i)=>({nr:SPOREN_START+i+1,s:i+1,bak:'SP'+(i+1),loc:l.ref,naamIo:l.naam,
  aanzuig:klepVan(l.ref,'aanzuig'),vul:klepVan(l.ref,'vul'),menger:(compsOp(l.ref,'Menger')[0]||{}).ref||null}));
HW_SPOREN.forEach(h=>{BAK_VAN_LOC[h.loc]=h.bak;});
function hwBron(nr){return nr>SPOREN_START?(HW_SPOREN[nr-SPOREN_START-1]||null):(HW_MEST[nr-1]||null);}
function isSporen(nr){return nr>SPOREN_START;}
/* op het scherm: mestbak 5 = '5', sporenbak 2 = 'S2' */
function bronLabel(nr){return isSporen(nr)?('S'+(nr-SPOREN_START)):String(nr);}
/* groepen (besluit 22-09): een stof mag alleen in een bak van zijn eigen groep, of hij is A+B.
   Niet ingesteld = nergens heen. Tussenbak en werkbakken van kant A zijn A, van kant B zijn B. */
const GROEPEN={A:{naam:'A',uitleg:'alleen naar kant A'},B:{naam:'B',uitleg:'alleen naar kant B'},AB:{naam:'A+B',uitleg:'naar beide kanten'}};
function groepPast(stof,bak){return !!(GROEPEN[stof]&&GROEPEN[bak])&&(stof==='AB'||stof===bak);}
function groepChip(g){return GROEPEN[g]?`<span class="gchip g${g.toLowerCase()}" title="${esc(GROEPEN[g].uitleg)}">${GROEPEN[g].naam}</span>`:`<span class="gchip g0" title="groep niet ingesteld">?</span>`;}

function pidControle(){
  const mis=[];
  const ref=r=>{if(!COMP[r])mis.push('component '+r);};
  const loc=l=>{if(!LOC[l])mis.push('locatie '+l);};
  loc(PID.water[0]);ref(PID.water[1]);
  PID.bestemmingen.forEach(([l,k])=>{loc(l);ref(k);});
  [PID.vulpomp,PID.flowmeter,PID.luchtdruk,PID.algemeen].forEach(ref);
  PID.kanten.forEach(k=>{loc(k.tussenbak);ref(k.pomp);ref(k.mengklep);k.werkbakken.forEach(([l,kl])=>{loc(l);ref(kl);});});
  HW_MEST.forEach(h=>{if(!h.aanzuig)mis.push('aanzuigklep bij '+h.loc);});
  HW_SPOREN.forEach(h=>{if(!h.aanzuig)mis.push('aanzuigklep bij '+h.loc);if(!h.vul)mis.push('vulklep bij '+h.loc);if(!h.menger)mis.push('menger bij '+h.loc);});
  if(!HW_MEST.length)mis.push('locaties met groep Voorraadtank');
  Object.values(PID.pompMeldingen).forEach(o=>Object.values(o).forEach(ref));
  return mis;
}
/* de niveausensor (LT-...) en niveauschakelaars (LS-..., LSH-..., LSL-...) van een locatie */
function niveauSensor(loc){return compsOp(loc,'Niveausensor')[0]||null;}
function niveauSchakelaars(loc){return compsOp(loc,'Niveauschakelaar');}
