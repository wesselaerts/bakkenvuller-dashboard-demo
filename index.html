/* in de deelversie (nabootsing in de browser, 25-09) levert BV_DEEL het blad als blob-adres: een kader kan geen
   onderschepte fetch gebruiken */
function advBekijk(id,naam){const url=(window.BV_DEEL&&BV_DEEL.adviesUrl)?BV_DEEL.adviesUrl(id):basisUrl()+'/advies/'+encodeURIComponent(id);
  openModal(`${ic('doc',18,2)} ${esc(naam)}`,`<div class="tw-pdf"><iframe src="${esc(url)}" title="${esc(naam)}"></iframe></div>
    <div style="display:flex;gap:8px;margin-top:10px;align-items:center"><a class="btn sm" href="${esc(url)}" target="_blank" rel="noopener">${ic('eye',14,2)} In een nieuw tabblad</a><span class="muted-2" style="font-size:12px">Toont de browser van het paneel geen pdf, open hem dan in een nieuw tabblad.</span></div>`);}
function advKoppel(bak){const inp=document.createElement('input');inp.type='file';inp.accept='application/pdf,.pdf';
  inp.onchange=async()=>{const f=inp.files&&inp.files[0];if(!f)return;const max=(advLijst&&advLijst.maxBestand)||8*1048576;
    if(f.size>max){toast('Groter dan '+Math.round(max/1048576)+' MB: kies een kleiner bestand','warn');return;}
    const buf=await f.arrayBuffer();const kop=new Uint8Array(buf.slice(0,5));if(String.fromCharCode.apply(null,kop)!=='%PDF-'){toast('Dit is geen pdf','warn');return;}
    toast('Versturen naar de machine…','clock');
    try{const r=await fetch(basisUrl()+'/advies/'+encodeURIComponent(bak),{method:'POST',headers:{'Content-Type':'application/pdf','X-Bakkenvuller':'1','X-Bestandsnaam':encodeURIComponent(f.name)},body:buf});
      let j=null;try{j=await r.json();}catch(e){}
      if(r.status===401&&j&&j.nodig){vraagInlog(j.nodig);return;}
      if(!r.ok||!j||!j.ok){toast((j&&j.fout)||('Niet opgeslagen (HTTP '+r.status+')'),'warn');return;}
      await advLaad(true);advOveral();toast('Adviesblad gekoppeld aan '+bak+'; het vorige blijft bij "Eerdere"','check');}
    catch(e){toast('De brug is niet bereikbaar','warn');}};
  inp.click();}

function bestandKaart(){const el=$('#bs-kaart');if(!el)return;
  el.innerHTML=`<div class="card-h"><h3>Instellingenbestand</h3><span class="sub">alles wat de service instelt, als één bestand op je eigen pc · laden toont eerst wat er verandert</span></div>

   <span class="muted-2" style="font-size:12.5px">Configuratie, instellingen, receptopbouw en de liters van de teler. De kalibratie gaat mee als naslag, maar wordt nooit geladen: die hoort bij de sensoren van déze machine.</span></div>`;}
function bsVerzamel(){const s=actueel();if(!s)return null;const c=cfg();
  const rb={};WERKBAKKEN.forEach(w=>{const p=rbVan(w.bak);if(p)rb[w.bak]={stappen:p.stappen,water:p.water,standaard:Object.fromEntries(p.stappen.map(n=>[String(n),rbStd(p,n)]))};});
  const conf=c?Object.fromEntries(Object.entries(c).filter(([k])=>!['versie','geldig','resultaat','leiding'].includes(k))):null;
  return {soort:'bakkenvuller-instellingen',versie:1,gemaakt:new Date().toISOString(),machine:MACHINE.opdrachtgever||'',bron:wieBron(),
    configuratie:conf,instellingen:s.instellingen||{},receptopbouw:rb,recepten:s.recepten||{},kalibratieNaslag:s.kalibratie||null};}
function bsOpslaan(){if(!magNiveau('service')){vraagInlog('service',bsOpslaan);return;}const d=bsVerzamel();if(!d){toast('Geen actuele gegevens van de PLC','warn');return;}
  const t=new Date();const p=n=>String(n).padStart(2,'0');const naam=`bakkenvuller-instellingen-${t.getFullYear()}${p(t.getMonth()+1)}${p(t.getDate())}-${p(t.getHours())}${p(t.getMinutes())}.json`;
  const blob=new Blob([JSON.stringify(d,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=naam;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1000);toast('Opgeslagen als '+naam,'download');}
function bsLaad(){if(!magNiveau('service')){vraagInlog('service',bsLaad);return;}const inp=document.createElement('input');inp.type='file';inp.accept='application/json,.json';
  inp.onchange=async()=>{const f=inp.files&&inp.files[0];if(!f)return;let d=null;try{d=JSON.parse(await f.text());}catch(e){}
    if(!d||d.soort!=='bakkenvuller-instellingen'){toast('Dit is geen instellingenbestand van de Bakkenvuller','warn');return;}bsVoorbeeld(d,f.name);};inp.click();}
/* wat er verandert, per deel */
function bsVerschillen(d){const s=actueel();const uit={configuratie:[],instellingen:[],receptopbouw:[],recepten:[]};if(!s)return uit;
  const c=cfg();if(d.configuratie){const conf=c?Object.fromEntries(Object.entries(c).filter(([k])=>!['versie','geldig','resultaat','leiding'].includes(k))):{};
    Object.keys(Object.assign({},conf,d.configuratie)).forEach(k=>{if(JSON.stringify(conf[k])!==JSON.stringify(d.configuratie[k]))uit.configuratie.push(k);});}
  const ins=s.instellingen||{};Object.entries(d.instellingen||{}).forEach(([naam,w])=>{const p=parInfo(naam);if(!p||p.wie==='automatisch'||p.alleenLezen)return;
    const vergelijk=(idx,nieuw)=>{const oud=instelling(naam,idx);const nv=norm(nieuw);if(nv&&(!oud||String(oud.v)!==String(nv.v)))uit.instellingen.push({naam:naam,index:idx,waarde:nv.v,oud:oud?oud.v:null});};
    if(Array.isArray(w))w.forEach((x,i)=>vergelijk(i+1,x));else if(w&&typeof w==='object'&&!('v' in w))Object.entries(w).forEach(([i,x])=>vergelijk(i,x));else vergelijk(null,w);});
  Object.entries(d.receptopbouw||{}).forEach(([bak,r])=>{const p=rbVan(bak);const nu=p?{stappen:p.stappen,water:p.water,standaard:Object.fromEntries(p.stappen.map(n=>[String(n),rbStd(p,n)]))}:null;
    if(JSON.stringify(nu)!==JSON.stringify(r))uit.receptopbouw.push(bak);});
  Object.entries(d.recepten||{}).forEach(([bak,lijst])=>{if(!Array.isArray(lijst))return;const waarden={};const p=WERKBAKKEN.some(w=>w.bak===bak)?rbVan(bak):null;
    lijst.forEach((x,i)=>{if(p&&!p.stappen.includes(i+1))return;const nv=norm(x);const oud=recept(bak,i+1);const ov=oud?Number(oud.v):0;const v=nv?Number(nv.v):0;
      if(isFinite(v)&&Math.abs(v-ov)>1e-9)waarden[String(i+1)]=v;});if(Object.keys(waarden).length)uit.recepten.push({bak:bak,waarden:waarden});});
  return uit;}
function bsVoorbeeld(d,naam){const v=bsVerschillen(d);const conf=magNiveau('configuratie');
  const deel=(k,titel,n,uitleg,mag)=>`<label class="bs-deel${n&&mag?'':' uit'}"><input type="checkbox" data-bsdeel="${k}" ${n&&mag?'checked':'disabled'}> <b>${esc(titel)}</b> <span class="muted-2">${n?n+' verschil'+(n>1?'len':''):'gelijk aan de PLC'}${uitleg?' · '+esc(uitleg):''}</span></label>`;
  openModal(`${ic('upload',18,2)} Instellingen laden`,`<p class="muted" style="font-size:14px">Uit <b>${esc(naam)}</b>, gemaakt ${esc(d.gemaakt?new Date(d.gemaakt).toLocaleString('nl-NL'):STREEP)}${d.bron?' ('+esc(d.bron)+')':''}. Kies wat je wilt overnemen; elk deel gaat met de gewone opdrachten en toetsen naar de PLC.</p>
    ${deel('configuratie','Configuratie',v.configuratie.length,conf?v.configuratie.join(', '):'alleen met Configuratie',conf)}
    ${deel('instellingen','Instellingen',v.instellingen.length,'',true)}
    ${deel('receptopbouw','Receptopbouw',v.receptopbouw.length,v.receptopbouw.join(', '),true)}
    ${deel('recepten','Liters van de teler',v.recepten.length,v.recepten.map(x=>x.bak).join(', '),true)}
    <label class="bs-deel uit"><input type="checkbox" disabled> <b>Kalibratie</b> <span class="muted-2">wordt nooit geladen: die hoort bij de sensoren van deze machine</span></label>
    <div style="display:flex;gap:8px;margin-top:14px"><button class="btn primary" id="bs-ok">${ic('check',16,2.2)} Overnemen</button><button class="btn" id="bs-x">Annuleren</button></div><div id="bs-st" style="margin-top:12px"></div>`);
  $('#bs-x').onclick=closeModal;$('#bs-ok').onclick=()=>bsOvernemen(d,v);}
/* in deze volgorde: configuratie, instellingen, receptopbouw, recepten. Een geweigerde configuratie stopt de rest. */
async function bsOvernemen(d,v){const kies=k=>{const x=document.querySelector('[data-bsdeel="'+k+'"]');return !!(x&&x.checked&&!x.disabled);};const st=$('#bs-st');const regels=[];
  const toon=()=>{st.innerHTML=`<div class="bs-log">${regels.map(r=>`<div class="${r.ok?'ok':'fout'}">${ic(r.ok?'check':'warn',14,2)} ${esc(r.tekst)}</div>`).join('')}</div>`;};
  /* 501 (brug 0.4): de brug schrijft nog niets naar de PLC. Eén regel en stoppen, niet elke instelling apart laten weigeren. */
  const stop501=r=>{if(r.status!==501)return false;
    regels.push({ok:false,tekst:regels.some(x=>x.ok)?'Gestopt: de brug kan de rest nog niet naar de PLC schrijven. Wat hierboven een vinkje heeft, gaf de brug wel door.':nietNaarPlc('de instellingen uit dit bestand')});toon();return true;};
  $('#bs-ok').disabled=true;
  if(kies('configuratie')){const c=cfg();const x=Object.assign({},d.configuratie,{basisVersie:c&&c.versie!=null?Number(c.versie):null});
    const r=await opdracht('configuratie',x);if(stop501(r))return;regels.push({ok:r.ok,tekst:'Configuratie: '+(r.ok?'overgenomen':r.fout)});toon();if(!r.ok)return;await haalBron();}
  if(kies('instellingen'))for(const i of v.instellingen){const r=await opdracht('instelling',{naam:i.naam,index:i.index,waarde:Number(i.waarde)});if(stop501(r))return;regels.push({ok:r.ok,tekst:i.naam+(i.index?' ['+i.index+']':'')+' = '+i.waarde+(r.ok?'':': '+r.fout)});toon();}
  if(kies('receptopbouw')){await haalBron();for(const bak of v.receptopbouw){const p=rbVan(bak);const r0=d.receptopbouw[bak];
    const r=await opdracht('receptopbouw',{basisVersie:p?p.versie:null,bak:bak,stappen:r0.stappen,water:r0.water,standaard:r0.standaard,ookTeler:false});if(stop501(r))return;
    regels.push({ok:r.ok,tekst:'Receptopbouw '+bak+': '+(r.ok?'overgenomen':r.fout)});toon();}}
  if(kies('recepten')){await haalBron();for(const x of bsVerschillen(d).recepten){const r=await opdracht('recept',{bak:x.bak,waarden:x.waarden});if(stop501(r))return;regels.push({ok:r.ok,tekst:'Liters '+x.bak+': '+(r.ok?'overgenomen':r.fout)});toon();}}
  await haalBron();regels.push({ok:true,tekst:'Klaar. Wat hierboven met een vinkje staat, gaf de brug door; op de schermen zie je wat de PLC nu heeft.'});toon();}

/* één luisteraar voor de knoppen van dit deel, op elk scherm (geen stapeling bij het wisselen van scherm) */
document.addEventListener('click',e=>{const t=e.target;
  const tg=t.closest('[data-tg]');if(tg){toegangWijzig(tg.dataset.tg);return;}
  const ad=t.closest('[data-adv]');if(ad){const w=ad.dataset.adv;if(w==='inlog')vraagInlog('bediening',advVernieuw);else if(w==='kijk')advBekijk(ad.dataset.id,ad.dataset.naam);else if(w==='koppel'){if(!magNiveau('bediening')){vraagInlog('bediening',advVernieuw);return;}advKoppel(ad.dataset.bak);}else if(w==='weg')advWeg(ad.dataset.id,ad.dataset.naam);return;}
  const bs=t.closest('[data-bs]');if(bs){if(bs.dataset.bs==='op')bsOpslaan();else bsLaad();return;}});
document.addEventListener('change',e=>{const s=e.target.closest('[data-adv-eerder]');if(!s||!s.value)return;const o=s.options[s.selectedIndex];advBekijk(s.value,o.textContent);s.value='';});

/* na elke ronde met de brug: bovenbalk, banner, bel, en het open scherm bijwerken */
let vorigeNavBadge='',vorigeSessieSleutel='';
function naElkeRonde(){
  tekenVerbinding();tekenBanner();tekenBel();
  const sk=inlogBekend()?String(sessieNiveau()):'-';if(sk!==vorigeSessieSleutel){vorigeSessieSleutel=sk;tekenNiveaus();}
  sessieBijwerken();
  const nb=navBadge()+'|'+heeftOnderhoud();if(nb!==vorigeNavBadge){vorigeNavBadge=nb;tekenNav();}
  const s=SCHERMEN[ui.scherm];
  /* invoervelden die de gebruiker aan het invullen is, niet overschrijven */
  const act=document.activeElement;const typt=act&&(act.tagName==='INPUT'||act.tagName==='TEXTAREA'||act.tagName==='SELECT')&&$('#main').contains(act);
  /* is de configuratie in de PLC veranderd (aantallen, namen, groepen), dan tekent het open scherm
     opnieuw, zodat alles meespringt (besluit 22-09). Het configuratiescherm houdt het concept van de
     monteur vast en meldt zelf dat de PLC intussen een nieuwe versie heeft. */
  if(cfgSleutel()!==getekendCfg&&!typt&&ui.scherm!=='configuratie'){render();if(fpRef)verversComponent();return;}
  if(s&&s.ververs&&!typt)s.ververs();

function pollLus(){
  (function lus(){const volgende=()=>setTimeout(lus,POLL_MS);
    if(document.hidden){volgende();return;}
    Promise.resolve(haalBron()).then(volgende,volgende);})();
}
/* een getalveld: invoer met een cijfertoetsenbord, geen wachtwoord of pincode */
function getalVeld(t){return !!t&&t.tagName==='INPUT'&&t.type!=='password'&&/^(decimal|numeric)$/.test(t.getAttribute('inputmode')||'');}
function koppel(){
  $('#roles').addEventListener('click',e=>{const b=e.target.closest('[data-role]');if(!b)return;
    if(b.dataset.role==='uit'){uitloggen();return;}
    if(inlogBekend()&&NIVEAU_RANG[b.dataset.role]>sessieRang()){vraagInlog(b.dataset.role);return;}
    ui.niveau=b.dataset.role;bewaarUi();tekenNiveaus();tekenNav();render();
    toast('Niveau: '+NIVEAUS.find(n=>n[0]===ui.niveau)[1],ui.niveau==='bediening'?'user':'wrench');});
  $('#rail').addEventListener('click',e=>{const b=e.target.closest('.nav-item');if(b)ga(b.dataset.screen);});
  $('#burger').onclick=()=>{if(window.matchMedia&&window.matchMedia('(max-width:720px)').matches){document.body.classList.toggle('nav-open');return;}
    ui.railIn=!ui.railIn;document.body.classList.toggle('rail-collapsed',ui.railIn);bewaarUi();};
  $('#scrim').onclick=()=>document.body.classList.remove('nav-open');
  $('#bell').onclick=()=>ga('meldingen');
  const hb=$('#tb-hand');if(hb)hb.onclick=()=>{if(magScherm('hand'))ga('hand');};
  $('#theme-toggle').onclick=()=>{ui.themaGekozen=true;zetThema(ui.thema==='dark'?'light':'dark');bewaarUi();render();};
  $('#modal-x').onclick=closeModal;
  $('#modal-scrim').onclick=e=>{if(e.target.id==='modal-scrim')closeModal();};
  document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeModal();document.body.classList.remove('nav-open');}});
  /* 22-09 (Wessel): in elk getalveld direct typen. Een tik selecteert de hele waarde, het eerste cijfer vervangt hem.
     De muisklik die de focus gaf, zou de selectie weer opheffen: die ene klik doet daarom niets. */
  let selNaFocus=null;
  document.addEventListener('focusin',e=>{const t=e.target;if(!getalVeld(t))return;try{t.select();}catch(_){}selNaFocus=t;});
  document.addEventListener('mouseup',e=>{if(selNaFocus&&e.target===selNaFocus)e.preventDefault();selNaFocus=null;},true);
  document.addEventListener('visibilitychange',()=>{if(!document.hidden){tekenKlok();haalBron();}});
  window.addEventListener('hashchange',()=>{if(schermUitAdres()){document.body.classList.remove('nav-open');tekenNiveaus();tekenNav();render();}else zetAdres();});
}
function init(){
  laadUi();
  schermUitAdres();
  if(!ui.themaGekozen)ui.thema=(window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light';
  zetThema(ui.thema);
  document.body.classList.toggle('rail-collapsed',ui.railIn);
  const bs=$('#brand-sub');if(bs)bs.textContent=MACHINE.opdrachtgever||'';
  tekenNiveaus();tekenNav();koppel();render();tekenKlok();tekenVerbinding();tekenBanner();tekenBel();
  const fout=pidControle();if(fout.length)console.warn('P&ID en IO-mapping passen niet:',fout);
  const boot=$('#boot');
  if(boot){setTimeout(()=>{const bs=$('#bstat');if(bs)bs.innerHTML='<span>Verbinden met de brug…</span>';},300);
    setTimeout(()=>boot.classList.add('hide'),900);setTimeout(()=>{if(boot.parentNode)boot.parentNode.removeChild(boot);},1500);}
  setInterval(tekenKlok,1000);
  setInterval(()=>{tekenVerbinding();tekenBanner();},1000);   // 'verouderd' moet ook zonder nieuwe ronde verschijnen
  setInterval(nachtelijkVerversen,60000);
  pollLus();
}
/* Een paneel dat maanden aan staat (25-09, voor twintig jaar): één keer per dag, tussen 03:00 en 05:00 Nederlandse
   tijd, de pagina vers laden, zodat een browser die langzaam geheugen opbouwt weer schoon begint. Alleen als niemand
   iets doet: geen venster open, geen veld met focus, geen onverstuurd concept. Scherm en niveau blijven bewaard (ui). */
function rustig(){const act=document.activeElement;const typt=!!act&&(act.tagName==='INPUT'||act.tagName==='TEXTAREA');
  const venster=!!$('#modal-scrim')&&$('#modal-scrim').classList.contains('show');
  const concept=Object.keys(insCon).length>0||Object.keys(rdCon).length>0||Object.values(rbCon).some(c=>c&&c.bewerkt)
    ||Object.values(rcCon).some(c=>c&&c.bewerkt)||!!(cf&&cf.bewerkt)||!!rbSleep;
  return !typt&&!venster&&!concept;}
function nachtelijkVerversen(){const uur=nlDatum(Date.now()).getUTCHours();let laatst=0;try{laatst=Number(localStorage.getItem('bv-vers')||0);}catch(_){}
  if(uur>=3&&uur<5&&Date.now()-laatst>20*3600000&&rustig()){try{localStorage.setItem('bv-vers',String(Date.now()));}catch(_){}location.reload();}}
document.addEventListener('DOMContentLoaded',init);
</script>
