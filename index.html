/* ==================================================================
   BRON - de enige bron van data: de brug.
   ------------------------------------------------------------------
   GET  /snapshot           momentopname (zie de afspraak in de kennisbank)
   GET  /events             meldingen
   POST /ack                een melding bevestigen          {id}
   POST /command/<naam>     een opdracht                    {...}
   Een momentopname telt alleen als hij vers is, en dat is twee dingen:
   de brug antwoordde onlangs (STALE_MS), én zijn laatste lezing van de PLC
   is jong (bridge.statusAgeSec, hoogstens PLC_STALE_S). Anders toont elk
   scherm een streepje in plaats van een waarde. De klok van de PLC doet
   daarbij niet mee: die kan verlopen (bij ALIA 13 s).
   ================================================================== */
const POLL_MS=2000;     // elke 2 s, zoals de oude HMI
const STALE_MS=6500;    // ~3 x POLL_MS + marge: één trage ronde is nog niet 'verouderd'
const PLC_STALE_S=4;    // een PLC-lezing ouder dan 4 s is niet actueel (zoals ALIA)
const bron={url:'',status:'start',lastOk:null,lastErr:null,snap:null,events:[],evOk:null,inflight:false,skewMs:0,ack:{}};

function basisUrl(){return String(bron.url||'').replace(/\/+$/,'');}
async function haalBron(){
  if(bron.inflight)return;
  bron.inflight=true;
  const ctl=('AbortController' in window)?new AbortController():null;
  const to=ctl?setTimeout(()=>ctl.abort(),3000):null;   // een hangend verzoek mag de feed niet stil bevriezen
  try{
    /* ?io=1: iemand kijkt naar de klemmen; de brug leest de kanalen dan even vaker (zoals ALIA) */
    const io=(ui.scherm==='besturing'||ui.scherm==='io'||ui.scherm==='kalibratie')?'?io=1':'';
    const r=await fetch(basisUrl()+'/snapshot'+io,{cache:'no-store',signal:ctl?ctl.signal:undefined});
    if(!r.ok)throw new Error('HTTP '+r.status+' op /snapshot');
    const j=await r.json();
    if(!j||typeof j!=='object'||Array.isArray(j))throw new Error('geen geldige momentopname');
    bron.snap=j;bron.lastOk=Date.now();bron.status='verbonden';bron.lastErr=null;
    const ts=j.ts?Date.parse(j.ts):NaN;bron.skewMs=isFinite(ts)?(Date.now()-ts):0;
    try{
      const ev=await fetch(basisUrl()+'/events',{cache:'no-store',signal:ctl?ctl.signal:undefined});
      if(ev.ok){const a=await ev.json();bron.events=Array.isArray(a)?a.slice(0,500):[];bron.evOk=true;}else bron.evOk=false;
    }catch(e){bron.evOk=false;}
  }catch(e){
    bron.status='fout';
    bron.lastErr=(e&&e.name==='AbortError')?'geen antwoord binnen 3 s':((e&&e.message)||'verbinding mislukt');
  }finally{
    if(to)clearTimeout(to);
    bron.inflight=false;
    naElkeRonde();
  }
}
/* het blok 'bridge' uit de laatste momentopname: wie de brug is en hoe het met de PLC gaat */
function brugBlok(){const s=bron.snap;return s&&s.bridge&&typeof s.bridge==='object'?s.bridge:null;}
/* vers = de brug antwoordde binnen STALE_MS én zijn PLC-lezing is niet ouder dan PLC_STALE_S */
function vers(){
  const age=bron.lastOk?Date.now()-bron.lastOk:Infinity;const b=brugBlok();
  const pa=b&&b.statusAgeSec!==null&&b.statusAgeSec!==undefined&&b.statusAgeSec!==''?Number(b.statusAgeSec):NaN;
  const brugOk=age<=STALE_MS,plcVers=isFinite(pa)&&pa<=PLC_STALE_S;
  return {ok:brugOk&&plcVers,ageMs:age,brugOk,plcAgeS:isFinite(pa)?pa:null};
}
function actueel(){return vers().ok?bron.snap:null;}
/* de brug meldt zelf of hij met de echte PLC praat (bridge.bron = 'plc') of een nabootsing is */
function bronSoort(){const b=brugBlok();if(!bron.snap)return null;if(!b||!b.bron)return 'onbekend';return b.bron==='plc'?'plc':'nabootsing';}
/* in teksten: wie antwoordt er echt? */
function wieBron(){const s=bronSoort();return s==='plc'?'de PLC':s==='nabootsing'?'de nabootsing':'de brug';}
function plcVerbonden(){const b=brugBlok();return b&&typeof b.plcOk==='boolean'?b.plcOk:null;}
function plcDraait(){const b=brugBlok();return b&&typeof b.plcDraait==='boolean'?b.plcDraait:null;}

/* Een waarde uit de momentopname is {v, u, q} of een kale waarde.
   Terug: {v,u,q} of null. q = 'good' | 'uncertain' | 'bad'. */
function norm(x){
  if(x===undefined||x===null)return null;
  if(typeof x==='object'&&!Array.isArray(x)){
    if(!('v' in x)||x.v===null||x.v===undefined)return null;
    return {v:x.v,u:typeof x.u==='string'?x.u:'',q:(x.q==='bad'||x.q==='uncertain')?x.q:'good'};
  }
  if(typeof x==='number'||typeof x==='boolean'||typeof x==='string')return {v:x,u:'',q:'good'};
  return null;
}
/* ---- de bus: wat de controller meldt, naast de IO-mapping ----------
   De brug leest de modules en elk kanaal bij de controller zelf
   (modules[], met kanalen_live). De IO-mapping zegt wat er hoort te zitten.
   Volgorde op de bus: SE6 slot 1-6, daarna SE4 slot 1-4 (IO-mapping,
   tabblad PLC opbouw: de SE4 hangt naast de SE6 aan dezelfde bus). Dat is
   een aanname tot de controller het bevestigt; een verschuiving is dan
   meteen te zien als "andere module". */
let _rek=null,_rekSnap;
function busModules(){const s=actueel();return s&&Array.isArray(s.modules)?s.modules:null;}
function rek(){
  const s=actueel();if(_rek&&s===_rekSnap)return _rek;_rekSnap=s;
  const gev=busModules();
  const opPlek=n=>gev?(gev.find(g=>g&&Number(g.slot)===n)||null):null;
  const plekken=MACHINE.modules.map((m,i)=>{const n=i+1;const g=opPlek(n);
    const stand=!gev?'geen-meting':!g?'ontbreekt':g.onbekend?'onbekend':String(g.artikel)===String(m.art)?'ok':'anders';
    return {plek:n,verwacht:m,gevonden:g,stand};});
  const extra=gev?gev.filter(g=>g&&!(Number(g.slot)>=1&&Number(g.slot)<=MACHINE.modules.length)):[];
  _rek={plekken,extra,gemeten:!!gev};return _rek;
}
function rekPlek(bp,slot){return rek().plekken.find(p=>p.verwacht.bp===bp&&p.verwacht.slot===slot)||null;}
/* de regel van één kanaal zoals de brug hem meldt; zoekt op kanaalnummer */
function kanaalRij(p,ch){return p&&p.gevonden&&Array.isArray(p.gevonden.kanalen_live)?p.gevonden.kanalen_live.find(x=>Number(x.ch)===Number(ch))||null:null;}
/* ruwe stand van een klem, per sleutel uit de IO-lijst ('SE6-1-1'). Alleen als
   op die plek de module zit die de IO-mapping verwacht: een kanaal van een
   andere module is niet dit kanaal. Analoog = de ruwe waarde van de module. */
function kanaal(sleutel){
  const k=KANAAL[sleutel];if(!k)return null;
  const p=rekPlek(k.bp,k.slot);if(!p||p.stand!=='ok')return null;
  const r=kanaalRij(p,k.ch);if(!r||r.waarde===null||r.waarde===undefined)return null;
  const dig=k.type==='DI'||k.type==='DO';
  return {v:dig?(r.waarde===true||r.waarde===1):r.waarde,u:'',q:'good',ruw:!dig};
}
/* Een analoge waarde zoals de module hem meldt. Twee codes staan in de
   handleiding van de module: 0x8002 = open klem (onder 3,6 mA), 0x8001 =
   boven het meetbereik. Verder het RUWE getal: de omrekening naar mA is niet
   nagemeten, en een getal dat er precies uitziet maar op een aanname rust is
   erger dan een ruw getal dat klopt (zoals ALIA). */
function analoogCode(v){if(typeof v!=='number'||!isFinite(v))return null;const w=v&0xFFFF;return w===0x8002?'8002':w===0x8001?'8001':null;}
function analoogTekst(v){
  if(v===null||v===undefined||typeof v!=='number'||!isFinite(v))return STREEP;
  const c=analoogCode(v);if(c==='8002')return '‹ 3,6 mA';if(c==='8001')return '› 21 mA';
  const w=v&0xFFFF;if(w>=0x8000&&w<=0x8010)return '0x'+w.toString(16).toUpperCase();
  return String(v);
}
function analoogTitel(v){const c=analoogCode(v);return c==='8002'?'open klem of onderbroken lus: er komt geen 4 mA binnen':c==='8001'?'boven het meetbereik (meer dan 21 mA)':(typeof v==='number'?('ruwe waarde '+v+' van de module'):'geen meting');}
/* waarde zoals de PLC hem uitlegt, per ref uit de IO-mapping ('LT-A1', 'PS01', ...) */
function waarde(ref){const s=actueel();return (s&&s.waarden&&typeof s.waarden==='object')?norm(s.waarden[ref]):null;}
/* de toestand van de machine: modus, fout, doseerkring, ... */
function stand(){const s=actueel();return (s&&s.machine&&typeof s.machine==='object')?s.machine:null;}
/* een instelling uit de PLC; index = meststofnummer (1..N) of bak ('A1', 'SP1') */
function instelling(naam,index){
  const s=actueel();const b=s&&s.instellingen;if(!b||typeof b!=='object'||!(naam in b))return null;
  let x=b[naam];
  if(index!==undefined&&index!==null&&index!==''){
    if(Array.isArray(x))x=x[Number(index)-1];
    else if(x&&typeof x==='object'&&!('v' in x))x=x[index];
    else return null;
  }
  return norm(x);
}
function configuratie(){const s=actueel();return (s&&s.configuratie&&typeof s.configuratie==='object')?s.configuratie:null;}

/* ---- de configuratie van de machine, zoals de PLC hem meldt -------
   EEN plek voor de hele HMI (Wessel, 22-09: "dat alles van 1 databron
   komt"): welke bronnen in gebruik zijn, hoe ze heten, bij welke groep ze
   horen en hoe groot de bakken zijn. Elk scherm vraagt het hier.
   Twee soorten gegevens, elk met één bron:
     - wat er aan de machine ZIT (bakken, kleppen, kanalen): de IO-mapping;
     - wat er INGESTELD is (aantallen, namen, groepen, lektest, inhoud): de PLC.
   Meldt de PLC geen configuratie, dan geven deze hulpjes null. Het schema
   tekent dan de machine volgens de IO-mapping, zonder groepen, en zegt dat. */
function cfg(){const c=configuratie();return c&&c.aantalMeststof!==null&&c.aantalMeststof!==undefined&&c.aantalMeststof!==''&&isFinite(Number(c.aantalMeststof))?c:null;}
function actieveBronnen(){const c=cfg();if(!c)return null;const a=[];
  const nM=Math.max(0,Math.min(MAX_MEST,Math.floor(Number(c.aantalMeststof))||0));
  const nS=Math.max(0,Math.min(MAX_SPOREN,Math.floor(Number(c.aantalSporenbak))||0));
  for(let n=1;n<=nM;n++)a.push(n);for(let s=1;s<=nS;s++)a.push(SPOREN_START+s);return a;}
function actieveMest(){const a=actieveBronnen();return a?a.filter(n=>!isSporen(n)):null;}
function bronCfg(nr){const c=cfg();return c&&Array.isArray(c.bronnen)?(c.bronnen.find(b=>b&&Number(b.nr)===nr)||null):null;}
function bronNaam(nr){const b=bronCfg(nr);return b&&b.naam!=null&&String(b.naam).trim()?String(b.naam):null;}
function bronGroep(nr){const b=bronCfg(nr);const g=b?String(b.groep||''):'';return GROEPEN[g]?g:'';}
/* naam op het scherm: die van de PLC. Zonder configuratie de naam van de bak in de IO-mapping (de hardware). */
function stofNaam(nr){const n=bronNaam(nr);if(n)return n;const h=hwBron(nr);return h?h.naamIo:(isSporen(nr)?'sporenbak '+(nr-SPOREN_START):'mestbak '+nr);}
/* wat het schema tekent: de bronnen in gebruik volgens de PLC, of zonder configuratie alles wat de IO-mapping heeft */
function schemaBronnen(){const a=actieveBronnen();return (a||[...HW_MEST.map(h=>h.nr),...HW_SPOREN.map(h=>h.nr)]).filter(nr=>hwBron(nr));}
function sporenInGebruik(){const a=actieveBronnen();return HW_SPOREN.filter(h=>!a||a.includes(h.nr));}
/* de groep van een bestemming (besluit 22-09): kant A = A, kant B = B; zuurbak en sporenbakken volgens de PLC */
function bakGroep(bak){if(bak==='TBA'||/^A[1-3]$/.test(bak))return 'A';if(bak==='TBB'||/^B[1-3]$/.test(bak))return 'B';
  const c=cfg();if(bak==='ZB')return c&&GROEPEN[c.zuurbakGroep]?c.zuurbakGroep:'';
  const m=/^SP([1-5])$/.exec(bak);return m?bronGroep(SPOREN_START+Number(m[1])):'';}
/* inhoud van een bak in liters, volgens de PLC; null als hij het niet meldt */
function bakInhoud(bak){const c=cfg();if(!c)return null;let v=null;
  if(/^[AB][1-3]$/.test(bak))v=c.volWerkbak&&c.volWerkbak[bak];
  else if(bak==='TBA'||bak==='TBB')v=c.volTussenbak&&c.volTussenbak[bak];   /* sinds 22-09 middag (Wessel: "hoeveel L er precies in elke bak past") */
  else if(bak==='ZB')v=c.volZuurbak;
  else{const m=/^SP([1-5])$/.exec(bak);if(m&&Array.isArray(c.volSporenbak))v=c.volSporenbak[Number(m[1])-1];}
  const n=norm(v);return n&&n.q!=='bad'&&isFinite(Number(n.v))&&Number(n.v)>0?Number(n.v):null;}
/* de bakken die gevuld worden (besluit Wessel 22-09): de zes werkbakken, de zuurbak en de sporenbakken in gebruik.
   Elk heeft een vulgrens (P_NivStart); alleen een sporenbak heeft een menger. */
function vulBakken(){return [...WERKBAKKEN.map(w=>({bak:w.bak,loc:w.loc,naam:locNaam(w.loc),soort:'werk'})),
  {bak:'ZB',loc:'LOC-ZB',naam:locNaam('LOC-ZB'),soort:'zuur'},
  ...sporenInGebruik().map(h=>({bak:h.bak,loc:h.loc,naam:stofNaam(h.nr),soort:'sporen',nr:h.nr}))];}
/* het niveau van een bak in procent van zijn inhoud: liters van de PLC gedeeld door de inhoud uit de configuratie.
   null als een van beide ontbreekt (niet geijkt, storing, geen configuratie): niet gemeten is niet nul. */
function niveauPct(bak,loc){const lt=niveauSensor(loc);const L=lt?getalWaarde(lt.ref):null;const cap=bakInhoud(bak);
  return L!==null&&cap?L/cap*100:null;}
/* wat de PLC de menger van een sporenbak laat doen: {stand:'draait'|'rust'|'wacht'|'uit', restS, reden}; null = niet gemeld */
function menger(bak){const s=actueel();const m=s&&s.mengers&&typeof s.mengers==='object'?s.mengers[bak]:null;return m&&typeof m==='object'?m:null;}

/* ---- de receptopbouw en de waterbalans (besluit Wessel 22-09, kennisbank 4-hmi\06-receptopbouw-en-tussenbak.md) ----
   De service legt per werkbak vast welke stoffen, in welke volgorde, het water per portie (vast of auto) en de
   standaard in L per 1000 L. De teler past alleen de liters aan. EEN rekenregel (rbReken) voor het scherm, de
   nabootsing (reken_recept) en straks de PLC: dezelfde uitkomst. */
function receptopbouw(){const s=actueel();return s&&s.receptopbouw&&typeof s.receptopbouw==='object'?s.receptopbouw:null;}
/* het recept van één werkbak zoals de PLC het meldt: {versie, stappen:[n], water:[L|null] (lengte N+1, laatste null), standaard:{n:L}};
   elke werkbak heeft een eigen versie, zodat een wijziging aan A1 een concept van B1 niet ongeldig maakt */
function rbVan(bak){const r=receptopbouw();const b=r&&r[bak];if(!b||typeof b!=='object'||!Array.isArray(b.stappen))return null;
  const st=b.stappen.map(Number).filter(n=>Number.isInteger(n)&&n>=1);const w=Array.isArray(b.water)?b.water.slice(0,st.length+1):[];
  while(w.length<st.length+1)w.push(null);w[st.length]=null;
  return {versie:b.versie!=null&&isFinite(Number(b.versie))?Number(b.versie):null,stappen:st,water:w.map(x=>x==null||x===''||!isFinite(Number(x))?null:Number(x)),standaard:b.standaard&&typeof b.standaard==='object'?b.standaard:{}};}
function rbStd(rb,n){const v=rb&&rb.standaard?rb.standaard[n]:null;const f=Number(v&&typeof v==='object'?v.v:v);return isFinite(f)?f:0;}
/* het batchvolume: sinds 22-09 in de configuratie (cfg.volBatch, besluit Wessel; was de instelling P_VolBatch).
   Meldt de PLC het niet, dan null: niet gemeten is niet nul. */
/* het referentievolume van het invulschema (cfg.volReferentie, ontwerp: 1000 L): de recepten staan 'per zoveel liter'.
   Elke schermtekst haalt het hier, zodat er nergens een vaste 1000 staat (review 23-09). */
function refVol(){const n=norm(cfg()&&cfg().volReferentie);return n&&n.q!=='bad'&&Number(n.v)>0?Number(n.v):null;}
function perRef(){const r=refVol();return r?'per '+fix(r,0)+' L':'per referentievolume';}
function batchVol(){const n=norm(cfg()&&cfg().volBatch);return n&&n.q!=='bad'&&Number(n.v)>0?Number(n.v):null;}
/* de maten, allemaal van de PLC: minima (Instellingen), batchvolume, referentievolume en de inhoud van de
   tussenbak (Configuratie). Ontbreekt er een, dan rekent het scherm niet: niet gemeten is niet nul. */
/* Het water ná een stof is minstens het spoelvolume van die stof: sinds 22-09 per meststof (Wessel: "fijnvolume en
   spoelvolume moet per meststof aan te passen zijn"). minS is één getal (voor elke stof, zoals eerst) of per bron {n: L}. */
function rbMaten(bak){const c=cfg();const nr=norm(c&&c.volReferentie);const tb='TB'+String(bak).slice(0,1);
  const per={};(actieveBronnen()||[]).forEach(n=>{const v=insGetal('P_VolSpoel',n);if(v!=null)per[n]=v;});const alle=insGetal('P_VolSpoel');
  return {batch:batchVol(),ref:nr&&nr.q!=='bad'&&Number(nr.v)>0?Number(nr.v):null,minV:insGetal('P_VolVoorwater'),
    minS:Object.keys(per).length?per:alle,cap:bakInhoud(tb),tb:tb};}
function rbMinS(m,n){const s=m?m.minS:null;if(typeof s==='number')return isFinite(s)?s:null;
  if(s&&typeof s==='object'&&s[n]!=null){const v=Number(s[n]);return isFinite(v)?v:null;}return null;}
/* het minimum van waterportie i: het voorwater, of het spoelvolume van de stof die ervóór gedoseerd wordt */
function rbMinW(m,stappen,i){return i===0?m.minV:rbMinS(m,stappen[i-1]);}
/* compleet: alle maten van de PLC, en (met stappen) een spoelvolume voor elke stof in het recept; niet gemeten is niet nul */
function rbMatenCompleet(m,stappen){return !!m&&m.batch>0&&m.ref>0&&m.minV!=null&&m.minS!=null&&(!stappen||stappen.every(n=>rbMinS(m,n)!=null));}
/* het rekenmodel. stappen [n]; water [L | null = auto], lengte N+1, de laatste is altijd de rest; bedragen [L per 1000 L]
   per stap. Het water dat overblijft, gaat gelijk over de auto-porties; een portie onder zijn minimum krijgt het minimum
   en de rest wordt opnieuw verdeeld. Past = precies het batchvolume, elke vaste portie op of boven zijn minimum, en de
   batch past in de tussenbak. */
function rbReken(stappen,water,bedragen,m){
  if(!rbMatenCompleet(m,stappen))return null;
  const f=m.batch/m.ref;const stofL=bedragen.map(a=>Math.max(0,Number(a)||0)*f);const somStof=stofL.reduce((a,c)=>a+c,0);
  const N=stappen.length+1;const minW=i=>rbMinW(m,stappen,i);const w=new Array(N).fill(0);const auto=[];let vast=0;
  for(let i=0;i<N;i++){const v=i===N-1||water[i]==null?null:Number(water[i]);if(v==null||!isFinite(v))auto.push(i);else{w[i]=v;vast+=v;}}
  let rest=m.batch-somStof-vast;let a=auto.slice();
  while(a.length){const share=rest/a.length;const onder=a.filter(i=>minW(i)>share+1e-9);
    if(!onder.length){a.forEach(i=>{w[i]=share;});break;}
    onder.forEach(i=>{w[i]=minW(i);rest-=minW(i);});a=a.filter(i=>onder.indexOf(i)<0);}
  const somW=w.reduce((x,c)=>x+c,0);const totaal=somStof+somW;const minAuto=auto.reduce((x,i)=>x+minW(i),0);
  const teLaag=[];for(let i=0;i<N-1;i++){if(water[i]!=null&&isFinite(Number(water[i]))&&Number(water[i])<minW(i)-1e-9)teLaag.push(i);}
  let teVeel=totaal-m.batch;if(teVeel<1e-6)teVeel=0;
  const pastBak=!(m.cap>0)||m.batch<=m.cap+1e-9;
  return {f:f,stofL:stofL,somStof:somStof,w:w,somW:somW,totaal:totaal,teVeel:teVeel,vrij:Math.max(0,m.batch-somStof-vast-minAuto),
    nAuto:auto.length,teLaag:teLaag,pastBak:pastBak,past:teVeel===0&&!teLaag.length&&pastBak,minW:minW};}
/* de liters van de teler (R_Advies) voor de stappen van een recept, in L per 1000 L; een ontbrekende waarde telt als 0 */
function rbTeler(bak,rb){return rb.stappen.map(n=>{const x=recept(bak,n);return x&&x.q!=='bad'&&isFinite(Number(x.v))?Number(x.v):0;});}
/* ---- de kalibratie, zoals de PLC hem meldt (besluit Wessel 22-09, 4-hmi\04-kalibratie.md) ----
   Het pulsgewicht van de flowmeter, en per niveaumeting een nul- en een toppunt in ruwe waarden van
   de module. De PLC rekent ermee; dit scherm toont en stuurt alleen. */
function kal(){const s=actueel();const k=s&&s.kalibratie;return k&&typeof k==='object'&&k.versie!=null?k:null;}
function ijkingVan(ref){const k=kal();const n=k&&k.niveau&&k.niveau[ref];return n&&typeof n==='object'?n:null;}
function isGeijkt(ref){const i=ijkingVan(ref);return !!(i&&Number(i.datum)>0);}
/* JJJJMMDD (zoals de PLC de datum van een ijking bewaart) als 22-09-2026 */
function datumTekst(d){const n=Number(d);if(!(n>0))return STREEP;const j=Math.floor(n/10000),m=Math.floor(n/100)%100,dg=n%100;return (dg<10?'0':'')+dg+'-'+(m<10?'0':'')+m+'-'+j;}
/* een vingerafdruk van wat de schermen tekenen: verandert hij, dan tekent het open scherm opnieuw */
function cfgSleutel(){const c=cfg();if(!c)return 'geen';
  return JSON.stringify([c.versie,c.aantalMeststof,c.aantalSporenbak,c.zuurbakGroep,(c.bronnen||[]).map(b=>b&&[b.nr,b.naam,b.groep])]);}

/* hulp: bit of getal, of null als het er niet (goed) is */
function isBit(n){return n&&n.q!=='bad'?(n.v===true||n.v===1||n.v==='1'):null;}
function bitKanaal(sleutel){const n=kanaal(sleutel);return n?isBit(n):null;}
function bitWaarde(ref){const n=waarde(ref);return n?isBit(n):null;}
function getalWaarde(ref){const n=waarde(ref);if(!n||n.q==='bad')return null;const f=typeof n.v==='number'?n.v:parseFloat(n.v);return isFinite(f)?f:null;}
/* uitgang van een component: het DO-kanaal (bij FCS 1 het kanaal met de gevraagde functie) */
function doVan(ref,functieWoord){
  const ks=kanalenVan(ref).filter(k=>k.type==='DO');
  const k=functieWoord?ks.find(x=>(x.functie||'').toLowerCase().includes(functieWoord)):ks[0];
  return k?bitKanaal(k.sleutel):null;
}
function tekstGetal(v,u,d){if(v===null||v===undefined||!isFinite(v))return STREEP;return fix(v,d||0)+(u?' '+u:'');}
function tekstWaarde(n,d){if(!n)return STREEP;if(n.q==='bad')return STREEP;const f=typeof n.v==='number'?n.v:parseFloat(n.v);
  if(typeof n.v==='boolean')return n.v?'1':'0';return isFinite(f)?(fix(f,d||0)+(n.u?' '+n.u:'')):esc(String(n.v));}
function qVlag(n){if(!n)return '';if(n.q==='bad')return '<span class="q-flag bad" title="De PLC meldt deze waarde als ongeldig">'+ic('warn',11,2)+' ongeldig</span>';
  if(n.q==='uncertain')return '<span class="q-flag unc" title="De PLC meldt deze waarde als onzeker">'+ic('warn',11,2)+' onzeker</span>';return '';}

/* ---- opdrachten --------------------------------------------------
   Zegt nooit 'gelukt' voordat de brug dat zegt. Of de PLC het verwerkt,
   blijkt pas uit een volgende momentopname (wachtOp). */
async function opdracht(naam,lading){
  const ctl=('AbortController' in window)?new AbortController():null;
  const to=ctl?setTimeout(()=>ctl.abort(),5000):null;
  try{
    const r=await fetch(basisUrl()+'/command/'+encodeURIComponent(naam),{method:'POST',headers:{'Content-Type':'application/json','X-Bakkenvuller':'1'},
      body:JSON.stringify(lading||{}),signal:ctl?ctl.signal:undefined});
    let j=null;try{j=await r.json();}catch(e){}
    if(r.ok&&j&&j.ok===true)return {ok:true,antwoord:j};
    const fout=(j&&(j.fout||j.error||j.message))||('HTTP '+r.status);
    /* 401: de brug wil een inlog (besluit 22-09); het scherm vraagt hem meteen */
    if(r.status===401&&j&&j.nodig&&typeof vraagInlog==='function')vraagInlog(j.nodig);
    return {ok:false,status:r.status,fout:String(fout).slice(0,300),ontbreekt:!!(j&&j.ontbreekt),antwoord:j,code:j&&j.code};
  }catch(e){
    return {ok:false,status:0,fout:(e&&e.name==='AbortError')?'geen antwoord binnen 5 s':'de brug is niet bereikbaar'};
  }finally{if(to)clearTimeout(to);}
}
/* 501: de brug schrijft nog niets naar de PLC (brug 0.4, 22-09). Eén zin op het scherm, niet twee keer hetzelfde. */
function nietNaarPlc(wat){return 'De brug kan '+wat+' nog niet naar de PLC schrijven: het PLC-programma bestaat nog niet. Er is niets veranderd.';}
/* wacht tot een volgende momentopname aan een voorwaarde voldoet */
function wachtOp(voorwaarde,ms){
  return new Promise(res=>{const t0=Date.now();
    const stap=()=>{let ok=false;try{ok=!!voorwaarde();}catch(e){}
      if(ok)return res(true);if(Date.now()-t0>ms)return res(false);setTimeout(stap,500);};
    stap();});
}

/* ---- meldingen ---------------------------------------------------
   Uit /events van de brug. sev: alarm | warn | info. aud: op (bediening
   ziet hem) of svc (alleen service). Alles wat uit de feed komt, wordt aan de
   grens ge-escaped. */
function meldingen(){
  const uit=[];
  (bron.events||[]).forEach(e=>{
    if(!e||typeof e!=='object')return;
    const id=String(e.id||((e.code||'')+'-'+(e.ts||''))).slice(0,80);
    const sev=(e.sev==='alarm'||e.sev==='warn'||e.sev==='info')?e.sev:'alarm';
    const t=Date.parse(e.ts);
    uit.push({id,sev,aud:e.aud==='op'?'op':'svc',code:esc(String(e.code||'')),tijd:isFinite(t)?t:null,
      ack:!!e.ackTs,weg:!!e.clearedTs,
      tekst:esc(String(e.text||'Melding')),plek:esc([e.source,e.loc].filter(Boolean).join(' · ')),
      oorzaak:esc(String(e.cause||'')),controle:esc(String(e.check||''))});
  });
  return uit;
}
/* storingen staan altijd op het scherm, op elk niveau (ontwerp §9.3); de rest volgt aud */
function zichtbaar(m){return ui.niveau==='bediening'?(m.aud==='op'||m.sev==='alarm'):true;}
function actieveMeldingen(){return meldingen().filter(m=>!m.weg&&zichtbaar(m)&&(m.sev!=='info'||!m.ack));}
/* bevestigen: de brug zegt ja, en daarna moet de melding in /events een ackTs
   hebben (wachtOp). Pas dan staat hij op het scherm als bevestigd. */
async function bevestig(id){
  const ctl=('AbortController' in window)?new AbortController():null;const to=ctl?setTimeout(()=>ctl.abort(),4000):null;
  try{
    const r=await fetch(basisUrl()+'/ack',{method:'POST',headers:{'Content-Type':'application/json','X-Bakkenvuller':'1'},body:JSON.stringify({id}),signal:ctl?ctl.signal:undefined});
    if(!r.ok){let j=null;try{j=await r.json();}catch(e){}
      if(r.status===401&&j&&j.nodig&&typeof vraagInlog==='function')vraagInlog(j.nodig);
      return {ok:false,status:r.status,fout:r.status===501?'de brug kan nog niets naar de PLC sturen; het PLC-programma bestaat nog niet':((j&&j.fout)||('HTTP '+r.status))};}
  }catch(e){return {ok:false,fout:'de brug is niet bereikbaar'};}
  finally{if(to)clearTimeout(to);}
  haalBron();
  const verwerkt=await wachtOp(()=>meldingen().some(m=>m.id===id&&m.ack),8000);
  return {ok:true,verwerkt};
}


/* ==================================================================
   NIVEAUS EN SCHERMEN - ontwerp §9.3: bediening (teler), service
   (servicemonteur), configuratie (bij de ingebruikname).
   Sinds 22-09 (besluit Wessel): kent de brug een inlog, dan vraagt een hoger
   niveau eerst het wachtwoord, en controleert de brug elke opdracht
   (F3_toegang.js). Kent de brug geen inlog (0.3 leest alleen), dan wisselen
   met één klik zoals eerst. In de browser wordt alleen de weergave onthouden.
   ================================================================== */
const NIVEAUS=[['bediening','Bediening','user'],['service','Service','wrench'],['configuratie','Configuratie','shield']];
const NIVEAU_RANG={bediening:0,service:1,configuratie:2};
const UI_KEY='bakkenvuller.ui.v1';
const ui={niveau:'bediening',scherm:'overzicht',thema:'light',themaGekozen:false,railIn:false};
function laadUi(){try{const c=JSON.parse(localStorage.getItem(UI_KEY)||'null');if(!c)return;
  if(NIVEAU_RANG[c.niveau]!=null)ui.niveau=c.niveau;
  if(typeof c.railIn==='boolean')ui.railIn=c.railIn;
  if(c.themaGekozen&&(c.thema==='dark'||c.thema==='light')){ui.thema=c.thema;ui.themaGekozen=true;}
  if(typeof c.url==='string')bron.url=c.url.slice(0,200);
}catch(e){}}
function bewaarUi(){try{localStorage.setItem(UI_KEY,JSON.stringify({niveau:ui.niveau,railIn:ui.railIn,thema:ui.thema,themaGekozen:ui.themaGekozen,url:bron.url}));}catch(e){}}

/* scherm: titel, icoon, niveau (0 bediening, 1 service, 2 configuratie); view/mount/ververs volgen in de schermdelen */
const SCHERMEN={
  overzicht:{t:'Overzicht',i:'overview',n:0},
  recepten:{t:'Recepten',i:'recipe',n:0},
  meldingen:{t:'Meldingen',i:'alarm',n:0},
  logboek:{t:'Logboek',i:'history',n:0},
  receptopbouw:{t:'Receptopbouw',i:'beaker',n:1},
  volgorde:{t:'Fasen',i:'steps',n:1},
  io:{t:'Live I/O',i:'io',n:1},
  hand:{t:'Handbediening',i:'hand',n:1},
  instellingen:{t:'Instellingen',i:'cal',n:1},
  kalibratie:{t:'Kalibratie',i:'gauge',n:1},
  besturing:{t:'Controller',i:'chip',n:1},
  onderhoud:{t:'Onderhoud',i:'wrench',n:1},
  configuratie:{t:'Configuratie',i:'shield',n:2}
};
/* 'Systeem (PLC)' zoals bij ALIA: de controller en de klemmen, alleen voor service.
   22-09 (besluit Wessel, S16/S17): Inbedrijfstellen is weg (de klemmenlijst zit in Live I/O, de databron op
   Configuratie), en Onderhoud staat pas in het menu als de brug onderhoudsgegevens levert. */
const NAV_GROEPEN=[['Bediening',0,['overzicht','recepten','meldingen','logboek']],
                   ['Service',1,['receptopbouw','instellingen','kalibratie','hand','volgorde','onderhoud']],
                   ['Systeem (PLC)',1,['besturing','io']],
                   ['Configuratie',2,['configuratie']]];
function heeftOnderhoud(){const s=typeof actueel==='function'?actueel():null;return !!(s&&s.onderhoud&&typeof s.onderhoud==='object');}
/* 22-09 middag (Wessel: "ik heb het idee dat handbediening en fase eruit kan toch?"):
   - Fasen: de actieve fase staat in het schema op het Overzicht; de hele fasetabel opent daar met een tik op de
     kop van een zone. Het scherm bestaat nog (adres #volgorde), maar staat niet in het menu.
   - Handbediening: toonde alleen wat Live I/O en het schema ook tonen, want de brug geeft nog geen opdrachten door.
     Het komt terug in het menu zodra de brug kan bedienen (open punt K11, met het PLC-programma). Staat de PLC op
     HAND, dan brengt de knop HAND in de bovenbalk je er nog wel heen. */
function inMenu(k){if(k==='onderhoud')return heeftOnderhoud();return k!=='volgorde'&&k!=='hand';}
function magScherm(k){const s=SCHERMEN[k];return !!s&&s.n<=NIVEAU_RANG[ui.niveau];}

function tekenNiveaus(){
  /* met inlog op de brug (besluit 22-09): een slot bij niveaus waarvoor je nog moet inloggen, en een knop om uit te loggen */
  const inl=typeof inlogBekend==='function'&&inlogBekend();const rang=inl?sessieRang():9;
  $('#roles').innerHTML=NIVEAUS.map(([k,l,i])=>{const slot=inl&&NIVEAU_RANG[k]>rang;
    return `<button data-role="${k}" aria-pressed="${ui.niveau===k}" title="${slot?'Inloggen als '+l:'Niveau '+l}"><span class="ic">${ic(slot?'lock':i,15,2)}</span><span class="lbl">${l}</span></button>`;}).join('')
    +(inl&&echtIngelogd()?`<button data-role="uit" title="Uitloggen (${esc(niveauNaam(sessieNiveau()))})"><span class="ic">${ic('logout',15,2)}</span><span class="lbl">Uit</span></button>`:'');
}
function tekenNav(){
  let h='';
  NAV_GROEPEN.forEach(([grp,n,items])=>{
    if(n>NIVEAU_RANG[ui.niveau])return;
    h+=`<div class="rail-group-label">${grp}</div>`;
    items.forEach(k=>{if(!inMenu(k)&&ui.scherm!==k)return;const s=SCHERMEN[k];const huidig=ui.scherm===k;
      const badge=k==='meldingen'?navBadge():'';
      h+=`<button class="nav-item" data-screen="${k}" ${huidig?'aria-current="page"':''} title="${s.t}"><span class="ic">${ic(s.i,22,2)}</span><span class="lbl">${s.t}</span>${badge}</button>`;});
  });
  const b=MACHINE.bron||{};
  $('#rail').innerHTML=h+`<div class="rail-foot">
     <div class="row"><span>Machine uit IO-mapping</span><span class="mono">${esc((b.bestand||'').split('/').slice(-2,-1)[0]||STREEP)}</span></div>
     <div class="row"><span>Bron</span><span class="mono" id="rail-bron">${bronTekst()}</span></div>
   </div>`;
}
function navBadge(){const a=actieveMeldingen();if(!a.length)return '';return `<span class="nav-badge${a.some(m=>m.sev==='alarm')?'':' warn'}">${a.length}</span>`;}
function bronTekst(){const v=vers();if(!v.ok)return bron.lastOk?'verouderd':'geen';const s=bronSoort();return s==='plc'?'PLC':s==='nabootsing'?'nabootsing':'onbekend';}

function ga(k){
  if(!SCHERMEN[k])return;
  if(!magScherm(k)){toast('Dit scherm hoort bij een hoger niveau','lock');return;}
  ui.scherm=k;document.body.classList.remove('nav-open');
  tekenNav();render();
  const m=$('#main');if(m)m.scrollTop=0;window.scrollTo(0,0);
}
/* met welke configuratie het open scherm getekend is; verandert die in de PLC, dan tekent G_init het opnieuw */
let getekendCfg=null;
/* het open scherm staat in het adres (#recepten): vernieuwen houdt je op hetzelfde scherm, en een bladwijzer
   werkt (22-09). Een scherm van een hoger niveau opent zo alleen als de brug geen inlog kent; anders beslist de inlog. */
function zetAdres(){try{if(location.hash!=='#'+ui.scherm)history.replaceState(null,'','#'+ui.scherm);}catch(e){}}
function schermUitAdres(){let k='';try{k=decodeURIComponent((location.hash||'').slice(1));}catch(e){}
  if(!SCHERMEN[k]||k===ui.scherm)return false;
  if(!magScherm(k)){if(inlogBekend())return false;ui.niveau=NIVEAUS[SCHERMEN[k].n][0];}
  ui.scherm=k;return true;}
function render(){
  if(!magScherm(ui.scherm))ui.scherm='overzicht';
  zetAdres();
  getekendCfg=cfgSleutel();
  const s=SCHERMEN[ui.scherm];const main=$('#main');
  main.innerHTML=s.view?s.view():'';
  if(s.mount)s.mount();
  if(s.ververs)s.ververs();
  main.classList.remove('reveal');void main.offsetWidth;main.classList.add('reveal');
}

/* ---- bovenbalk --------------------------------------------------- */
/* De standen van de verbinding, zoals bij ALIA. Eerst de brug, dan de PLC
   achter de brug, dan wie de gegevens levert. */
function verbindingStand(){
  const v=vers();const b=brugBlok();
  if(!bron.lastOk)return {s:bron.status==='start'?'start':'geen-brug',txt:bron.status==='start'?'Verbinden…':'Geen antwoord',cls:'off'};
  if(!v.brugOk)return {s:'geen-brug',txt:'Geen antwoord · '+ageStr(v.ageMs),cls:'off'};
  if(plcVerbonden()===false)return {s:'geen-plc',txt:'PLC niet bereikbaar',cls:'off'};
  if(!v.ok)return {s:'oud',txt:v.plcAgeS===null?'Geen verse data':('Geen verse data · '+fix(v.plcAgeS,0)+' s'),cls:'stale'};
  const s=bronSoort();
  if(s==='nabootsing')return {s:'nabootsing',txt:'Nabootsing',cls:'sim'};
  if(s!=='plc')return {s:'onbekend',txt:'Bron onbekend',cls:'stale'};
  if(plcDraait()===false)return {s:'gestopt',txt:'PLC gestopt',cls:'off'};
  return {s:'plc',txt:'PLC verbonden',cls:''};
}
function tekenVerbinding(){
  const el=$('#conn');if(!el)return;const lbl=el.querySelector('.lbl');
  const st=verbindingStand();
  el.className='tb-conn'+(st.cls?' '+st.cls:'');if(lbl)lbl.textContent=st.txt;el.title='Bron: '+st.txt;
  const rb=$('#rail-bron');if(rb)rb.textContent=bronTekst();
}
function tekenBanner(){

/* ==================================================================
   HET INSTALLATIESCHEMA - naar de P&ID, in een vlak van 1600 x 842; de
   browser schaalt het naar de breedte. Opbouw van boven naar beneden: de
   bronnen met hun aanzuigklep, de zuigleiding naar de doseerunit
   (vulpomp, terugslagklep, flowmeter), de persleiding, en de drie zones:
   keten A, keten B (tussenbak, mengpomp, menglus, drie werkbakken) en
   direct (zuurbak en sporenbakken). De bronnen volgen de configuratie in
   de PLC; de rest de P&ID en de IO-mapping.
   ================================================================== */
/* 22-09: 30 hoger dan de schets, zodat het hele schema op het paneel (1920 x 1080) past, ook met een melding erboven */
/* 22-09 (Wessel: "niet alle sporenbakken zitten aan de transportleiding"): de doseerunit staat helemaal rechts,
   zodat de persleiding één verdeelleiding is van rechts naar links, met elke bestemming eronder. De namen en
   waarden van de doseerunit staan links van de kolom (LX). */
const SV={W:1600,H:812,SNEL:900,X0:40,X1:1352,CT:24,CH:74,KY:128,ZY:160,PX:1552,LX:1520,TY:196,FY:232,PERS:292,
  ZT:312,TT:372,THT:124,TW:184,MPY:548,VY:588,WKY:616,WT:644,WH:110};
const SV_ZONE={A:{x:24,w:520,cx:284},B:{x:560,w:520,cx:820}};
const SV_DIRECT={x:1096,w:480,zb:1180};
let lay=null,svStand={sleutels:{},golf:{}};
const svBeweging=()=>!(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches);
function svIndeling(){
  const bronnen=[0,...schemaBronnen()];const stap=(SV.X1-SV.X0)/Math.max(1,bronnen.length);
  const sporen=sporenInGebruik();const n=sporen.length;
  /* de sporenbakken tussen 1290 en 1500: links van de pompkolom (1552), zodat ze aan de verdeelleiding hangen */

function svZet(el,klasse,aan){if(el)el.classList.toggle(klasse,!!aan);}
/* het oppervlak glijdt in ongeveer 1,5 s naar de nieuwe meting; het getal in het label niet (dat is altijd de PLC-waarde) */
let svGlij=null;const svDoel={};
function svNiveau(id,frac,tekst){
  const t=document.getElementById('t-'+id),vl=document.getElementById('vl-'+id),pt=document.getElementById('pt-'+id);if(!t||!vl)return;
  if(pt)pt.textContent=tekst;
  if(frac===null){vl.style.display='none';delete svDoel[id];return;}
  const y=+t.dataset.y,h=+t.dataset.h;const doel=y+h-3-(h-8)*Math.max(0,Math.min(1,frac));
  const was=vl.style.display==='none';vl.style.display='';
  const nu=parseFloat((vl.style.transform.match(/translateY\(([-\d.]+)px\)/)||[])[1]);
  if(was||!isFinite(nu)||document.hidden||!svBeweging()){vl.style.transform=`translateY(${doel.toFixed(1)}px)`;delete svDoel[id];return;}
  if(Math.abs(nu-doel)<.3)return;svDoel[id]=doel;
  if(!svGlij)svGlij=setInterval(()=>{let bezig=false;
    Object.keys(svDoel).forEach(k=>{const e=document.getElementById('vl-'+k);if(!e){delete svDoel[k];return;}
      const n=parseFloat((e.style.transform.match(/translateY\(([-\d.]+)px\)/)||[])[1]);const d=svDoel[k];
      const nx=Math.abs(d-n)<.4?d:n+(d-n)*0.12;e.style.transform=`translateY(${nx.toFixed(2)}px)`;if(nx===d)delete svDoel[k];else bezig=true;});
    if(!bezig||document.hidden){Object.keys(svDoel).forEach(k=>{const e=document.getElementById('vl-'+k);if(e)e.style.transform=`translateY(${svDoel[k].toFixed(1)}px)`;delete svDoel[k];});clearInterval(svGlij);svGlij=null;}},50);
}

let mlTab='act',mlOpen=null,mlSleutel='';
function viewMeldingen(){

function kanaalTekst(k){

}

/* ==================================================================
   CONTROLLER (Systeem (PLC), service) - naar het voorbeeld van ALIA.
   Alles hier komt uit de brug, die het bij de controller zelf haalt:
     bridge      wie de brug is en hoe oud zijn PLC-lezing is
     controller  identiteit, stand, project-CRC       (DeviceInfo, PLC_STATE)
     health      processor, geheugen, temperatuur…    (DEVICE_STATE, DeviceStatus)
     axio        het diagnosestatusregister van de bus (AXIO_DIAG_*)
     profinet    de PROFINET-status                    (PNIO_*, PND_*)
     modules     de modules op de bus en elk kanaal   (projectbestanden, I/O-poorten)
   De IO-mapping is de verwachte kant. Een waarde die er niet is, krijgt een
   streepje en een reden, geen getal: op een plausibel getal neemt iemand een
   besluit, op een leeg vakje niet.
   ================================================================== */
let ctTab='status';
function ctBlok(naam){const s=actueel();return s&&s[naam]&&typeof s[naam]==='object'?s[naam]:null;}
function hMeting(k){const h=ctBlok('health');if(!h)return null;const n=norm(h[k]);return n&&n.q!=='bad'?n:null;}
/* de bits van het diagnosestatusregister: uit statusReg als de brug die geeft
   (dan ook F_BD en de rest), anders uit de losse vlaggen in axio.status */
function axioBits(){
  const a=ctBlok('axio');if(!a||a.gemeten===false)return null;
  const reg=a.statusReg!==undefined&&a.statusReg!==null&&a.statusReg!==''&&isFinite(Number(a.statusReg))?Number(a.statusReg):null;
  const st=a.status&&typeof a.status==='object'?a.status:null;if(reg===null&&!st)return null;
  const uit={};AXIO_STATUS_BITS.forEach(b=>{uit[b.name]=reg!==null?!!((reg>>b.bit)&1):(st&&b.name in st?!!st[b.name]:null);});
  return uit;
}
function foutRegCode(a){if(!a||a.paramReg1===undefined||a.paramReg1===null||a.paramReg1==='')return null;
  const c=String(a.paramReg1).replace(/^0x/i,'').toUpperCase().padStart(4,'0');return c==='0000'?null:c;}
function foutRegTekst(a){const c=foutRegCode(a);if(!c)return 'De busmaster geeft geen foutcode.';
  return 'Code '+c+': '+(IO_CODES[c]||'onbekende code')+(a.paramReg2!==undefined&&a.paramReg2!==null&&a.paramReg2!==''?(' · plek '+a.paramReg2+' op de bus'):'');}
function diagVan(p){return p&&p.gevonden&&Array.isArray(p.gevonden.diag)?p.gevonden.diag.filter(d=>d&&d.code&&String(d.code)!=='0000'):[];}
function standTekst(p){return {ok:'klopt met de IO-mapping',anders:'andere module dan de IO-mapping',ontbreekt:'geen module gevonden',onbekend:'module niet in de catalogus van de brug','geen-meting':'niet gemeten'}[p.stand]||p.stand;}

/* alles wat nu aandacht vraagt, de ernstigste eerst */
function ctStoringen(){
  const uit=[];const C=ctBlok('controller');const a=ctBlok('axio');const ax=axioBits();const r=rek();
  if(C&&C.gemeten!==false&&C.mode&&C.mode!=='Running')uit.push({sev:'alarm',t:'De besturing draait niet',d:'PLC_STATE = '+C.mode+'. De machine doet niets, ook al is de verbinding in orde.'});
  if(C&&C.vlaggenTekst&&/error|fout/i.test(C.vlaggenTekst))uit.push({sev:'alarm',t:'De besturing meldt een fout',d:String(C.vlaggenTekst)});
  if(ax){
    if(ax.F_BUS)uit.push({sev:'alarm',t:'Busfout: de lokale Axioline-bus is onderbroken',d:'Controleer de modules en de backplanes. '+foutRegTekst(a)});
    if(ax.F_CTRL)uit.push({sev:'alarm',t:'Fout in de busmaster van de controller',d:foutRegTekst(a)});
    if(ax.F_PF)uit.push({sev:'alarm',t:'I/O-fout op de bus',d:foutRegTekst(a)});
    else if(ax.F_PW)uit.push({sev:'warn',t:'I/O-waarschuwing op de bus',d:foutRegTekst(a)});
    if(ax.F_BD)uit.push({sev:'warn',t:'Er zit een module op de bus die niet in het project staat',d:'Bit F_BD (bus different) van het diagnosestatusregister.'});
  }
  r.plekken.forEach(p=>{const m=p.verwacht,g=p.gevonden;const waar='Plek '+p.plek+' ('+m.bp+' slot '+m.slot+')';
    if(p.stand==='ontbreekt')uit.push({sev:'alarm',t:waar+': geen module gevonden',d:'Verwacht: '+m.module+' ('+m.art+').',plek:p.plek});
    else if(p.stand==='anders')uit.push({sev:'alarm',t:waar+': andere module',d:'Verwacht '+m.module+' ('+m.art+'), gevonden '+(g.naam||'?')+' ('+(g.artikel||'?')+'). De kanalen van deze plek worden niet getoond.',plek:p.plek});
    else if(p.stand==='onbekend')uit.push({sev:'warn',t:waar+': module niet in de catalogus van de brug',d:'DeviceId '+(g.deviceId||'?')+'. Verwacht: '+m.module+'. Dat is een gat in de catalogus, geen fout van de machine.',plek:p.plek});
    diagVan(p).forEach(d=>{const c=String(d.code).replace(/^0x/i,'').toUpperCase();
      uit.push({sev:'alarm',t:waar+(d.ch!==null&&d.ch!==undefined&&d.ch!==''?(', kanaal '+d.ch):'')+': '+(IO_CODES[c]||('code '+c)),d:'Code '+c+(d.bron?(' · '+String(d.bron)):''),plek:p.plek});});
  });
  r.extra.forEach(g=>uit.push({sev:'warn',t:'Extra module op de bus, plek '+(g.slot!=null?g.slot:'?'),d:String(g.naam||g.deviceId||'onbekend')+' staat niet in de IO-mapping.'}));
  const dh=hMeting('DEVICE_HEALTH');if(dh&&Number(dh.v)!==0)uit.push({sev:'warn',t:'De controller meldt zijn gezondheid niet in orde',d:'Status.DeviceHealth = '+dh.v+'.'});
  return uit.sort((x,y)=>(x.sev==='alarm'?0:1)-(y.sev==='alarm'?0:1));
}

/* DE LAMPJES OP DE CONTROLLER - alleen wat gemeten is (ALIA, 07-09-2026):
     RUN/FAIL   PLC_STATE                 D/E   het Axioline-statusregister
     BF-C, SF, BF-D   de PROFINET-status
   Niet te meten op een AXC F 2152: UL/UP (24 V), BOOT, DBG en EXT. Een lampje
   dat niet gemeten wordt, is lichtgrijs en zegt dat; een groen lampje is een
   bewering. */
function ctLeds(){
  const C=ctBlok('controller'),ax=axioBits(),P=ctBlok('profinet');
  const niet=(id,w)=>({id,state:'onb',color:'info',meaning:'Niet gemeten. '+w});
  const uit=[];
  if(C&&C.mode){const draait=C.mode==='Running';const fout=!!(C.vlaggenTekst&&/error|fout/i.test(C.vlaggenTekst));
    uit.push({id:'RUN',state:draait?'on':'off',color:draait?'ok':'info',meaning:draait?'De besturing draait (PLC_STATE = Running).':'De besturing draait niet (PLC_STATE = '+C.mode+'). De machine doet niets.'});
    uit.push({id:'FAIL',state:fout?'on':'off',color:'alarm',meaning:fout?('De besturing meldt een fout: '+C.vlaggenTekst):'Geen foutvlag in PLC_STATE.'});}
  else{uit.push(niet('RUN','De brug levert geen PLC_STATE.'));uit.push(niet('FAIL','De brug levert geen PLC_STATE.'));}
  if(ax){const bf=!!ax.F_BUS,loopt=!!ax.F_RUN,pf=!!ax.F_PF,pw=!!ax.F_PW;
    uit.push({id:'D',state:bf?'blink':(loopt?'on':'off'),color:bf?'alarm':(loopt?'ok':'info'),meaning:bf?'Busfout: de lokale Axioline-bus is losgekoppeld.':loopt?'Lokale bus actief: de datacycli lopen en de uitgangen zijn vrijgegeven.':'De lokale bus wisselt geen data uit (F_RUN laag).'});
    uit.push({id:'E',state:(pf||pw)?'on':'off',color:pf?'alarm':(pw?'warn':'alarm'),meaning:pf?'I/O-fout: minstens één module meldt een storing.':pw?'I/O-waarschuwing: een module meldt een waarschuwing.':'Geen I/O-storing en geen waarschuwing op de lokale bus.'});}
  else{uit.push(niet('D','De brug levert het Axioline-statusregister niet.'));uit.push(niet('E','De brug levert het Axioline-statusregister niet.'));}
  if(P&&P.gemeten){
    uit.push({id:'BF-C',state:P.busFail?'on':'off',color:P.busFail?'alarm':'info',meaning:P.busFail?'PROFINET-busfout (controllerrol).':'Geen PROFINET-busfout.'});
    if(typeof P.deviceRolInGebruik==='boolean')uit.push({id:'BF-D',state:P.deviceRolInGebruik?'on':'off',color:'info',meaning:P.deviceRolInGebruik?'De PROFINET-devicerol wisselt data uit.':'De PROFINET-devicerol is niet in gebruik.'});
    else uit.push(niet('BF-D','De brug leest de PROFINET-devicerol niet uit.'));
    uit.push({id:'SF',state:P.systemFail?'on':'off',color:P.systemFail?'alarm':'info',meaning:P.systemFail?'PROFINET-systeemfout: er is diagnose.':'Geen PROFINET-systeemfout.'});}
  else['BF-C','BF-D','SF'].forEach(id=>uit.push(niet(id,'De brug levert de PROFINET-status niet.')));
  uit.push(niet('UL','De 24 V-voeding is op een AXC F 2152 niet uitleesbaar; daarvoor is een analoge ingang nodig.'));
  uit.push(niet('BOOT','Het opstarten is niet als waarde op te vragen.'));
  uit.push(niet('DBG','Of er een debugsessie loopt, is niet uit te lezen. Een debugsessie zet de besturing wel stil; dat zie je aan RUN.'));
  uit.push(niet('EXT','Uitbreidingen links van de controller zijn niet uit te lezen.'));
  return uit;
}
function ledVoor(l,extra){return l.state==='onb'?`<span class="led onb${extra?' '+extra:''}"></span>`:ledHTML(l.color,l.state,extra);}
function ctLed(id){return ctLeds().find(l=>l.id===id);}

function tekenTriage(){
  const el=$('#ct-triage');if(!el)return;
  const st=verbindingStand();const f=ctStoringen();const nA=f.filter(x=>x.sev==='alarm').length,nW=f.length-nA;
  const C=ctBlok('controller');let toon,label,icn,sub;
  if(!actueel()){toon='warn';label='Geen actuele gegevens';icn='network';sub='Zie de balk bovenaan.';}
  else if(nA){toon='alarm';label='Storing';icn='alarm';sub=nA+' storing'+(nA>1?'en':'')+(nW?(' · '+nW+' waarschuwing'+(nW>1?'en':'')):'')+' · hoogste: '+f[0].t;}
  else if(nW){toon='warn';label='Aandacht';icn='warn';sub=nW+' waarschuwing'+(nW>1?'en':'')+' · '+f[0].t;}
  else if(!C||C.gemeten===false){toon='warn';label='Niet te beoordelen';icn='info';sub='De brug levert (nu) geen gegevens van de controller.';}
  else{toon='ok';label='Alles in orde';icn='check';sub='Geen storing gemeld · '+(C.model||'controller');}
  const srcTone=st.s==='plc'?'ok':(st.s==='nabootsing'?'':'alarm');
  el.innerHTML=`<div class="triage tone-${toon}"><div class="tg-main"><span class="tg-ic">${ic(icn,22,2.2)}</span><div class="tg-txt"><span class="tg-status">${esc(label)}</span><span class="tg-sub" title="${esc(sub)}">${esc(sub)}</span></div></div>
    <div class="tg-right"><span class="tg-src ${srcTone}">${ic('network',13,2)} ${esc(st.txt)}</span></div></div>`;
}
function tekenStoringen(){
  const el=$('#ct-flt');if(!el)return;const f=ctStoringen();
  const kop=`<div class="flt-h"><span style="display:flex;color:var(--ink-2)">${ic('alarm',17,2)}</span><h3>Storingen van controller en bus</h3></div>`;
  if(!actueel()){el.innerHTML=kop+`<div class="flt-empty">${ic('info',18,2)} Niet te beoordelen: er zijn geen actuele gegevens.</div>`;return;}
  if(!f.length){const C=ctBlok('controller');el.innerHTML=kop+`<div class="flt-empty">${ic(C&&C.gemeten!==false?'check':'info',18,2)} ${C&&C.gemeten!==false?'Geen storing gemeld door de controller en de bus.':'Geen storing gevonden, maar de controller zelf is niet gemeten; zie Systeemdetails.'}</div>`;return;}
  el.innerHTML=kop+`<div class="flt-list">${f.map(x=>`<div class="flt-card tone-${x.sev}"><div class="flt-top"><span class="flt-sev ${x.sev}">${x.sev==='alarm'?'Storing':'Aandacht'}</span><span class="flt-what">${esc(x.t)}</span>${x.plek?`<span class="flt-where">${ic('chip',12,2)} plek ${x.plek}</span>`:''}</div>${x.d?`<div class="flt-now">${ic('info',14,2)}<span>${esc(x.d)}</span></div>`:''}</div>`).join('')}</div>`;
}
function tekenGezondheid(){
  const el=$('#ct-hsum');if(!el)return;
  const t=hMeting('T_BOARD'),sd=hMeting('SD_FREE'),pt=hMeting('PART_TOTAL'),pf=hMeting('PART_FREE'),ax=axioBits();
  /* 22-09: een getal in het cijferlettertype, een woord ("niet meetbaar") in het gewone */
  const cel=(icn,l,toon,v,s,stTxt)=>`<div class="hsum-cell" style="cursor:default"><span class="hsum-ic ${toon}">${ic(icn,17,2)}</span><span class="hsum-tx"><span class="hsum-l">${l}</span><span class="hsum-v${/^[\d−-]/.test(String(v))||v===STREEP?' mono':''}">${v}</span><span class="hsum-s">${s}</span></span><span class="hsum-state ${toon}">${stTxt}</span></div>`;
  let bus;
  if(!ax)bus=cel('network','Axioline-bus','stale',STREEP,'het statusregister is niet gemeten','niet gemeten');
  else if(ax.F_BUS)bus=cel('network','Axioline-bus','alarm','Busfout','de bus is onderbroken','storing');
  else if(ax.F_PF)bus=cel('network','Axioline-bus','alarm','I/O-fout',esc(foutRegTekst(ctBlok('axio'))),'storing');
  else if(ax.F_PW)bus=cel('network','Axioline-bus','warn','Waarschuwing',esc(foutRegTekst(ctBlok('axio'))),'aandacht');
  else if(ax.F_RUN)bus=cel('network','Axioline-bus','ok','Actief','datacycli lopen','in orde');
  else bus=cel('network','Axioline-bus','warn','Niet actief','F_RUN laag: geen data-uitwisseling','aandacht');
  /* geen tegel voor de 24 V-voeding: een AXC F 2152 kan die niet meten (Wessel, 25-09: dan ook niet tonen) */
  el.innerHTML=(t?cel('gauge','Temperatuur','ok',fix(Number(t.v),0)+' °C','board, gemeten','gemeten'):cel('gauge','Temperatuur','stale',STREEP,'niet gemeten','niet gemeten'))
    +(sd?cel('shield','Opslag','ok',fix(Number(sd.v),0)+' % vrij',(pt&&pf)?(fix(Number(pf.v)/1048576,0)+' MB vrij van '+fix(Number(pt.v)/1048576,0)+' MB'):'gebruikerspartitie','gemeten'):cel('shield','Opslag','stale',STREEP,'niet gemeten','niet gemeten'))
    +bus;
  const u=$('#ct-hsum-upd');if(u){const Y=ctBlok('systeem');u.textContent=Y&&Y.leeftijdSec!=null?('gemeten '+fix(Number(Y.leeftijdSec),0)+' s geleden'):(bron.lastOk?('bijgewerkt '+tijdStr(bron.lastOk)):'');}
}
/* de tekening van de controller: identiteit en lampjes, alleen gemeten of zichtbaar niet gemeten */
function ctTekening(){
  const C=ctBlok('controller');const gem=!!(C&&C.gemeten!==false);
  const stuk=MACHINE.stuklijst.find(x=>/^AXC F/.test(x.artikel))||{artikel:'AXC F 2152',art:''};
  const L=['BF-C','BF-D','SF','BOOT','EXT'],R=['RUN','FAIL','DBG','D','E'];const leds=ctLeds();const g=id=>leds.find(l=>l.id===id);
  let lh='';for(let i=0;i<5;i++){const a=g(L[i]),b=g(R[i]);
    lh+=`<button class="hw-led-row" data-led="${a.id}" title="${esc(a.meaning)}">${ledVoor(a,'xs')}<span class="lbl">${a.id}</span></button><button class="hw-led-row" data-led="${b.id}" title="${esc(b.meaning)}">${ledVoor(b,'xs')}<span class="lbl">${b.id}</span></button>`;}
  const poorten=gem&&isFinite(Number(C.ethPoorten))&&Number(C.ethPoorten)>0?Number(C.ethPoorten):0;

/* ==================================================================
   INSTELLINGEN WIJZIGEN - direct in de tegel of de tabel (22-09, Wessel:
   "in de instellingen van service heb je voor elke waarde een hele pop-up met
   allemaal info ... al die extra info is niet nodig. zorg dat je daar gewoon
   direct de waarde kan instellen").
   - Elke waarde heeft − waarde + (zoals bij Recepten), met de stap van de
     instelling, binnen de grenzen die de PLC meldt. De uitleg staat alleen
     nog als hulptekst (title).
   - Wat je wijzigt, wordt oranje en komt in de balk onderaan. "Naar de PLC
     sturen" stuurt ze een voor een als POST /command/instelling; 'verwerkt'
     pas als een volgende momentopname de nieuwe waarde toont.
   - Het concept staat alleen in dit scherm; niets in de browser bewaard.
   ================================================================== */
const WIE_RANG={gebruiker:0,service:1,configuratie:2};
function magWijzigen(p){if(!p||p.alleenLezen||p.wie==='automatisch')return false;return sessieRang()>=(WIE_RANG[p.wie]??9);}
/* wijzigen tonen: als het nu mag, of als de brug een inlog kent (dan vraagt het slotje eerst de inlog) */
function toonWijzig(p){return !!p&&!p.alleenLezen&&p.wie!=='automatisch'&&(magWijzigen(p)||inlogBekend());}
function grenzen(naam){const s=actueel();const g=s&&s.grenzen&&s.grenzen[naam];return g&&typeof g==='object'?g:null;}
let insCon={};   /* het concept: 'naam|index' -> getal */
const insSl=(naam,index)=>naam+'|'+(index==null?'':String(index));
function insUitSl(k){const i=k.indexOf('|');const naam=k.slice(0,i),r=k.slice(i+1);return {naam,index:r===''?null:(/^\d+$/.test(r)?Number(r):r)};}
function insStap(p){return p&&p.stap?p.stap:(p&&p.dec>0?Math.pow(10,-p.dec):1);}
function insNu(naam,index){const k=insSl(naam,index);return k in insCon?insCon[k]:insGetal(naam,index);}
/* binnen de grenzen van de PLC, nooit onder 0, afgerond op de decimalen van de instelling */
function insKlem(p,naam,w){const g=grenzen(naam);let v=w;
  if(g&&g.min!=null&&isFinite(Number(g.min)))v=Math.max(Number(g.min),v);if(g&&g.max!=null&&isFinite(Number(g.max)))v=Math.min(Number(g.max),v);
  v=Math.max(0,v);const f=Math.pow(10,p&&p.dec!=null?p.dec:1);return Math.round(v*f)/f;}
function waardeCel(naam,index,d){
  const n=instelling(naam,index);const p=parInfo(naam);
  const dd=d!=null?d:(p&&p.dec!=null?p.dec:1);   // decimalen per instelling
  const eenheid=n&&n.u?n.u:(p?p.eenheid:'');
  const vast=`<span class="val mono">${n?tekstWaarde({v:n.v,u:eenheid,q:n.q},dd):STREEP}</span> ${qVlag(n)}`;
  /* de PLC meldt deze waarde niet (of slecht): niets om te wijzigen */
  if(!toonWijzig(p)||!n||n.q==='bad'||insGetal(naam,index)===null)return vast;
  if(!magWijzigen(p))return `${vast} <button type="button" class="btn sm ins-slot" data-inslog="${esc(p.wie)}" title="Inloggen om te wijzigen" aria-label="Inloggen om ${esc(p.label)} te wijzigen">${ic('lock',14,2)}</button>`;
  const k=insSl(naam,index);const tip=p.tl+(p.ontwerp&&p.ontwerp!==STREEP?' Ontwerp: '+p.ontwerp+' '+p.eenheid+'.':'');
  return `<span class="ins-w"><span class="tw-st ins-st${k in insCon?' anders':''}" data-ins="${esc(k)}" title="${esc(tip)}"><button type="button" data-insd="-1" aria-label="Minder">−</button><input data-insi inputmode="decimal" value="${esc(fix(insNu(naam,index),dd))}" aria-label="${esc(p.label)}"><button type="button" data-insd="1" aria-label="Meer">+</button></span><span class="ins-e">${esc(eenheid)}</span></span>`;
}
function insZet(k,w){const {naam,index}=insUitSl(k);const plc=insGetal(naam,index);
  if(plc!==null&&Math.abs(plc-w)<1e-9)delete insCon[k];else insCon[k]=w;$('#in-st')&&($('#in-st').innerHTML='');verversInstellingen();}
function insKlik(e){const t=e.target;
  const lg=t.closest('[data-inslog]');if(lg){const w=lg.dataset.inslog;vraagInlog(w==='gebruiker'?'bediening':w,verversInstellingen);return;}
  const d=t.closest('[data-insd]');if(d){const st=d.closest('[data-ins]');const k=st.dataset.ins;const {naam,index}=insUitSl(k);const p=parInfo(naam);
    const nu=insNu(naam,index);if(nu===null)return;const w=insKlem(p,naam,nu+Number(d.dataset.insd)*insStap(p));
    if(w===nu){const g=grenzen(naam);toast(Number(d.dataset.insd)>0?('Hoogstens '+fix(g&&g.max!=null?Number(g.max):w,p.dec||0)+' '+p.eenheid):('Minstens '+fix(g&&g.min!=null?Number(g.min):0,p.dec||0)+' '+p.eenheid),'warn');return;}
    insZet(k,w);return;}
  if(t.closest('#in-annuleer')){insCon={};$('#in-st').innerHTML='';verversInstellingen();toast('Terug naar wat de PLC heeft','check');return;}
  if(t.closest('#in-stuur')){insStuur();return;}}
/* intikken: bij 'change' (Enter of wegtikken); buiten de grenzen = naar de grens, met een melding */
function insInvoer(e){const inp=e.target.closest('[data-insi]');if(!inp)return;const k=inp.closest('[data-ins]').dataset.ins;const {naam}=insUitSl(k);const p=parInfo(naam);
  const v=twGetal(inp.value);if(v===null){toast('Vul een getal in','warn');verversInstellingen();return;}
  const w=insKlem(p,naam,v);if(Math.abs(w-v)>1e-9)toast('Binnen de grenzen: '+fix(w,p.dec||0)+' '+p.eenheid,'warn');insZet(k,w);}
function insBalk(){const el=$('#in-balk');if(!el)return;const ks=Object.keys(insCon);
  if(!ks.length){el.hidden=true;return;}el.hidden=false;
  const wat=ks.map(k=>{const {naam,index}=insUitSl(k);const p=parInfo(naam);const plc=insGetal(naam,index);
    const waar=index==null?'':(' '+(typeof index==='number'?stofNaam(index):String(index)));
    return `${esc(p?p.label:naam)}${esc(waar)}: ${plc===null?STREEP:esc(fix(plc,p.dec||0))} → <b>${esc(fix(insCon[k],p.dec||0))}</b> ${esc(p?p.eenheid:'')}`;});
  $('#in-balk-tx').innerHTML=`<b>${ks.length} ${ks.length===1?'wijziging':'wijzigingen'}</b> <span class="muted-2">· ${wat.join(' · ')}</span>`;}
/* versturen: een voor een; 'verwerkt' pas als de PLC de nieuwe waarde teruggeeft */
async function insStuur(){const ks=Object.keys(insCon);const st=$('#in-st');const knop=$('#in-stuur');if(!ks.length||!st)return;
  const v=vers();if(!v.ok){st.innerHTML=`<div class="check-banner error"><div class="cb-h">${ic('warn',16,2)} ${v.brugOk?'Geen verse gegevens van de PLC':'Geen verbinding met de brug'}</div><div>Er is niets verstuurd.</div></div>`;return;}
  knop.disabled=true;const fout=[];let ok=0;
  for(const k of ks){const {naam,index}=insUitSl(k);const w=insCon[k];const p=parInfo(naam);
    st.innerHTML=`<div class="hw-hint">${ic('clock',14,2)} ${esc(p?p.label:naam)}: versturen…</div>`;
    const r=await opdracht('instelling',{naam,index,waarde:w});
    if(!r.ok){fout.push(r.status===501?nietNaarPlc('deze instellingen'):(esc(p?p.label:naam)+': '+esc(r.fout||'niet opgeslagen')));if(r.status===501)break;continue;}
    const klopt=await wachtOp(()=>{const n=insGetal(naam,index);return n!==null&&Math.abs(n-w)<1e-9;},10000);
    if(klopt){ok++;delete insCon[k];}else fout.push(esc(p?p.label:naam)+': de PLC gaf de nieuwe waarde niet terug binnen 10 s');}
  knop.disabled=false;verversInstellingen();
  st.innerHTML=(ok?`<div class="check-banner" style="border-color:var(--ok);margin-bottom:8px"><div class="cb-h" style="color:var(--ok)">${ic('check',16,2)} ${ok} ${ok===1?'waarde':'waarden'} verwerkt: ${wieBron()} geeft ze terug</div></div>`:'')
    +(fout.length?`<div class="check-banner ${ok?'warn':'error'}"><div class="cb-h">${ic('warn',16,2)} Niet alles verwerkt</div><div>${[...new Set(fout)].join('<br>')}</div></div>`:'');}
/* tabel met enkelvoudige parameters: de naam met één regel uitleg, en rechts direct de waarde (22-09) */
function parTabel(lijst){

    `<tr><td><b>${esc(p.label)}</b><div class="muted-2" style="font-size:12px">${esc(p.tl)}</div></td><td class="r" id="pv-${esc(p.naam)}" title="${esc(p.naam)}">${STREEP}</td></tr>`).join('')}</tbody></table>`;

/* Welke bronnen er zijn, hoe ze heten en bij welke groep ze horen: B_bron.js, 'de configuratie van de
   machine' (actieveBronnen, stofNaam, bronGroep, bakGroep). Eén plek voor elk scherm. */

/* ==================================================================
   RECEPTEN (bediening) - ontwerp §2.2, §2.8, §7, §9.1-§9.3 en §9.5.
   De teler vult per bak in, in liters per 1000 liter; de omrekening naar
   de batch doet de PLC (§9.2). Een wijziging gaat als POST /command/recept
   naar de brug en heet pas 'verwerkt' als de PLC hem teruggeeft. De
   waterbalans (§7) rekent de PLC uit; dit scherm laat hem alleen zien.
   Er staan alleen de bronnen die de PLC in gebruik meldt (configuratie).
   Een cel waarvan de stof niet bij de groep van de bak past (A/B, besluit
   22-09), is grijs en niet in te vullen. De PLC toetst dat zelf ook.
   ================================================================== */
/* de zuurbak en de sporenbakken in gebruik: bakken met een directe beurt (§5.2) */
function directeBakken(){return [{bak:'ZB',naam:'Zuurbak'},...sporenInGebruik().map(h=>({bak:h.bak,naam:stofNaam(h.nr)}))];}
function bakNaamVan(bak){const w=WERKBAKKEN.find(x=>x.bak===bak);return w?locNaam(w.loc):((directeBakken().find(x=>x.bak===bak)||{}).naam||bak);}
function pastNietTekst(n,bak){const gs=bronGroep(n),gb=bakGroep(bak);
  if(!gs)return stofNaam(n)+' heeft nog geen groep. Stel die in bij Configuratie.';
  if(!gb)return bakNaamVan(bak)+' heeft nog geen groep. Stel die in bij Configuratie.';
  return stofNaam(n)+' is een '+GROEPEN[gs].naam+'-stof en mag niet in '+bakNaamVan(bak)+' (groep '+GROEPEN[gb].naam+').';}
function receptenBlok(){const s=actueel();return s&&s.recepten&&typeof s.recepten==='object'?s.recepten:null;}
function recept(bak,n){const r=receptenBlok();const a=r?r[bak]:null;return Array.isArray(a)?norm(a[Number(n)-1]):null;}
/* viewRecepten, mountRecepten en verversRecepten staan sinds 22-09 middag in F2_recepten.js (de tweeling). */
/* receptentabel: een rij per bron in gebruik, een kolom per bak. De zuurbak en de sporenbakken krijgen
   alleen mestbakken: een sporenbak is geen grondstof voor een andere directe beurt. */
function receptTabel(bakken,alleenMest){
  const r=receptenBlok();const s=actueel();
  if(!s)return `<div class="empty" style="padding:22px">Geen actuele gegevens.</div>`;
  if(!r)return `<div class="empty" style="padding:22px">De brug levert (nog) geen recepten.</div>`;
  const lijst=alleenMest?actieveMest():actieveBronnen();
  if(!lijst)return `<div class="empty" style="padding:22px">De PLC meldt geen configuratie; zonder die weet het scherm niet welke bakken er zijn.</div>`;
  let h=`<table class="tbl rc-tbl"><thead><tr><th>#</th><th>Stof</th><th>Groep</th>${bakken.map(b=>{const g=bakGroep(b.bak);return `<th class="r">${esc(b.kop)} ${groepChip(g)}</th>`;}).join('')}</tr></thead><tbody>`;
  lijst.forEach(n=>{const gs=bronGroep(n);
    h+=`<tr><td class="mono">${esc(bronLabel(n))}</td><td>${esc(stofNaam(n))}</td><td>${groepChip(gs)}</td>${bakken.map(b=>{
      const x=recept(b.bak,n);const leeg=!x||x.q==='bad';
      if(!groepPast(gs,bakGroep(b.bak))){const fout=!leeg&&Number(x.v)>0;
        return `<td class="r"><button class="rc-cel past-niet${fout?' fout':''}" data-recept="${esc(b.bak)}|${n}" data-past="nee" title="Past niet bij deze bak (A/B)">${fout?(ic('warn',12,2)+' '+tekstWaarde({v:x.v,u:'',q:x.q},1)):'past niet'}</button></td>`;}
      const k=b.bak+'|'+n;const con=k in rdCon;const val=con?rdCon[k]:(leeg?null:Number(x.v));
      return `<td class="r"><span class="tw-st rd-st${con?' anders':''}" data-rd="${esc(b.bak)}|${n}"><button type="button" data-rds="-1" aria-label="Minder">−</button><input data-rdi inputmode="decimal" value="${val==null?'':esc(fix(val,1))}" placeholder="${STREEP}" aria-label="${esc(b.kop)} · ${esc(stofNaam(n))} in liter ${perRef()}"><button type="button" data-rds="1" aria-label="Meer">+</button></span>${qVlag(x)}</td>`;}).join('')}</tr>`;});
  return h+'</tbody></table>';
}
/* het wijzigvenster per cel is sinds 23-09 vervangen door − en + in de tabel zelf (rdKlik in F2_recepten.js) */

/* ==================================================================
   INSTELLINGEN (service) - ontwerp §9.1 en §9.3
   ================================================================== */
/* Indeling (besluit Wessel 22-09): eerst per bak wanneer hij gevuld wordt, dan de menger van de sporenbakken, dan
   de machine zelf. Een werkbak en de zuurbak hebben geen menger: daar staat alleen 'vullen start onder'. */
function viewInstellingen(){
  /* het pulsgewicht van de flowmeter staat sinds 22-09 alleen op Kalibratie (één plek, besluit Wessel) */
  const enkel=ONTWERP.parameters.filter(p=>p.wie==='service'&&p.per==='');
  return `<div id="in-wrap"><div class="page-head"><div class="titles"><h1>Instellingen</h1><p>Wat het gedrag van de machine bepaalt · waarden uit de PLC · met − en + direct instellen</p></div></div>
   <div class="card" style="margin-bottom:16px"><div class="card-h"><h3>Vullen · werkbakken en zuurbak</h3><span class="sub">zakt het niveau onder de grens, dan vraagt de bak om een vulling · 30 tot 40 %</span></div><div class="in-tegels" id="in-vul"></div>
     <div class="hw-hint" style="padding:0 16px 14px">${ic('info',14,2)} <span>Ruimte bij de start: wat er nog in de werkbak past als het vullen begint. Is dat minder dan een batch, dan blijft de rest in de tussenbak. De werkbak loopt ondertussen wel verder leeg.</span></div></div>
   <div class="card" style="margin-bottom:16px"><div class="card-h"><h3>Sporenbakken · vullen en menger</h3><span class="sub">de menger draait op tijd; het niveau is alleen de toestemming om een draaibeurt te beginnen</span></div><div id="in-sp"></div></div>
   <div class="card" style="margin-bottom:16px"><div class="card-h"><h3>Algemeen</h3><span class="sub">water, toerentallen, mengen · het batchvolume staat bij Configuratie</span></div>${parTabel(enkel)}</div>
   <div class="card" style="margin-bottom:16px"><div class="card-h"><h3>Per stof</h3><span class="sub">fijnvolume, spoelvolume en pomptijd per meststof · de geleerde naloop houdt de PLC zelf bij · de lektesttijd staat bij Configuratie</span></div><div id="in-mst"></div></div>
   <div class="card" id="bs-kaart"></div>
   <div class="cf-balk" id="in-balk" hidden><div class="cf-balk-tx" id="in-balk-tx"></div><button type="button" class="btn" id="in-annuleer">Annuleren</button><button type="button" class="btn primary" id="in-stuur">${ic('check',16,2.2)} Naar de PLC sturen</button></div>
   <div id="in-st" style="margin-top:12px"></div></div>`;
}
function mountInstellingen(){const w=$('#in-wrap');if(!w)return;w.addEventListener('click',insKlik);w.addEventListener('change',insInvoer);
  w.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.matches&&e.target.matches('[data-insi]'))e.target.blur();});}
/* een getal uit de PLC, of null (slechte kwaliteit of geen getal) */
function insGetal(naam,index){const n=instelling(naam,index);if(!n||n.q==='bad')return null;const f=Number(n.v);return isFinite(f)?f:null;}
/* het niveau in woorden: één decimaal als het dicht bij de grens zit, zodat '40 %' niet onder 40 % om een vulling vraagt */
function pctTekst(pc,gr){if(pc===null)return STREEP;const d=(gr!==null&&Math.abs(pc-gr)<1)||pc<10?1:0;return fix(pc,d)+' %';}
function inAanvraag(bak){const st=stand();return !!(st&&Array.isArray(st.aanvragen)&&st.aanvragen.map(String).includes(bak));}
/* de tegel van een bak zonder menger: niveau nu, de grens, en voor een werkbak wat er bij de start nog bij past */
function inVulTegel(b){
  const pc=niveauPct(b.bak,b.loc);const gr=insGetal('P_NivStart',b.bak);const cap=bakInhoud(b.bak);const batch=batchVol();
  let noot='';
  if(inAanvraag(b.bak))noot=`<div class="in-noot vraagt">${ic('info',13,2)} vraagt nu om een vulling</div>`;
  if(b.soort==='werk'&&gr!==null&&cap&&batch){const ruimte=(100-gr)/100*cap;
    /* 22-09: in gewone woorden wat de oranje regel betekent, in plaats van twee getallen */
    noot+=ruimte<batch?`<div class="in-noot warn" title="De batch past bij de start niet helemaal: de rest blijft in de tussenbak.">${ic('warn',13,2)} batch past niet helemaal: ${fix(ruimte,0)} L ruimte voor ${fix(batch,0)} L</div>`
      :`<div class="in-noot" title="De batch past bij de start.">ruimte bij de start ${fix(ruimte,0)} L · batch ${fix(batch,0)} L</div>`;}
  return `<div class="in-tegel"><div class="in-kop"><b>${esc(b.naam)}</b> ${groepChip(bakGroep(b.bak))}<span class="mono muted-2">nu ${pctTekst(pc,gr)}</span></div>
    <div class="in-balk" title="niveau nu en de vulgrens">${pc!==null?`<i class="n" style="width:${Math.max(0,Math.min(100,pc)).toFixed(1)}%"></i>`:''}${gr!==null?`<i class="g" style="left:${Math.max(0,Math.min(100,gr)).toFixed(1)}%"></i>`:''}</div>
    <div class="in-rij in-rij-st"><span class="k">Vullen start onder</span>${waardeCel('P_NivStart',b.bak,0)}</div>${noot}</div>`;
}
/* tekening van een sporenbak: het niveau, de vulgrens (streep) en 'menger aan vanaf' (stippel) */
function inTank(pc,gr,mg){const h=72,y=v=>(4+h*(1-Math.max(0,Math.min(100,v))/100)).toFixed(1);
  return `<svg class="in-tank" viewBox="0 0 48 80" width="48" height="80" aria-hidden="true"><rect x="4" y="4" width="40" height="${h}" rx="4" class="wand"/>${pc!==null?`<rect x="5" y="${y(pc)}" width="38" height="${(76-y(pc)).toFixed(1)}" rx="3" class="liq"/>`:''}${gr!==null?`<line x1="2" x2="46" y1="${y(gr)}" y2="${y(gr)}" class="lijn-vul"/>`:''}${mg!==null?`<line x1="2" x2="46" y1="${y(mg)}" y2="${y(mg)}" class="lijn-mg"/>`:''}</svg>`;}
/* wat de PLC de menger laat doen, in woorden */
function mengerTekst(bak){const m=menger(bak);if(!m)return {t:'De PLC meldt de menger (nog) niet.',k:''};
  const min=s=>{const n=Number(s);return isFinite(n)&&n>0?Math.max(1,Math.ceil(n/60))+' min':'';};
  const r=String(m.reden||'');
  if(m.stand==='draait')return {t:(r==='na vullen'?'Menger draait na het vullen':'Menger draait')+(min(m.restS)?' · nog '+min(m.restS):''),k:'ok'};
  if(m.stand==='rust')return {t:'Menger in rust'+(min(m.restS)?' · volgende draaibeurt over '+min(m.restS):''),k:''};
  if(m.stand==='wacht'){const w={'te laag':'het niveau is onder "menger aan vanaf"','niveau onbekend':'het niveau is onbekend (niet geijkt of een storing)','dosering':'er wordt uit deze bak gedoseerd'}[r]||r;
    return {t:'Menger wacht'+(w?': '+w:''),k:'warn'};}
  if(m.stand==='uit')return {t:'Menger uit'+(r?' · '+r:''),k:''};
  return {t:'Onbekende stand: '+String(m.stand),k:'warn'};}
function inSporenRij(b){
  const pc=niveauPct(b.bak,b.loc);const gr=insGetal('P_NivStart',b.bak);const mg=insGetal('P_NivRoerderAan',b.bak);const mt=mengerTekst(b.bak);
  const cel=(naam,k)=>`<div class="in-cel"><span class="k">${k}</span>${waardeCel(naam,b.bak,0)}</div>`;
  const let_op=(gr!==null&&mg!==null&&mg>gr)?`<div class="in-noot warn">Tussen ${fix(gr,0)} en ${fix(mg,0)} % wordt deze bak niet gemengd en ook niet gevuld.</div>`:'';
  return `<div class="in-sp">${inTank(pc,gr,mg)}<div class="in-sp-mid">
    <div class="in-kop"><b>${esc(b.naam)}</b> ${groepChip(bakGroep(b.bak))}<span class="mono muted-2">${esc(b.bak)} · nu ${pctTekst(pc,gr)}</span></div>
    <div class="in-sp-grid">${cel('P_NivStart','Vullen start onder')}${cel('P_NivRoerderAan','Menger aan vanaf')}${cel('P_TijdRoerderAan','Draaien')}${cel('P_TijdRoerderRust','Rust')}${cel('P_TijdRoerderNaVullen','Na vullen')}</div>
    ${inAanvraag(b.bak)?`<div class="in-noot vraagt">${ic('info',13,2)} vraagt nu om een vulling</div>`:''}<div class="in-noot ${mt.k}">${esc(mt.t)}</div>${let_op}</div></div>`;
}
function verversInstellingen(){
  if($('#bs-kaart')&&!$('#bs-kaart').innerHTML)bestandKaart();
  const vul=$('#in-vul');
  if(vul)vul.innerHTML=vulBakken().filter(b=>b.soort!=='sporen').map(inVulTegel).join('');
  const sp=$('#in-sp');
  if(sp){const hs=vulBakken().filter(b=>b.soort==='sporen');
    sp.innerHTML=hs.length?`<div class="in-legenda"><span><i class="lv"></i> vullen start onder</span><span><i class="lm"></i> menger aan vanaf</span></div>${hs.map(inSporenRij).join('')}`
      :`<div class="empty" style="padding:18px">Geen sporenbakken in gebruik (Configuratie).</div>`;}
  verversParTabel(ONTWERP.parameters.filter(p=>p.wie==='service'&&p.per===''));
  const el=$('#in-mst');
  if(el){const lijst=actieveBronnen();
    if(!lijst){el.innerHTML=`<div class="empty" style="padding:18px">${actueel()?'De PLC meldt geen configuratie; zonder die weet het scherm niet welke bakken er zijn.':'Geen actuele gegevens.'}</div>`;}
    else{/* fijnvolume en spoelvolume per meststof sinds 22-09 (besluit Wessel) */
      let h=`<table class="tbl ins-tbl"><thead><tr><th>#</th><th>Stof</th><th>Groep</th><th class="r">Fijnvolume<br><span class="ins-kop-uitleg">de laatste liters, op laag toeren</span></th><th class="r">Spoelvolume<br><span class="ins-kop-uitleg">water ná deze stof</span></th><th class="r">Verwachte pomptijd<br><span class="ins-kop-uitleg">flowbewaking</span></th><th class="r">Geleerde naloop<br><span class="ins-kop-uitleg">houdt de PLC zelf bij</span></th></tr></thead><tbody>`;
      lijst.forEach(n=>{h+=`<tr><td class="mono">${esc(bronLabel(n))}</td><td>${esc(stofNaam(n))}</td><td>${groepChip(bronGroep(n))}</td><td class="r">${waardeCel('P_VolFijn',n,1)}</td><td class="r">${waardeCel('P_VolSpoel',n,0)}</td><td class="r">${waardeCel('P_TijdPomp',n,0)}</td><td class="r">${waardeCel('P_VolNaloop',n,2)}</td></tr>`;});
      el.innerHTML=h+'</tbody></table>';}}
  insBalk();
}

/* ==================================================================
   CONFIGURATIE (bij de ingebruikname) - besluit Wessel 22-09, kennisbank
   4-hmi\03-configuratie.md. De monteur stelt hier in wat er aan deze
   machine in gebruik is: het aantal mestbakken (3-20) en sporenbakken
   (0-5), per bak de naam, de groep (A, B of A+B) en de lektesttijd, de
   groep van de zuurbak en de inhoud van de bakken.
   - Het concept staat alleen in dit scherm, tot Toepassen. Dan gaat de
     hele set in één opdracht naar de brug (POST /command/configuratie).
     De PLC toetst hem en neemt hem alleen in rust over. 'Verwerkt' pas als
     de momentopname de nieuwe versie én de nieuwe waarden toont.
   - Vaste plaatsnummers: een aantal kleiner maken verbergt alleen; het
     concept onthoudt wat er stond.

const CFG_G=ONTWERP.configuratie;

function cfNum(x){const n=norm(x);if(!n||n.q==='bad')return '';const v=Number(n.v);return Number.isFinite(v)?v:'';}

function gNaam(g){return GROEPEN[g]?GROEPEN[g].naam:'geen';}

function cfLeeg(){const k={bron:{},bewerkt:false,vanIo:false,basisVersie:null,aantalMeststof:'',aantalSporenbak:'',zuurbakGroep:'',
    volReferentie:'',volBatch:'',volWerkbak:{},volTussenbak:{TBA:'',TBB:''},volZuurbak:'',volSporenbak:['','','','','']};

/* het concept uit wat de PLC meldt */
function cfUitPlc(c){const k=cfLeeg();if(!c)return k;
  k.basisVersie=c.versie!=null&&isFinite(Number(c.versie))?Number(c.versie):null;
